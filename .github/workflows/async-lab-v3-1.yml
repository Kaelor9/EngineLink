name: Build EngineLink ASYNC LAB v3.1 (test only)
on:
  push:
    branches: [experiment/enginelink-async-v3-1-1-fix]
    paths:
      - 'experiments/chatgpt-async-lab-v3-1/**'
      - 'tools/stage_chatgpt_test.py'
      - 'site/chatgpt-async-lab-v3-1/**'
      - '.github/workflows/async-lab-v3-1.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: enginelink-async-v3-1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.x'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/staging
            ~/.arduino15/packages
          key: esp32-3.3.12-async-v3-1-libs-3.12.1
      - name: Install Arduino ESP32-S3 core
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          python3 tools/prefetch_arduino_tools.py --version 3.3.12
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL"
      - name: Install pinned AsyncTCP and ESPAsyncWebServer
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Async TCP@3.5.0"
          arduino-cli lib install "ESP Async WebServer@3.12.1"
      - name: Use original cosmetic UI for comparison only
        run: cp firmware/EngineLink/ui.h experiments/chatgpt-async-lab-v3-1/EngineLink/ui.h
      - name: Validate embedded UI JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('experiments/chatgpt-async-lab-v3-1/EngineLink/lab_ui.h').read_text()
          script=re.search(r'<script>(.*?)</script>',s,re.S)
          assert script, "JavaScript not found"
          assert "WebSocket" in script.group(1)
          Path('/tmp/async-lab-v3-1.js').write_text(script.group(1))
          PY
          node --check /tmp/async-lab-v3-1.js
      - name: Check recovery endpoint, boot gate and release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/chatgpt-async-lab-v3-1/EngineLink/EngineLink.ino').read_text()
          u=Path('experiments/chatgpt-async-lab-v3-1/EngineLink/lab_ui.h').read_text()
          i=Path('site/chatgpt-async-lab-v3-1/index.html').read_text()
          assert '0.0.3.1-chatgpt-async-lab' in p and '0.0.3.1-chatgpt-async-lab' in i
          assert 'web.on("/lab/health",HTTP_GET' in p
          assert 'healthyHttpRequests>0' in p
          assert 'esp_ota_mark_app_valid_cancel_rollback()' in p
          assert "getJson(url)" in u and "refreshHealth()" in u
          assert "I have a valid recovery plan" not in u
          print("Plain-text health, real-client boot gate and version all found.")
          PY

      - name: Compile real async firmware
        run: |
          mkdir -p build-async-v3-1
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            --output-dir build-async-v3-1 --export-binaries \
            experiments/chatgpt-async-lab-v3-1/EngineLink
      - name: Stage clearly labelled isolated OTA and USB packages
        run: |
          python3 tools/stage_chatgpt_test.py \
            --build build-async-v3-1 \
            --dest build-async-v3-1/installer \
            --version 0.0.3.1-chatgpt-async-lab \
            --ota-name enginelink-update-CHATGPT-ASYNC-LAB-V3-1.bin
          cp site/chatgpt-async-lab-v3-1/index.html build-async-v3-1/installer/index.html
      - name: Save test-only artifacts (not a normal EngineLink release)
        uses: actions/upload-artifact@v4
        with:
          name: ENG-LINK-ASYNC-LAB-V3-1-TEST-${{ github.sha }}
          path: build-async-v3-1/installer/*
          if-no-files-found: error
