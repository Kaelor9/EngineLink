name: Build EngineLink and publish downloads

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'firmware/EngineLink/**'
      - 'firmware/ui/**'
      - 'tools/demo/**'
      - 'tools/build_demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write   # creates the GitHub Release the board updates from
  pages: write
  id-token: write

concurrency:
  group: enginelink-pages
  cancel-in-progress: true

env:
  ARDUINO_CORE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FQBN: esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 core and NeoPixel
        run: |
          arduino-cli core update-index --additional-urls "$ARDUINO_CORE_URL"
          arduino-cli core install esp32:esp32 --additional-urls "$ARDUINO_CORE_URL"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Generate embedded on-device UI
        run: python3 tools/build_ui.py

      - name: Compile EngineLink application
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --export-binaries \
            firmware/EngineLink

      - name: Stage USB image, Wi-Fi update image and manifest
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          # The firmware source is the single source of truth for the version.
          VERSION="$(sed -n 's/^#define EL_VERSION "\(.*\)"/\1/p' firmware/EngineLink/EngineLink.ino)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          MERGED_FILE="$(find build -maxdepth 1 -name '*.merged.bin' -type f | head -n 1)"
          APP_FILE="build/EngineLink.ino.bin"
          test -s "$MERGED_FILE"
          test -s "$APP_FILE"
          cp "$MERGED_FILE" site/firmware.bin
          cp "$APP_FILE" site/enginelink-update.bin
          VERSION="$VERSION" python3 - <<'PY'
          import json, os, pathlib, hashlib
          version=os.environ["VERSION"]
          usb=pathlib.Path("site/firmware.bin"); ota=pathlib.Path("site/enginelink-update.bin")
          assert 100_000 < usb.stat().st_size <= 8*1024*1024, usb.stat().st_size
          assert 100_000 < ota.stat().st_size <= 3*1024*1024, ota.stat().st_size
          data=ota.read_bytes()
          assert data[0]==0xE9 and data[0x20:0x24]==bytes([0x32,0x54,0xCD,0xAB]), "update image lacks app descriptor"
          manifest={
            "name":"EngineLink App (alpha)",
            "version":version,
            "new_install_prompt_erase":True,
            "builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"firmware.bin","offset":0}]}]
          }
          pathlib.Path("site/manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          info={"version":version,"usbBytes":usb.stat().st_size,"updateBytes":ota.stat().st_size,
                "updateSha256":hashlib.sha256(data).hexdigest()}
          pathlib.Path("site/release.json").write_text(json.dumps(info,indent=2)+"\n")
          # Cache-bust page assets so browsers never mix old scripts with a new manifest.
          idx=pathlib.Path("site/index.html")
          idx.write_text(idx.read_text().replace("__VERSION__",version))
          print("Staged EngineLink",version,"USB",usb.stat().st_size,"update",ota.stat().st_size)
          PY

      - name: Publish GitHub Release and the firmware list
        # EngineLink reads releases.json over Wi-Fi and downloads the chosen
        # update image from the GitHub Release. A version that already has a
        # release is left alone, so a docs-only push never replaces firmware.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          set -euo pipefail
          # GitHub's Releases API occasionally returns HTTP 500/502/503.
          # A transient API failure must not abort an otherwise valid firmware
          # build or leave the installer stuck on the previous version.
          gh_retry() {
            local attempt=1 delay=4
            until "$@"; do
              if (( attempt >= 6 )); then
                echo "::error::GitHub API failed after 6 attempts: $1" >&2
                return 1
              fi
              echo "::warning::GitHub API temporarily failed (attempt ${attempt}/6), retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt+1))
              delay=$((delay*2))
            done
          }
          TAG="v$VERSION"
          # Retry the read, and never interpret an API 500 as 'release missing'.
          # A 404 is the only expected reason to create a new release.
          HTTP_CODE=""
          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE="$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null | head -n 1 || true)"
            if [[ "$HTTP_CODE" == *" 200 "* || "$HTTP_CODE" == *" 404 "* ]]; then break; fi
            if (( attempt == 6 )); then
              echo "::error::Unable to check release $TAG after retries: $HTTP_CODE"
              exit 1
            fi
            echo "::warning::GitHub release lookup failed; retrying in 5s ($attempt/6)"
            sleep 5
          done
          if [[ "$HTTP_CODE" == *" 404 "* ]]; then
            NOTES_FILE="docs/releases/$TAG.md"
            if [ -s "$NOTES_FILE" ]; then NOTES="$(cat "$NOTES_FILE")"; else NOTES="EngineLink $VERSION"; fi
            PRE=""
            case "$VERSION" in *-*) PRE="--prerelease";; esac
            # Creation may succeed even if GitHub returns a transient error.
            # Re-check existence between attempts to avoid duplicate releases.
            CREATED=false
            for attempt in 1 2 3 4 5 6; do
              if gh release create "$TAG" site/enginelink-update.bin site/firmware.bin \
                --target "$GITHUB_SHA" --title "EngineLink $VERSION" --notes "$NOTES" $PRE; then
                CREATED=true; break
              fi
              if gh release view "$TAG" >/dev/null 2>&1; then CREATED=true; break; fi
              if (( attempt == 6 )); then break; fi
              echo "::warning::Release creation failed; retrying in 8s ($attempt/6)"
              sleep 8
            done
            if [[ "$CREATED" != true ]]; then
              echo "::error::Could not create $TAG after 6 attempts"
              exit 1
            fi
          fi
          # Use an atomic temporary file per attempt; never publish partial JSON.
          # gh api pretty-prints JSON, so parse the complete JSON array below.
          gh_retry gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY2'
          import json, os
          with open("/tmp/releases.json") as fh:
              rels = json.load(fh)
          repo = os.environ["GITHUB_REPOSITORY"]
          out = []
          for r in rels:
              if r.get("draft"): continue
              asset = next((a for a in r.get("assets", []) if a["name"] == "enginelink-update.bin"), None)
              if not asset: continue
              tag = r["tag_name"]
              out.append({
                  "v": tag[1:] if tag.startswith("v") else tag,
                  "date": (r.get("published_at") or r.get("created_at") or "")[:10],
                  "pre": bool(r.get("prerelease")),
                  "notes": (r.get("body") or "").strip()[:300],
                  "url": f"https://github.com/{repo}/releases/download/{tag}/enginelink-update.bin",
                  "size": asset["size"],
              })
          out.sort(key=lambda x: x["date"], reverse=True)
          json.dump({"releases": out[:15]}, open("site/releases.json", "w"), indent=2)
          print("releases.json:", [x["v"] for x in out[:15]])
          PY2

      - name: Build the app demo
        # site/demo: the phone app against a simulated boat, in the browser.
        run: python3 tools/build_demo.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Archive compiled EngineLink binaries
        uses: actions/upload-artifact@v4
        with:
          name: EngineLink-App-v${{ steps.stage.outputs.version }}-ESP32S3
          path: |
            site/firmware.bin
            site/enginelink-update.bin
            site/manifest.json
            site/release.json
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
