name: Compile EngineLink application

on:
  push:
    branches: [main]
    paths:
      - 'firmware/EngineLink/**'
      - 'firmware/ui/**'
      - 'tools/build_ui.py'
      - 'tools/prefetch_arduino_tools.py'
      - '.github/workflows/build-engine.yml'
  pull_request:
    paths:
      - 'firmware/EngineLink/**'
      - 'firmware/ui/**'
      - 'tools/build_ui.py'
      - 'tools/prefetch_arduino_tools.py'
      - '.github/workflows/build-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a running build of the same branch.
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # never an endless run; a normal one takes 3-8 min
    steps:
      - uses: actions/checkout@v4
      # arduino-cli 1.2.2 (the version every local build used) from Arduino's
      # own download server, checked by its SHA-256: on 2026-11-08 the
      # setup-arduino-cli action failed on GitHub 504s, exact version or not.
      - name: Install arduino-cli 1.2.2
        run: |
          for i in 1 2 3 4; do
            curl -fsSL --max-time 120 -o "$RUNNER_TEMP/acli.tgz" https://downloads.arduino.cc/arduino-cli/arduino-cli_1.2.2_Linux_64bit.tar.gz && break
            [ "$i" = 4 ] && exit 1
            sleep $((i*20))
          done
          echo "a5ad085d1b02fd4010df18b1bbf20453276efe6c6e2ac323baa0cac4e96a85b4  $RUNNER_TEMP/acli.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$RUNNER_TEMP/acli.tgz" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version
      # The pinned core and toolchains (~1 GB) are downloaded once and kept, so a
      # package-server outage (504 on 2026-11-08) does not fail the build.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/staging
            ~/.arduino15/packages
            ~/Arduino/libraries
          key: arduino-esp32-3.3.12-neopixel-1.15.5
      - name: Install ESP32-S3 board and required library
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # The core's archives first, from Espressif's official mirror or
          # GitHub, each checked against the index's SHA-256 (2026-11-08:
          # GitHub gave the runners 504 for its release downloads). Then the
          # install finds every archive cached. Two tries in all, then fail.
          for i in 1 2; do
            arduino-cli core update-index --additional-urls "$URL" \
              && python3 tools/prefetch_arduino_tools.py --version 3.3.12 \
              && arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL" \
              && arduino-cli lib install "Adafruit NeoPixel@1.15.5" && break
            [ "$i" = 2 ] && exit 1
            echo "Install failed, once more in 30 s"; sleep 30
          done
      - name: Validate embedded browser JavaScript
        run: |
          python3 tools/build_ui.py
          python3 tools/build_ui.py --check
          python3 - <<'PY2'
          from pathlib import Path
          html=Path('firmware/ui/app.html').read_text(encoding='utf-8')
          start=html.index('<script>')+len('<script>')
          end=html.index('</script>',start)
          Path('/tmp/enginelink-ui.js').write_text(html[start:end],encoding='utf-8')
          print("UI JS size:",end-start)
          PY2
          node --check /tmp/enginelink-ui.js
      - name: Compile application
        run: |
          mkdir -p build-app
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc" \
            --output-dir build-app \
            --export-binaries \
            --build-property "compiler.c.elf.extra_flags=-Wl,--wrap=esp_wifi_init" \
            firmware/EngineLink
          # WPA3 must be switchable (firmware/EngineLink/wifiwpa3.cpp): fail if
          # Arduino's Wi-Fi start does not go through the wrapper.
          OBJDUMP=$(ls ~/.arduino15/packages/esp32/tools/esp-x32/*/bin/xtensa-esp32s3-elf-objdump | head -1)
          "$OBJDUMP" -d build-app/*.elf --no-show-raw-insn | grep -q "call8.*<__wrap_esp_wifi_init>" || { echo "esp_wifi_init is not wrapped: WPA3 cannot be switched off"; exit 1; }
      - name: Verify merged image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          builds=list(Path('build-app').glob('*.merged.bin'))
          assert builds, 'No merged flash image'
          for p in builds:
              assert p.stat().st_size==8*1024*1024, (p,p.stat().st_size)
              print('Binary:',p,'Size:',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: EngineLink-App-ESP32S3-${{ github.sha }}
          path: |
            build-app/*.merged.bin
            build-app/EngineLink.ino.bin
          if-no-files-found: error
