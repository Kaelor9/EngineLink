name: Validate EngineLink
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check page JavaScript
        run: node --check site/app.js
      - name: Check required assets
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/assets/enginelink-mark.svg
          test -s site/assets/board-3d.png
          test -s docs/images/board-3d.png
      - name: Validate onboard UI JavaScript
        run: |
          python3 tools/build_ui.py
          python3 tools/build_ui.py --check
          python3 - <<'PY2'
          from pathlib import Path
          html=Path('firmware/ui/app.html').read_text(encoding='utf-8')
          start=html.index('<script>')+len('<script>')
          end=html.index('</script>',start)
          Path('/tmp/enginelink-ui.js').write_text(html[start:end],encoding='utf-8')
          print("UI JS size:",end-start)
          PY2
          node --check /tmp/enginelink-ui.js
      - name: Build the app demo
        run: |
          python3 tools/build_demo.py
          node --check tools/demo/mock.js
          node --check tools/demo/control.js
      - name: Verify USB rescue never targets user data partitions
        run: |
          python3 -m py_compile tools/recover_usb.py
          python3 tools/test_usb_recovery.py
      - name: Check exclusive Wi-Fi and non-blocking HTTP architecture
        run: python3 tools/test_network_architecture.py
      - name: Validate router lifecycle, reconnect safety and network diagnostics
        run: python3 tools/test_router_reliability_contract.py
      - name: Check non-blocking Wi-Fi discovery contract
        run: python3 tools/test_wifi_scan_contract.py
      - name: Test router AP-rescue deadline and reboot-safe timer
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra tools/test_routerguard.cpp -o /tmp/test_routerguard
          /tmp/test_routerguard
      - name: Test packet-fragmented firmware headers
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra tools/test_otaheader.cpp -o /tmp/test_otaheader
          /tmp/test_otaheader
      - name: Test the fuel calibration maths
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_fuelcal.cpp -o /tmp/test_fuelcal
          /tmp/test_fuelcal
      - name: Test the status light language
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_ledpatterns.cpp -o /tmp/test_ledpatterns
          /tmp/test_ledpatterns
      - name: Test the diagnosis rules on simulated trips
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_diagrules.cpp -o /tmp/test_diagrules
          /tmp/test_diagrules
      - name: Check version is defined once in firmware
        run: grep -E '^#define EL_VERSION "[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+)?"' firmware/EngineLink/EngineLink.ino
