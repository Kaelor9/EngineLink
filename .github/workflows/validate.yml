name: Validate EngineLink
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check page JavaScript
        run: node --check site/app.js
      - name: Validate older USB installer archive contracts
        run: python3 tools/test_installer_archive.py
      - name: Exercise firmware version picker without USB/CDN support
        run: node tools/test_firmware_selector.js
      - name: Check required assets
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/assets/enginelink-mark.svg
          test -s site/assets/board-3d.png
          test -s docs/images/board-3d.png
      - name: Validate onboard UI JavaScript
        run: |
          python3 tools/build_ui.py
          python3 tools/build_ui.py --check
          python3 - <<'PY2'
          from pathlib import Path
          html=Path('firmware/ui/app.html').read_text(encoding='utf-8')
          start=html.index('<script>')+len('<script>')
          end=html.index('</script>',start)
          Path('/tmp/enginelink-ui.js').write_text(html[start:end],encoding='utf-8')
          print("UI JS size:",end-start)
          PY2
          node --check /tmp/enginelink-ui.js
      - name: Check mobile navigation and router text fields
        run: python3 tools/test_mobile_ui_contract.py
      - name: Keep Drive Test animation continuous during recording
        run: python3 tools/test_drive_test_ui_contract.py
      - name: Build the app demo
        run: |
          python3 tools/build_demo.py
          node --check tools/demo/mock.js
          node --check tools/demo/control.js
      - name: Verify USB rescue never targets user data partitions
        run: |
          python3 -m py_compile tools/recover_usb.py
          python3 tools/test_usb_recovery.py
      - name: Check the simple Wi-Fi
        run: python3 tools/test_wifi_simple.py
      - name: Wi-Fi 2.0 structural contracts
        run: cd tools && python3 test_wifi_contract.py
      - name: Check Wi-Fi throughput sampling and radio-test idle guard
        run: python3 tools/test_router_throughput_guard.py
      - name: Test router AP-rescue deadline and reboot-safe timer
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra tools/test_routerguard.cpp -o /tmp/test_routerguard
          /tmp/test_routerguard
      - name: Host test the Wi-Fi trace folding (Wi-Fi 2.0 Stage 1c)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I firmware/EngineLink tools/test_tracefold.cpp -o /tmp/test_tracefold
          /tmp/test_tracefold
      - name: Host test the Wi-Fi 2.0 state machine (plan 9.3, 20 scenarios)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I firmware/EngineLink tools/test_wifistate.cpp -o /tmp/test_wifistate
          /tmp/test_wifistate
      - name: Host test URL decoding and the own-address allow-list (Wi-Fi 2.0 Stage 2)
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I firmware/EngineLink tools/test_httputil.cpp -o /tmp/test_httputil
          /tmp/test_httputil
      - name: Host test NMEA 2000 decoding
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I firmware/EngineLink tools/test_nmea2k.cpp -o /tmp/test_nmea2k
          /tmp/test_nmea2k
      - name: Host test router reconnect and rescue policy
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I firmware/EngineLink tools/test_netpolicy.cpp -o /tmp/test_netpolicy
          /tmp/test_netpolicy
      - name: Test packet-fragmented firmware headers
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra tools/test_otaheader.cpp -o /tmp/test_otaheader
          /tmp/test_otaheader
      - name: Test the fuel calibration maths
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_fuelcal.cpp -o /tmp/test_fuelcal
          /tmp/test_fuelcal
      - name: Test the status light language
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_ledpatterns.cpp -o /tmp/test_ledpatterns
          /tmp/test_ledpatterns
      - name: Test the diagnosis rules on simulated trips
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_diagrules.cpp -o /tmp/test_diagrules
          /tmp/test_diagrules
      - name: Test the gear and clutch analysis on simulated shifts
        run: |
          g++ -O2 -std=c++17 -Wall -I firmware/EngineLink tools/test_shiftrules.cpp -o /tmp/test_shiftrules
          /tmp/test_shiftrules
      - name: Check version is defined once in firmware
        run: grep -E '^#define EL_VERSION "[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+)?"' firmware/EngineLink/EngineLink.ino
