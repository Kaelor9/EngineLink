<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Køretestens forløb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone preview (sticky) beside a long column of choice groups. */
:root{--bg:#f3f1ec;--card:#fff;--ink:#1c2328;--mute:#66707a;--line:#e1ddd4;--acc:#1f4f73;--accbg:#e6eef5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171b;--card:#1b2227;--ink:#e8ecef;--mute:#98a2ab;--line:#2b343b;--acc:#8cc0e6;--accbg:#1d3242;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171b;--card:#1b2227;--ink:#e8ecef;--mute:#98a2ab;--line:#2b343b;--acc:#8cc0e6;--accbg:#1d3242;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:6px 0 2px;text-wrap:balance}p.lead{color:var(--mute);margin:0 0 14px;max-width:70ch}
.layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.pvcol{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.tabs button,.sub button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer}
.tabs button[aria-pressed="true"],.sub button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--card)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.phone{width:100%;max-width:380px;margin:0 auto;border-radius:34px;background:#05090d;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.scr{border-radius:26px;overflow:hidden;background:#0b141c;color:#e8eff3;height:min(720px,74vh);overflow-y:auto;position:relative;font-size:14px}
@media (max-width:860px){.scr{height:56vh}}
.ctl{display:flex;flex-direction:column;gap:12px;min-width:0}
.cg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cg h3{font-size:15px;margin:0 0 3px}.cg>p{margin:0 0 10px;color:var(--mute);font-size:13px}
.cg .shows{font-size:12px;color:var(--acc);font-weight:600;margin:-6px 0 10px;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.list button{all:unset;cursor:pointer;display:flex;gap:9px;align-items:flex-start;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13.5px;line-height:1.3}
.list button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.list button:focus-visible,.tabs button:focus-visible,.sub button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.list .n{min-width:20px;font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700}
.prio{font-size:11.5px;color:var(--acc)}
.list .now{display:inline-block;font-size:10.5px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:10px 2px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.bar span{color:var(--mute);font-size:12px;max-width:72vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 14px;background:var(--acc);color:var(--card);cursor:pointer}

/* ---------- the phone app (EngineLink's dark theme) ---------- */
.ap{--a-bg:#0b141c;--a-card:#12212d;--a-track:#1a2b38;--a-text:#e8eff3;--a-sub:#8ea2b1;--a-teal:#4fd1c5;--a-red:#ef6461;--a-orange:#f2a54a;--a-green:#59c98a;--a-line:#26394a;padding:18px 14px 24px;min-height:100%}
.ap.big{font-size:16px}.ap.huge{font-size:18px}
.ap h2{font-size:26px;margin:4px 2px 10px;font-weight:750;letter-spacing:-.01em}
.ap .pill{display:inline-flex;gap:6px;align-items:center;color:var(--a-teal);background:var(--a-card);border-radius:999px;padding:6px 12px;font-size:13px;margin-bottom:12px}
.ap .card{background:var(--a-card);border-radius:18px;padding:12px;margin-bottom:12px}
.ap .t{font-size:1.55em;font-weight:750;line-height:1.15;margin-top:4px}
.ap .d{font-size:1em;margin-top:6px;color:var(--a-text)}
.ap .s{font-size:.86em;color:var(--a-sub)}
.ap .row{display:flex;gap:10px}
.ap .btn{flex:1;font:inherit;font-weight:650;border:0;border-radius:14px;padding:13px 10px;background:var(--a-track);color:var(--a-text);text-align:center;cursor:default;user-select:none}
.ap .btn.pri{background:var(--a-teal);color:#06231f}
.ap .btn.red{background:var(--a-red);color:#fff}
.ap .btn.ghost{background:none;border:1.5px solid var(--a-line)}
.ap .track{background:var(--a-track);border-radius:999px;height:8px;overflow:hidden}.ap .track i{display:block;height:100%;background:var(--a-teal);border-radius:999px}
.ap .scene{border-radius:16px;overflow:hidden;background:#33495c}.ap .scene svg{display:block;width:100%;height:auto}
.ap .eng{background:var(--a-track);border-radius:12px;padding:8px 10px;flex:1}
.ap .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--a-sub);display:inline-grid;place-items:center;flex:none}
.ap .chk.on{background:var(--a-teal);border-color:var(--a-teal)}
.ap .warnbox{border-radius:16px;padding:14px;margin-bottom:12px}
.ap .hd{font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--a-sub);font-weight:700;margin:16px 4px 8px}
.ap table{width:100%;border-collapse:collapse;font-size:.9em}.ap td,.ap th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--a-line)}.ap th{color:var(--a-sub);font-weight:600}

/* animations (all calm; reduced motion shows one still picture) */
.dtw{opacity:0;animation:dtw 4.5s ease-in-out infinite}@keyframes dtw{0%{opacity:0;transform:translateX(8px)}45%{opacity:.26}100%{opacity:0;transform:translateX(-12px)}}
.rock{animation:rock 9s ease-in-out infinite alternate;transform-box:view-box;transform-origin:145px 0px}@keyframes rock{0%{transform:translate(-1.2px,.8px) rotate(-.35deg)}100%{transform:translate(1.4px,-.9px) rotate(.45deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.blink{animation:blink 1s steps(2,jump-none) infinite}@keyframes blink{0%{opacity:1}100%{opacity:.15}}
.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.sweep{animation:sweep 6s ease-in-out infinite;transform-box:view-box}@keyframes sweep{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.sweep360{animation:sweep360 5s linear infinite;transform-box:view-box}@keyframes sweep360{to{transform:rotate(360deg)}}
.grow{animation:grow 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes grow{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.fadein{animation:fadein .5s ease-out both}@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scr *,.scr *::before{animation:none!important;transition:none!important}.dtw{opacity:.26}}
</style></head><body>
<div class="wrap">
<h1>Køretestens forløb</h1>
<p class="lead">Hele køretesten fra start til resultat, med din båd i den valgte stil. Vælg en skærm over telefonen, og vælg til højre. Valg mærket <b>nu</b> er sådan appen er i dag. Sikkerhedsvagterne under "Sikkerhed" kan sættes til og fra hver for sig.</p>

<div class="ctl" id="ctl"></div></div></div>
<div class="bar"><span id="code"></span><button id="copy">Kopiér valget</button></div>

const swimmerT=(x,y,cls='',st='')=>`<g class="${cls}" style="${st}"><g transform="translate(${x} ${y})"><circle r="13" fill="none" stroke="${K.water}" stroke-width="1.2" opacity=".6"/><path d="M-9 -6 Q-4 -1 0 0 Q4 1 9 6" fill="none" stroke="${K.skin}" stroke-width="2.6" stroke-linecap="round"/><circle r="5" fill="${K.skin}" stroke="${K.dark}" stroke-width=".8"/></g></g>`;
const cross=(x,y,r=18,cls='')=>`<g class="${cls}"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${K.red}" stroke-width="4"/><path d="M${x-r*.7} ${y-r*.7} L${x+r*.7} ${y+r*.7}" stroke="${K.red}" stroke-width="4" stroke-linecap="round"/></g>`;
const tick=(x,y,r=16,cls='',col=K.green)=>`<g class="${cls}"><circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><path d="M${x-r*.45} ${y} l${r*.32} ${r*.32} l${r*.6} -${r*.62}" fill="none" stroke="#fff" stroke-width="${(r*.2).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
const zone=(cls='pulse',r=62)=>`<g class="${cls}"><circle cx="-22" cy="0" r="${r}" fill="${K.red}" opacity=".2"/><circle cx="-22" cy="0" r="${r}" fill="none" stroke="${K.red}" stroke-width="2" stroke-dasharray="6 6"/></g>`;
const head=(x,y,n,cls='',st='')=>`<g class="${cls}" style="${st}"><circle cx="${x}" cy="${y}" r="8" fill="${K.skin}" stroke="${K.dark}" stroke-width="1"/>${n?`<circle cx="${x+9}" cy="${y-9}" r="6.5" fill="${K.teal}"/><text x="${x+9}" y="${y-6.3}" font-size="8" font-weight="700" text-anchor="middle" fill="${K.dark}">${n}</text>`:''}</g>`;
const label=(x,y,t,col=K.line,size=12,anchor='middle')=>`<text x="${x}" y="${y}" font-size="${size}" font-weight="700" text-anchor="${anchor}" fill="${col}" font-family="system-ui,sans-serif">${t}</text>`;
const arrow=(x1,y1,x2,y2,col=K.teal,w=3,cls='')=>{const a=Math.atan2(y2-y1,x2-x1),h=9;return `<g class="${cls}"><path d="M${x1} ${y1} L${x2} ${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x2} ${y2} L${(x2-h*Math.cos(a-.5)).toFixed(1)} ${(y2-h*Math.sin(a-.5)).toFixed(1)} M${x2} ${y2} L${(x2-h*Math.cos(a+.5)).toFixed(1)} ${(y2-h*Math.sin(a+.5)).toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/></g>`;};
// keyframe helper: one-off named keyframes inside a scene's own <style>
let KF=0;const kf=(frames,dur=10,extra='')=>{const n='k'+(++KF);return {n,css:`@keyframes ${n}{${frames}}`,st:`animation:${n} ${dur}s ease-in-out infinite ${extra}`};};
const withCss=(css,s)=>`<style>${css}</style>${s}`;
// side view of the boat (a simple profile in the same colours)
function sideBoat({ladder='down',zone:z=false,prop='still'}={}){
  const hull=`<path d="M20 70 L250 70 Q296 70 312 50 L318 44 L300 98 Q240 112 70 112 L40 112 Z" fill="${K.dark}" stroke="${K.line}" stroke-width="2.2" stroke-linejoin="round"/>
   <path d="M70 70 L96 46 H176 L196 70" fill="${K.deck}" stroke="${K.line}" stroke-width="1.8" stroke-linejoin="round"/><path d="M104 52 H168" stroke="${K.soft}" stroke-width="1.4"/>
   <rect x="14" y="100" width="34" height="6" rx="2" fill="${K.soft}"/>`;
  const drive=`<path d="M40 112 L52 112 L48 150 L36 150 Z" fill="${K.soft}"/><g transform="translate(30 146)"><g class="${prop==='spin'?'spin':''}"><ellipse cx="0" cy="0" rx="3" ry="12" fill="${K.line}"/><ellipse cx="0" cy="0" rx="12" ry="3" fill="${K.line}" opacity=".7"/></g></g>`;
  const lad=ladder==='down'?`<g stroke="${K.soft}" stroke-linecap="round"><path d="M10 100 V146 M20 100 V146" stroke-width="3"/><path d="M10 112 H20 M10 124 H20 M10 136 H20" stroke-width="2.4"/></g>`:ladder==='up'?`<g stroke="${K.soft}" stroke-linecap="round"><path d="M10 100 V76 M20 100 V76" stroke-width="3"/><path d="M10 90 H20 M10 82 H20" stroke-width="2.4"/></g>`:'';
  return `${z?`<g class="pulse"><circle cx="34" cy="146" r="34" fill="${K.red}" opacity=".22"/><circle cx="34" cy="146" r="34" fill="none" stroke="${K.red}" stroke-width="2" stroke-dasharray="5 5"/></g>`:''}${hull}${drive}${lad}`;}
const SV=[-10,20,340,170];
const sideScene=(body,opt)=>svg(SV,`<rect x="-10" y="108" width="340" height="82" fill="${K.water}" opacity=".22"/><path d="M-10 108 q10 -3 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="${K.water}" stroke-width="1.4" opacity=".7"/>`+sideBoat(opt)+body);
const picto=(body)=>svg([0,0,320,170],body,K.bg);

// ===================== 1. Nobody in the water =====================
function swimScene(v){
  switch(v){
  case 0:{const a=kf(`0%{transform:translate(-95px,-20px)}18%{transform:translate(-55px,6px)}45%{transform:translate(-55px,6px)}62%{transform:translate(-50px,34px)}78%{transform:translate(-16px,34px);opacity:1}86%,100%{transform:translate(-16px,34px);opacity:0}}`),
    c=kf(`0%,18%{opacity:0}24%,45%{opacity:1}52%,100%{opacity:0}}`),t=kf(`0%,82%{opacity:0}88%,100%{opacity:1}}`);
    return withCss(a.css+c.css+t.css,topv(`<g style="${a.st}">${swimmerT(0,0)}</g><g style="${c.st}">${cross(-55,6,22)}</g><g style="${t.st}">${tick(-60,-40,16)}</g>`,{ladder:true}));}
  case 1:{const a=kf(`0%{transform:translate(-50px,0px)}100%{transform:translate(-150px,-70px)}`,6);
    return withCss(a.css,topv(zone()+`<g style="${a.st}">${swimmerT(0,0)}</g>`));}
  case 2:return topv(zone('blink')+tick(-60,-48,16));
  case 3:{let g='';const pos=[[60,-18],[60,18],[100,0],[130,-16]];const cs=pos.map((_,i)=>kf(`0%,${8+i*14}%{opacity:0}${12+i*14}%,92%{opacity:1}100%{opacity:0}`,8));
    pos.forEach(([x,y],i)=>g+=`<g style="${cs[i].st}">${head(x,y,i+1)}</g>`);const t=kf(`0%,66%{opacity:0}72%,92%{opacity:1}100%{opacity:0}`,8);
    return withCss(cs.map(c=>c.css).join('')+t.css,topv(g+`<g style="${t.st}">${label(200,-70,'All aboard',K.green,15)}</g>`));}
  case 4:{const d=kf(`0%,40%{opacity:1}55%,100%{opacity:0}`,7),u=kf(`0%,40%{opacity:0}55%,100%{opacity:1}`,7),r=kf(`0%,40%{opacity:0}50%,100%{opacity:1}`,7);
    return withCss(d.css+u.css+r.css,svg(TV,ripples(TV)+`<g style="${d.st}">${BOATL}</g><g style="${u.st}">${BOAT}</g><g style="${r.st}"><circle cx="-14" cy="34" r="16" fill="none" stroke="${K.teal}" stroke-width="2.4"/>${label(-14,72,'Ladder up',K.teal,13)}</g>`));}
  case 5:{const a=kf(`0%{transform:translate(-90px,40px)}60%,100%{transform:translate(-50px,36px)}`,5);
    return withCss(a.css,topv(`<g style="${a.st}">${swimmerT(0,0)}</g>`+arrow(-80,70,-40,40,K.teal,3,'pulse')+label(-70,95,'Up the ladder',K.teal,13),{ladder:true}));}
  case 6:{const a=kf(`0%{transform:translate(70px,150px)}40%{transform:translate(24px,140px)}70%,100%{transform:translate(16px,104px);opacity:1}}`,8);
    return withCss(a.css,sideScene(`<g style="${a.st}"><circle cx="0" cy="-10" r="7" fill="${K.skin}"/><path d="M-9 8 Q0 -4 9 8 V18 H-9Z" fill="${K.skin}"/></g>`,{ladder:'down'}));}
  case 7:return sideScene(label(170,166,'The propeller turns in gear',K.red,13),{zone:true,prop:'spin',ladder:'up'});
  case 8:return picto(`<rect x="0" y="110" width="320" height="60" fill="${K.water}" opacity=".25"/><circle cx="160" cy="90" r="11" fill="${K.skin}"/><path d="M134 116 Q160 92 186 116" fill="none" stroke="${K.skin}" stroke-width="7" stroke-linecap="round"/>${cross(160,100,54,'')}`);
  case 9:return picto(`<g transform="translate(110 86)"><g class="spin"><ellipse rx="7" ry="30" fill="${K.line}"/><ellipse rx="30" ry="7" fill="${K.line}" opacity=".75"/></g></g><circle cx="215" cy="70" r="10" fill="${K.skin}"/><path d="M196 96 Q215 76 234 96" fill="none" stroke="${K.skin}" stroke-width="7" stroke-linecap="round"/>${cross(160,86,70)}`);
  case 10:{const g=`<g class="sweep360" style="transform-origin:-22px 0px"><path d="M-22 0 L58 -30 A86 86 0 0 1 58 30 Z" fill="${K.teal}" opacity=".22"/></g><circle cx="-22" cy="0" r="86" fill="none" stroke="${K.teal}" stroke-width="1.4" stroke-dasharray="4 6"/>`;
    const t=kf(`0%,70%{opacity:0}78%,100%{opacity:1}`,7);return withCss(t.css,topv(g+`<g style="${t.st}">${tick(-60,-48,15)}${label(-60,-72,'Nobody in the water',K.green,13)}</g>`));}
  case 11:return topv(`<rect x="-30" y="-44" width="30" height="88" rx="4" fill="none" stroke="${K.green}" stroke-width="3" class="pulse"/>`+tick(-60,-56,16)+label(-60,70,'Platform clear',K.green,13));
  case 12:{const z=kf(`0%,30%{opacity:1}36%,100%{opacity:0}`,12),h=kf(`0%,32%{opacity:0}38%,64%{opacity:1}70%,100%{opacity:0}`,12),u=kf(`0%,66%{opacity:0}72%,100%{opacity:1}`,12),d=kf(`0%,66%{opacity:1}72%,100%{opacity:0}`,12);
    let heads='';[[60,-18],[60,18],[100,0]].forEach(([x,y],i)=>heads+=head(x,y,i+1));
    return withCss(z.css+h.css+u.css+d.css,svg(TV,ripples(TV)+`<g style="${d.st}">${BOATL}</g><g style="${u.st}">${BOAT}</g><g style="${z.st}">${zone('pulse')}${label(-22,-74,'Nobody near the drives',K.red,13)}</g><g style="${h.st}">${heads}${label(200,-70,'All aboard',K.green,14)}</g><g style="${u.st}">${tick(-60,-48,15)}${label(-14,72,'Ladder up',K.teal,13)}</g>`));}
  case 14:return swimSide();
  case 13:return topv(zone('')+label(-22,-74,'Nobody in the water by the drives',K.red,13),{still:true});
  }}
const SWIM=['Svømmer ved drevet, rødt kryds, op ad stigen','Rød zone om drevene, svømmeren svømmer væk','Rød zone blinker, grønt flueben','Alle om bord: personerne tælles 1, 2, 3','Stigen klappes op','Svømmeren kaldes op: pil til stigen','Fra siden: svømmeren kravler op ad stigen','Fra siden: rød zone om propellen, der drejer','Piktogram: person i vandet, rødt kryds','Piktogram: propel og person, forbudt','Radar-fejning om agterenden, intet fundet','Tom badeplatform med grønt flueben','Forløb: zone, alle om bord, stigen op','Stille billede: rød zone og tekst','NY: Fra siden: personen bader og kravler op (vælg detaljerne nedenfor)'];

// ===================== 2. Know how to stop =====================
function panel(body,{two=true}={}){return picto(`<rect x="22" y="18" width="276" height="134" rx="18" fill="${K.dark}" stroke="${K.line}" stroke-width="1.6"/>${body}`);}
const keyAt=(x,y,cls='',st='')=>`<circle cx="${x}" cy="${y}" r="24" fill="${K.deck}" stroke="${K.line}" stroke-width="2"/>${label(x,y-28,'ON',K.soft,9)}${label(x-30,y+4,'STOP',K.red,9,'end')}<g class="${cls}" style="transform-origin:${x}px ${y}px;${st}"><rect x="${x-4}" y="${y-22}" width="8" height="28" rx="3" fill="${K.line}"/><circle cx="${x}" cy="${y+6}" r="8" fill="${K.line}"/></g>`;
const btnAt=(x,y,cls='',st='')=>`<g class="${cls}" style="transform-box:fill-box;transform-origin:center;${st}"><circle cx="${x}" cy="${y}" r="22" fill="${K.red}"/>${label(x,y+4,'STOP','#fff',10)}</g>`;
function stopScene(v){if(v>=12)return keysScene(v-12);
  const turn=kf(`0%,25%{transform:rotate(0deg)}45%,75%{transform:rotate(-80deg)}95%,100%{transform:rotate(0deg)}`,6),press=kf(`0%,50%{transform:scale(1)}60%{transform:scale(.84)}70%,100%{transform:scale(1)}`,6);
  const t2=kf(`0%,25%{transform:rotate(0deg)}45%,75%{transform:rotate(-80deg)}95%,100%{transform:rotate(0deg)}`,6,'.6s');
  switch(v){

  case 1:return withCss(press.css,panel(btnAt(160,86,'',press.st)+label(160,140,'Press the stop button',K.soft,11)));
  case 2:return withCss(turn.css+t2.css,panel(keyAt(105,86,'',turn.st)+keyAt(215,86,'',t2.st)+label(105,140,'Port',PORT,11)+label(215,140,'Starboard',STB,11)));
  case 3:{const p2=kf(`0%,55%{transform:scale(1)}65%{transform:scale(.84)}75%,100%{transform:scale(1)}`,6);return withCss(press.css+p2.css,panel(btnAt(105,86,'',press.st)+btnAt(215,86,'',p2.st)+label(105,140,'Port',PORT,11)+label(215,140,'Starboard',STB,11)));}
  case 4:return withCss(turn.css+press.css,panel(keyAt(112,86,'',turn.st)+btnAt(216,86,'',press.st)+label(160,140,'Key or button, for each engine',K.soft,11)));
  case 5:return panel(`<g class="pulse">${keyAt(105,86)}${keyAt(215,86)}</g>`+label(160,140,'This is where you stop the engines',K.teal,11));
  case 6:{const f=kf(`0%,40%{transform:translate(40px,40px)}55%,70%{transform:translate(0px,8px)}85%,100%{transform:translate(40px,40px)}`,5);
    return withCss(f.css+press.css,panel(btnAt(160,80,'',press.st)+`<g style="${f.st}"><path d="M160 92 q-6 0 -6 8 v26 q0 10 10 10 h14 q10 0 10 -10 v-14 q0 -6 -6 -6 h-16 v-14 q0 -10 -6 -10z" fill="${K.skin}" transform="translate(-4 4)"/></g>`));}
  case 7:{const a=kf(`0%,20%{opacity:0}30%,100%{opacity:1}`,6),b=kf(`0%,50%{opacity:0}60%,100%{opacity:1}`,6);
    return withCss(a.css+b.css,picto(`<rect x="40" y="26" width="240" height="118" rx="16" fill="${K.dark}"/>${label(64,66,'Port: stop found',PORT,15,'start')}${label(64,112,'Starboard: stop found',STB,15,'start')}<g style="${a.st}">${tick(254,61,12)}</g><g style="${b.st}">${tick(254,107,12)}</g>`));}
  case 8:return panel(keyAt(112,86)+btnAt(216,86)+arrow(60,40,92,66,K.teal,3,'pulse')+arrow(270,40,236,66,K.teal,3,'pulse'));
  case 9:return panel(keyAt(112,86)+btnAt(216,86)+`<circle class="pulse" cx="216" cy="86" r="32" fill="none" stroke="${K.teal}" stroke-width="3"/><circle class="pulse" cx="112" cy="86" r="34" fill="none" stroke="${K.teal}" stroke-width="3"/>`);
  case 10:return picto(`<path d="M120 40 L200 40 L240 80 L240 120 L200 160 L120 160 L80 120 L80 80 Z" transform="translate(0 -15) scale(1 .95)" fill="${K.red}"/>${label(160,95,'STOP','#fff',30)}`);
  case 11:return panel(keyAt(112,86)+btnAt(216,86)+label(160,140,'Key or button',K.soft,11));

const STOP=['Nøglen drejes til STOP','Den røde stopknap trykkes ind','To nøgler, én pr. motor','To stopknapper, én pr. motor','Nøgle og knap (som nu, ny tegning)','Panelet, nøglerne lyser','En finger trykker på stopknappen','Tjekliste: stop fundet for hver motor','Pile peger på nøgle og knap','Pulserende ringe om nøgle og knap','Piktogram: STOP-skilt','Stille billede af panelet'];

// ===================== 3. Engines at idle =====================
function gauge(cx,cy,r,cls='',st='',lbl='600'){let ticks='';for(let i=0;i<9;i++){const a=(-210+i*30)*Math.PI/180;ticks+=`<path d="M${(cx+Math.cos(a)*(r-10)).toFixed(1)} ${(cy+Math.sin(a)*(r-10)).toFixed(1)} L${(cx+Math.cos(a)*(r-3)).toFixed(1)} ${(cy+Math.sin(a)*(r-3)).toFixed(1)}" stroke="${K.soft}" stroke-width="2"/>`;}
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${K.dark}" stroke="${K.line}" stroke-width="2"/>${ticks}<g class="${cls}" style="transform-origin:${cx}px ${cy}px;${st}"><path d="M${cx} ${cy} L${cx} ${cy-r+12}" stroke="${K.orange}" stroke-width="3.5" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="5" fill="${K.line}"/>${label(cx,cy+r*.55,lbl,K.line,13)}${label(cx,cy+r*.55+12,'rpm',K.soft,9)}`;}
const needle=()=>kf(`0%{transform:rotate(-120deg)}25%{transform:rotate(-40deg)}40%,100%{transform:rotate(-78deg)}`,7);
function leverSide(cx,cy,ang,col,cls='',st=''){return `<path d="M${cx-60} ${cy+38} Q${cx} ${cy-6} ${cx+60} ${cy+38}" fill="none" stroke="${K.deck}" stroke-width="9" stroke-linecap="round"/>${label(cx-68,cy+56,'R',K.soft,11)}${label(cx,cy-12,'N',K.soft,11)}${label(cx+68,cy+56,'F',K.soft,11)}<rect x="${cx-30}" y="${cy+30}" width="60" height="18" rx="7" fill="${K.dark}" stroke="${K.line}" stroke-width="1.4"/><g class="${cls}" style="transform-origin:${cx}px ${cy+38}px;transform:rotate(${ang}deg);${st}"><rect x="${cx-4}" y="${cy-28}" width="8" height="68" rx="4" fill="${K.line}"/><rect x="${cx-18}" y="${cy-38}" width="36" height="17" rx="8" fill="${col}"/></g>`;}
function warmScene(v){const n=needle(),n2=kf(`0%{transform:rotate(-120deg)}30%{transform:rotate(-30deg)}45%,100%{transform:rotate(-80deg)}`,7),temp=kf(`0%{transform:scaleY(.15)}80%,100%{transform:scaleY(.8)}`,7);
  const thermo=(x)=>`<rect x="${x}" y="36" width="20" height="92" rx="10" fill="${K.dark}" stroke="${K.line}" stroke-width="2"/><circle cx="${x+10}" cy="134" r="14" fill="${K.orange}"/><rect x="${x+5}" y="46" width="10" height="84" rx="5" fill="${K.orange}" style="transform-origin:${x+10}px 130px;${temp.st}"/>`;
  switch(v){
  case 0:return withCss(n.css,picto(gauge(160,88,62,'',n.st)));
  case 1:return withCss(n.css+n2.css,picto(gauge(95,84,56,'',n.st)+gauge(225,84,56,'',n2.st)+label(95,160,'Port',PORT,11)+label(225,160,'Starboard',STB,11)));
  case 2:return picto(leverSide(100,70,0,K.green)+leverSide(220,70,0,K.green)+label(160,160,'Both in neutral',K.green,12));
  case 3:return withCss(temp.css,picto(thermo(150)+label(160,164,'Coolant warming up',K.soft,11)));
  case 4:return withCss(n.css+temp.css,picto(gauge(120,88,56,'',n.st)+thermo(222)));
  case 5:{const c=kf(`0%{stroke-dashoffset:302}100%{stroke-dashoffset:0}`,8,'linear');return withCss(c.css,picto(`<circle cx="160" cy="84" r="48" fill="${K.dark}" stroke="${K.deck}" stroke-width="8"/><circle cx="160" cy="84" r="48" fill="none" stroke="${K.teal}" stroke-width="8" stroke-dasharray="302" style="${c.st};transform:rotate(-90deg);transform-origin:160px 84px"/>${label(160,82,'A few',K.line,15)}${label(160,100,'minutes',K.line,15)}`));}
  case 6:{const eng=(x,col,d)=>`<g class="pulse" style="animation-delay:${d}s"><rect x="${x-34}" y="54" width="68" height="52" rx="10" fill="${K.dark}" stroke="${col}" stroke-width="2.4"/><path d="M${x-22} 70 h44 M${x-22} 80 h44 M${x-22} 90 h44" stroke="${K.soft}" stroke-width="2"/></g>`;
    return picto(eng(100,PORT,0)+eng(220,STB,.6)+label(100,128,'Idle',K.line,12)+label(220,128,'Idle',K.line,12));}
  case 7:{const c=kf(`0%{opacity:.4}20%{opacity:1}100%{opacity:1}`,4);return withCss(c.css,picto(`<rect x="70" y="40" width="180" height="90" rx="16" fill="${K.dark}"/><text x="160" y="104" font-size="52" font-weight="800" text-anchor="middle" fill="${K.line}" style="${c.st}" font-family="system-ui">600</text>${label(160,146,'rpm, both engines',K.soft,11)}`));}
  case 8:return withCss(n.css,picto(leverSide(90,70,0,K.green)+gauge(232,84,52,'',n.st)));
  case 9:return picto(gauge(120,88,56,'','transform:rotate(-78deg)')+thermo(222));
  }}
const WARM=['Omdrejningstæller falder til ca. 600','To omdrejningstællere, én pr. motor','Begge håndtag i neutral, grønt','Coolant warming up','Omdrejningstæller og kølevand (som nu, ny tegning)','Ur: et par minutter','Motorikoner der pulserer roligt','Stort tal: 600 rpm','Håndtag i neutral og omdrejningstæller','Stille billede'];

// ===================== 4. Lookout =====================
function lookScene(v){const cone=(cls='sweep',op=.2)=>`<g class="${cls}" style="transform-origin:180px 0px"><path d="M180 0 L362 -100 A210 210 0 0 1 362 100 Z" fill="${K.teal}" opacity="${op}"/></g>`;
  const person=(x,y)=>personTop(x,y);
  const VB=[-40,-118,402,236];
  switch(v){
  case 0:return topv(cone()+person(180,0),{vb:VB});

function controls(){document.getElementById('ctl').innerHTML=G.map(g=>{if(g[0]==='sec')return `<div class="sec">${g[1]}</div>`;
  const [k,h,p,list,tab,nowIx,multi]=g,cur=multi?null:SEL[k];
  if(multi)return `<div class="cg"><h3>${h}</h3><p>${p}</p><button class="shows" data-tab="${tab}">Vis på telefonen ›</button><div class="list" style="grid-template-columns:1fr">${list.map(([t,why],i)=>`<button data-k="${k}" data-v="${i}" aria-pressed="${GUARD.has(i)}"><span class="n">${GUARD.has(i)?'☑':'☐'}</span><span><b class="prio">Prioritet ${i+1}${i===0?' · vigtigst':''}</b><br>${t}<br><small style="color:var(--mute)">${why}</small></span></button>`).join('')}</div></div>`;
  const curV=k.startsWith('sw_')?SW2[k.slice(3)]:k.startsWith('tc_')?TCH[k.slice(3)]:cur;
  return `<div class="cg"><h3>${h}</h3>${p?`<p>${p}</p>`:''}<button class="shows" data-tab="${tab}">Vis på telefonen ›</button><div class="list">${list.map((t,i)=>`<button data-k="${k}" data-v="${i}" aria-pressed="${multi?GUARD.has(i):curV===i}"><span class="n">${multi?(GUARD.has(i)?'☑':'☐'):i+1}</span><span>${t}${(nowIx!==undefined&&nowIx!==null&&i===nowIx&&!multi&&k!=='stop'&&k!=='warm')||(k==='stop'&&i===4)||(k==='warm'&&i===4)?'<span class="now">nu</span>':''}</span></button>`).join('')}</div></div>`;}).join('');}
function code(){const v=k=>SEL[k]+1;document.getElementById('code').textContent=`Ingen i vandet ${v('swim')} (forløb ${SW2.story+1}, symbol ${SW2.sym+1}, placering ${SW2.place+1}, visning ${SW2.show+1}, drev ${SW2.drive+1}, stige ${SW2.ladder+1}, shorts ${SW2.shorts+1}) · Stop ${v('stop')} · Tomgang ${v('warm')} · Udkig ${v('look')} · Bekræft ${v('safe')} · Start ${v('start')} · Trinbillede ${v('step')} · Omdrejningstællere ${TCH.pl+1}/${TCH.st+1} · Opbygning ${v('layout')} · Farve ${v('col')} · Nedtælling ${v('count')} · Fremskridt ${v('prog')} · Værdier ${v('live')} · Stopknap ${v('stopbtn')} · Vagter ${[...GUARD].sort((a,b)=>a-b).map(x=>x+1).join(',')||'ingen'} · Advarsel ${v('warn')} · Start-skærm ${v('intro')} · Resultat ${v('result')} · Tekst ${v('text')}`;}
const TAB_OF={sw_story:'swim',sw_sym:'swim',sw_place:'swim',sw_show:'swim',sw_drive:'swim',sw_ladder:'swim',sw_shorts:'swim',tc_pl:'step',tc_st:'step',swim:'swim',stop:'stop',warm:'warm',look:'look',safe:'swim',start:'start',step:'step',layout:'step',col:'step',count:'rec',prog:'step',live:'rec',stopbtn:'rec',guard:'warn',warn:'warn',intro:'intro',result:'result',text:'step'};
document.addEventListener('click',e=>{const c=e.target.closest('[data-k]'),t=e.target.closest('[data-tab]'),s=e.target.closest('[data-stepk]'),pl=e.target.closest('[data-place]');
  if(c){const k=c.dataset.k,v=+c.dataset.v;if(k==='guard'){GUARD.has(v)?GUARD.delete(v):GUARD.add(v);if(v===10&&GUARD.has(10))GUARD.delete(11);if(v===11&&GUARD.has(11))GUARD.delete(10);}else if(k.startsWith('sw_')){SW2[k.slice(3)]=v;SEL.swim=14;}else if(k.startsWith('tc_'))TCH[k.slice(3)]=v;else SEL[k]=v;VIEW.tab=TAB_OF[k];controls();screen();}
  else if(t){VIEW.tab=t.dataset.tab;screen();}else if(s){VIEW.stepK=+s.dataset.stepk;screen();}else if(pl){VIEW.place=pl.dataset.place;screen();}});
document.getElementById('copy').onclick=async()=>{const el=document.getElementById('code'),t=el.textContent,b=document.getElementById('copy');
  try{await navigator.clipboard.writeText(t);b.textContent='Kopieret';}catch(_){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Markeret: kopiér selv';}
  setTimeout(()=>b.textContent='Kopiér valget',2500);};
// For the app: the owner's chosen pictures as markup, classes prefixed dtf-,
// the boat left out (the app has it). Used by tools/boat-studio/export_flow.js.
const DTF_CLS=['pulse','blink','spin','sweep360','sweep','grow2','grow','rock','fadein','arm1','arm2','kick1','kick2','cl1','cl2','pblade'];
function exportFlow(){
  const fix=h=>{h=h.replace(/class="([^"]*)"/g,(m,c)=>'class="'+c.split(' ').map(x=>DTF_CLS.includes(x)?'dtf-'+x:x).join(' ')+'"');
    h=h.replace(/\.(arm1|arm2|kick1|kick2|cl1|cl2|pblade|grow2)\{animation:(arm|kick|clb|pbl|grow2)\b/g,'.dtf-$1{animation:dtf-$2').replace(/@keyframes (arm|kick|clb|pbl|grow2)\b/g,'@keyframes dtf-$1');
    return h.split(BOATL).join('<!--BL-->').split(BOAT).join('<!--B-->');};
  // shared classes (page CSS), prefixed
  const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n').split('\n').filter(l=>/^\.(rock|pulse|blink|spin|sweep|sweep360|grow|fadein)\{/.test(l)).join('').replace(/\.(rock|pulse|blink|spin|sweep360|sweep|grow|fadein)\{animation:(\w+)/g,'.dtf-$1{animation:dtf-$2').replace(/@keyframes (\w+)/g,'@keyframes dtf-$1');
  Object.assign(SW2,{story:0,sym:0,place:0,show:0,drive:1,ladder:3,shorts:3});
  // The owner chose "Nobody in the water" option 1 (from above); the boat with the ladder down goes along.
  const out={css,boatL:BOATL,swim:fix(swimScene(0)),stop:fix(keysScene(1)),warm:fix(warmScene(4)),look:fix(lookScene(0)),lever:{}};
  for(const st of ['N','F','R','V'])for(const side of ['p','s'])out.lever[st+'_'+side]=fix(leverScene2(3,st,side));
  for(const st of ['F','F1','F2','F3'])out.lever[st+'_b']=fix(leverScene2(3,st,'b'));
  return out;}
controls();screen();
