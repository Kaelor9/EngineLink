<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byg din båd 3</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1c2328;--mute:#66707a;--line:#e1ddd4;--acc:#1f4f73;--accbg:#e6eef5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171b;--card:#1b2227;--ink:#e8ecef;--mute:#98a2ab;--line:#2b343b;--acc:#8cc0e6;--accbg:#1d3242}}
:root[data-theme="dark"]{--bg:#12171b;--card:#1b2227;--ink:#e8ecef;--mute:#98a2ab;--line:#2b343b;--acc:#8cc0e6;--accbg:#1d3242}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 2px}p.lead{margin:0 0 14px;color:var(--mute)}
.stage{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.stage .pic{max-width:calc(36vh * 2.3);margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.18);background:#2a5b78}
.stage svg{display:block;width:100%;aspect-ratio:420/184;height:auto}
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;margin:12px 0}
.grp h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}.grp h2 span{color:var(--mute);font-weight:500}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.opt{all:unset;cursor:pointer;border:2px solid transparent;border-radius:10px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.opt svg{display:block;width:100%;height:110px;background:#3a7393}
.opt b{font-weight:600;font-size:13px;padding:6px 8px}
.opt:hover{border-color:var(--line)}.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.opt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sw{display:flex;align-items:center;gap:8px;padding:8px}.sw i{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw b{padding:0}
.opts.small{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:9}
.bar code{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.bar button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 14px;background:var(--acc);color:var(--card);cursor:pointer}
.bar button.sec{background:var(--accbg);color:var(--acc)}
@media (max-width:600px){.stage{position:static}.opts{grid-template-columns:repeat(2,1fr)}}

.layout{display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:18px;align-items:start}
.stage{position:sticky;top:10px;padding:0}
.stage .pic{max-width:none;margin:0}
.stage svg{aspect-ratio:auto;max-height:calc(100vh - 150px);width:100%}
.opt svg{height:170px}
@media (max-width:700px){.layout{grid-template-columns:1fr}.stage{position:static}.stage .pic{max-width:300px;margin:0 auto}.stage svg{max-height:70vh}.opt svg{height:150px}}
</style></head><body>
<div class="wrap">
<h1>Byg din båd</h1>
<p class="lead">Din båd er sat ind som udgangspunkt. Knappen "Targa 34-stil" nederst sætter de nye Targa-valg på én gang. Dine tidligere valg ligger længere nede, hvis du vil ændre dem. Tryk på et valg i hver gruppe; den store tegning og alle små billeder følger med.</p>
<div class="layout"><div class="stage"><div class="pic" id="big"></div></div>
<div id="groups"></div></div>
</div>
<div class="bar"><code id="code"></code><button class="sec" id="targa">Targa 34-stil</button><button class="sec" id="rnd">Tilfældig</button><button id="copy">Kopiér valget</button></div>
<script>
// Brochure-style deck plan of a sport cruiser, bow up. Drawn along the boat
// (x from transom 0 to bow L, y across, starboard positive) and turned -90°.
const O={form:0,plat:0,cock:0,fore:0,screen:0,roof:0,roofc:0,canvas:0,frame:0,style:0,side:0,deck:0,cush:0,floor:0,glass:0};
const SIDE=[['Grøn','#2f8a78'],['Hvid','#eef1f1'],['Marineblå','#22385a'],['Grafit','#4b535a'],['Sølv','#aeb7bd'],['Sort','#1f2226'],['Bordeaux','#6e2633']];
const DECKC=[['Hvid','#f6f7f6'],['Elfenben','#f2ede2'],['Lys grå','#e4e7e7']];
const CUSHC=[['Hvid','#fbfbfa'],['Creme','#efe5d2'],['Sand','#d9c6a5'],['Lysegrå','#cfd3d5'],['Marineblå','#2e4059'],['Terracotta','#b9684f']];
const FLOORC=[['Grå prikket','#cdd2d4'],['Teak','#b77a45'],['Hvidt','#eceeee'],['Mørkegrå','#8d9397']];
const GLASS=[['Mørk','#1d2a33'],['Blågrøn','#24484f'],['Røgfarvet','#3c3f44'],['Lys','#6f8c9c']];
const ROOFC=[['Hvid','#f3f5f5'],['Lys grå','#c9cfd3'],['Grafit','#4a5258'],['Sort','#23272b']];
const CANVAS=[['Marineblå','#2e3c52'],['Grå','#8a9095'],['Sand','#cdbb98'],['Sort','#2a2c2f'],['Hvid','#eef0ef']];
const FRAME=[['Lys grå','#d2d8db'],['Blankt stål','#e8edf0'],['Sort','#2a2f33'],['Hvid','#f6f7f7']];
const FORMS=[
 ['Som tegningen',{L:340,B:112,s:.5,pw:2,q:.62,tr:.95}],
 ['Spidsere stævn',{L:346,B:110,s:.46,pw:1.6,q:.8,tr:.94}],
 ['Rundere stævn',{L:336,B:114,s:.54,pw:2.4,q:.5,tr:.96}],
 ['Lang og smal',{L:362,B:104,s:.5,pw:1.9,q:.66,tr:.94}],
 ['Kort og bred',{L:318,B:122,s:.52,pw:2,q:.6,tr:.96}]];
const pk=(a,k)=>a[O[k]][1];const F=()=>FORMS[O.form][1];const FL=()=>F().L;
const P=(x,y)=>x.toFixed(1)+' '+y.toFixed(1);
function hb(x){const f=F(),t=x/f.L;if(t<=f.s)return f.B/2*(f.tr+(1-f.tr)*Math.sin(t/f.s*Math.PI/2));
  const u=(t-f.s)/(1-f.s);return f.B/2*Math.pow(Math.max(0,1-Math.pow(u,f.pw)),f.q);}
const rr=(x,y,w,h,r)=>{r=Math.min(r,w/2,h/2);return `M${P(x+r,y)} H${(x+w-r).toFixed(1)} Q${P(x+w,y)} ${P(x+w,y+r)} V${(y+h-r).toFixed(1)} Q${P(x+w,y+h)} ${P(x+w-r,y+h)} H${(x+r).toFixed(1)} Q${P(x,y+h)} ${P(x,y+h-r)} V${(y+r).toFixed(1)} Q${P(x,y)} ${P(x+r,y)}Z`;};
function inset(x0,x1,d,r=8,n=40){
  const D=typeof d==='function'?d:()=>d,y=x=>Math.max(0,hb(x)-D(x)),toBow=x1>=FL()-2,xe=toBow?x1:x1-r;
  let s=`M${P(x0,-y(x0)+r)} Q${P(x0,-y(x0))} ${P(x0+r,-y(x0+r))}`;
  for(let i=1;i<=n;i++){const x=x0+r+(xe-x0-r)*i/n;s+=` L${P(x,-y(x))}`;}
  if(!toBow)s+=` Q${P(x1,-y(x1))} ${P(x1,-y(x1)+r)} L${P(x1,y(x1)-r)} Q${P(x1,y(x1))} ${P(xe,y(xe))}`;
  for(let i=n;i>=1;i--){const x=x0+r+(xe-x0-r)*(i-1)/n;s+=` L${P(x,y(x))}`;}
  return s+` Q${P(x0,y(x0))} ${P(x0,y(x0)-r)}Z`;}
function hullOutline(){const L=FL(),n=90,r=Math.min(12,hb(0)*.22);let top='',bot='';
  for(let i=1;i<=n;i++){const x=r+(L-r)*i/n;top+=` L${P(x,-hb(x))}`;bot=` L${P(x,hb(x))}`+bot;}
  return `M${P(0,-hb(0)+r)} Q${P(0,-hb(0))} ${P(r,-hb(r))}`+top+bot+` L${P(r,hb(r))} Q${P(0,hb(0))} ${P(0,hb(0)-r)}Z`;}
let CID=0;const cid=n=>n+(++CID);
const ln=(w=.7,c='#8b959b')=>O.style?` stroke="${c}" stroke-width="${w}"`:'';
function moulded(d,fill,{lift=2,shade='mould'}={}){
  return `<path d="${d}" fill="#26323a" opacity=".22" transform="translate(${lift*.6} ${lift})" filter="url(#b2)"/><path d="${d}" fill="${fill}"${ln()}/><path d="${d}" fill="url(#${shade})"/>`;}
function recess(d,fill,kind){const id=cid('r');let g=`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})"><path d="${d}" fill="${fill}"/>`;
  if(kind==='teak')for(let y=-80;y<80;y+=3.4)g+=`<path d="M-60 ${y.toFixed(1)} H420" stroke="#6d4524" stroke-width=".55" opacity=".55"/>`;
  if(kind==='speck')g+=`<rect x="-60" y="-80" width="480" height="160" fill="url(#speck)"/>`;
  g+=`<path d="${d}" fill="none" stroke="#1c262d" stroke-width="12" opacity=".26" transform="translate(-3 2.5)" filter="url(#b3)"/></g>`;
  return g+`<path d="${d}" fill="none" stroke="#fff" stroke-width="1.6" opacity=".9"/>`+(O.style?`<path d="${d}" fill="none" stroke="#7d878d" stroke-width=".7"/>`:'');}
const glassFill=()=>pk(GLASS,'glass');
const glass=d=>`<path d="${d}" fill="${glassFill()}"/><path d="${d}" fill="url(#glassHi)"/>`;
// Upholstery drawn as a thick stroke along a centreline, with a piped groove.
function seat(d,w=S){const c=pk(CUSHC,'cush'),j='stroke-linecap="butt" stroke-linejoin="round"';
  return `<path d="${d}" fill="none" stroke="#26323a" stroke-width="${w}" ${j} opacity=".28" transform="translate(-2.4 2.4)" filter="url(#b2)"/>`+
   `<path d="${d}" fill="none" stroke="${O.style?'#8b959b':'#c9ced1'}" stroke-width="${w}" ${j}/>`+
   `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w-1.2}" ${j}/>`+
   `<path d="${d}" fill="none" stroke="#000" stroke-width="${w-6}" ${j} opacity=".14"/>`+
   `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w-7.4}" ${j}/>`+
   `<path d="${d}" fill="none" stroke="#fff" stroke-width="${(w-7.4)*.5}" ${j} opacity=".18" transform="translate(.8 -.8)"/>`;}
function pad(d){const c=pk(CUSHC,'cush');return moulded(d,c,{lift:2.2,shade:'cushion'});}
const deckIn=x=>2.8+9*Math.max(0,1-x/80)**1.3;
// ---------- Hull ----------
function hull(){const p=hullOutline(),L=FL(),dk=pk(DECKC,'deck');
  let g=`<path d="${p}" fill="#04111b" opacity=".38" transform="translate(-7 8)" filter="url(#b6)"/>`;
  g+=`<path d="${p}" fill="${pk(SIDE,'side')}"/><path d="${p}" fill="url(#sideGloss)"/>`;
  const dd=inset(0,L,deckIn,10);
  g+=`<path d="${dd}" fill="${dk}"/><path d="${dd}" fill="url(#crown)"/><path d="${dd}" fill="none" stroke="#fff" stroke-width="1" opacity=".8"/>`;
  // A raised gunwale line along the side decks.
  g+=`<path d="${inset(6,L*.86,x=>deckIn(x)+4.5,10)}" fill="none" stroke="#9aa4aa" stroke-width=".8" opacity=".55"/>`;
  if(O.style)g+=`<path d="${p}" fill="none" stroke="#56626a" stroke-width=".9"/>`;
  return g;}
// ---------- Platform ----------
function platform(len,kind){if(!len)return '';const w=hb(0)-8,d=rr(-len,-w,len+6,2*w,5);
  let g=`<path d="${d}" fill="#04111b" opacity=".3" transform="translate(-3 5)" filter="url(#b3)"/>`;
  if(kind==='white')return g+moulded(d,pk(DECKC,'deck'),{lift:0});
  const id=cid('pl');g+=`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})"><path d="${d}" fill="#c0824b"/>`;
  for(let y=-w;y<w;y+=3.2)g+=`<path d="M${-len} ${y.toFixed(1)} H6" stroke="#7a4e2a" stroke-width=".5" opacity=".55"/>`;
  g+=`<path d="${d}" fill="url(#teakGloss)"/></g>`;
  if(kind==='hatch')g+=`<path d="${rr(-len+5,-w*.45,len-9,w*.9,2)}" fill="none" stroke="#f4efe6" stroke-width="1.3"/>`;
  if(kind==='two')g+=[-1,1].map(s=>`<path d="${rr(-len+4,s<0?-w+4:4,len-6,w-8,2)}" fill="none" stroke="#f4efe6" stroke-width="1.3"/>`).join('');
  return g;}
const PLAT=[['Teak med luge',()=>platform(28,'hatch')],['Teak med to luger',()=>platform(28,'two')],['Hel teak',()=>platform(28,'teak')],['Hvid platform',()=>platform(24,'white')],['Kort teak',()=>platform(14,'teak')],['Ingen platform',()=>'']];
// ---------- Cockpit ----------
const WX=()=>FL()*.56;            // windscreen line
const CK={x0:12};const cIn=x=>deckIn(x)+10;const yi=x=>hb(x)-cIn(x);
function well(){const x1=WX()-4,d=inset(CK.x0,x1,cIn,10),k=O.floor;
  return recess(d,pk(FLOORC,'floor'),k===1?'teak':k===0||k===3?'speck':'');}
const pl=pts=>pts.map((p,i)=>(i?'L':'M')+P(...p)).join(' ');
function smooth(pts){let s=`M${P(...pts[0])}`;for(let i=1;i<pts.length-1;i++){const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];s+=` Q${P(...pts[i])} ${P(...m)}`;}return s+` L${P(...pts[pts.length-1])}`;}
function table(x,y,r){return `<circle cx="${x-1}" cy="${y+2}" r="${r}" fill="#000" opacity=".22" filter="url(#b2)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#e9ecec"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#mould)"/>`;}
function wetbar(x,y,w=30,h=13){return moulded(rr(x,y,w,h,4),pk(DECKC,'deck'),{lift:1.4})+`<circle cx="${x+8}" cy="${y+h/2}" r="3.4" fill="#c7cdd1"/><circle cx="${x+8}" cy="${y+h/2}" r="1.5" fill="#7c868c"/><path d="${rr(x+16,y+3,10,h-6,2)}" fill="#cfd5d8"/>`;}
// A polyline with rounded corners of radius r (for seat centrelines).
function rp(pts,r=10){let s=`M${P(...pts[0])}`;
  for(let i=1;i<pts.length-1;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1),k=Math.min(r,l1/2,l2/2);
    s+=` L${P(x1-(x1-x0)/l1*k,y1-(y1-y0)/l1*k)} Q${P(x1,y1)} ${P(x1+(x2-x1)/l2*k,y1+(y2-y1)/l2*k)}`;}
  return s+` L${P(...pts[pts.length-1])}`;}
const S=20;                                  // seat depth
const xa=CK.x0+S/2+1;                        // centreline of the aft bench
const wv=x=>yi(x)-S/2-1;                     // centreline of a side seat
function tableR(x0,y0,w,h){return `<path d="${rr(x0-1,y0+2,w,h,5)}" fill="#000" opacity=".2" filter="url(#b2)"/><path d="${rr(x0,y0,w,h,5)}" fill="#eef0f0"/><path d="${rr(x0,y0,w,h,5)}" fill="url(#mould)"/><path d="${rr(x0+2,y0+2,w-4,h-4,4)}" fill="none" stroke="#c3c9cc" stroke-width=".7"/>`;}
function sink(x,y){return `<circle cx="${x}" cy="${y}" r="6" fill="#d3d8db"/><circle cx="${x}" cy="${y}" r="4.6" fill="#b8c0c4"/><circle cx="${x+1}" cy="${y-1}" r="1.3" fill="#7c868c"/>`;}
function wetbar(x,len){const y=wv(x)+2,d=rr(x,y-S/2,len,S-1,4);return moulded(d,pk(DECKC,'deck'),{lift:1.4})+sink(x+len*.35,y)+`<path d="${rr(x+len*.62,y-4,len*.26,8,2)}" fill="#cfd5d8"/>`;}
const COCK=[
 ['Sofa med knæk som tegningen',()=>{const w=wv(60),xF=WX()-44,xJ1=xa+82,xJ2=xa+60,J=17;
   return well()+seat(rp([[xF,-wv(xF)],[xJ1,-wv(xJ1)],[xJ1,-w+J],[xJ2,-w+J],[xJ2,-w],[xa,-w],[xa,w*.45]],10))
    +tableR(xa+S/2+5,-w+S/2+3,xJ2-xa-S-8,24)+wetbar(xa+40,46);}],
 ['U-sofa og bord',()=>{const w=wv(60),x1=xa+66;return well()+seat(rp([[x1,-w],[xa,-w],[xa,w],[x1,w]],10))+tableR(xa+S/2+8,-w+S/2+5,x1-xa-S-6,2*w-S-10);}],
 ['Solseng agter og sofa',()=>{const w=yi(40)-1;return well()+pad(rr(CK.x0+2,-w,44,2*w,9))+`<path d="M${CK.x0+24} ${-w+4} V${w-4}" stroke="#000" stroke-width=".8" opacity=".12"/>`+seat(rp([[xa+44,-wv(80)],[xa+100,-wv(110)]]))+tableR(xa+52,-wv(80)+S/2+4,36,22)+wetbar(xa+46,44);}],
 ['To sofaer over for hinanden',()=>{const w=wv(70);return well()+seat(rp([[xa+4,-w],[xa+82,-w]]))+seat(rp([[xa+4,w],[xa+82,w]]))+tableR(xa+20,-w+S/2+5,46,2*w-S-10);}],
 ['L-sofa og stor wetbar',()=>{const w=wv(60);return well()+seat(rp([[xa,w*.2],[xa,-w],[xa+86,-w]],10))+tableR(xa+S/2+8,-w+S/2+5,40,24)+wetbar(xa+20,70);}],
 ['Åbent med bord',()=>{const w=wv(60);return well()+tableR(xa+20,-16,40,32)+wetbar(xa+40,50);}]];
// ---------- Helm and companionway ----------
function helm(){const x=WX()-46,y=wv(x)-2,xc=WX()-32,yc=-wv(xc);
  return seat(rp([[x,y-12],[x,y+4]]),S)+
   `<circle cx="${x+19}" cy="${y-4}" r="6.5" fill="none" stroke="#2d363c" stroke-width="2.2"/><circle cx="${x+19}" cy="${y-4}" r="1.5" fill="#2d363c"/>`+
   `<path d="${rr(x+26,y-13,6,20,2)}" fill="#20292f"/>`+
   // Steps down to the cabin on the port side.
   `<path d="${rr(xc,yc-8,26,22,3)}" fill="#c6ccd0"/><path d="M${xc+7} ${yc-8} V${yc+14} M${xc+14} ${yc-8} V${yc+14} M${xc+21} ${yc-8} V${yc+14}" stroke="#9aa3a8" stroke-width=".8"/>`;}
// ---------- Windscreens ----------
const SY=x=>hb(x)-deckIn(x)-1.5;
function screenPts({ahead=14,back=12,p=2,wings=30}){const W=WX(),xf=W+ahead,xs=W-back,pts=[];
  for(let i=0;i<=8;i++){const x=xs-wings*(1-i/8);pts.push([x,-SY(x),0]);}
  for(let i=1;i<40;i++){const s=-1+2*i/40,x=xf-(xf-xs)*Math.pow(Math.abs(s),p);pts.push([x,s*SY(x),1]);}
  for(let i=0;i<=8;i++){const x=xs-wings*i/8;pts.push([x,SY(x),0]);}return pts;}
// Corner cutting, so bends come out round (endpoints stay put).
function chaikin(pts,it=3){for(let k=0;k<it;k++){const o=[pts[0]];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];o.push([x0*.75+x1*.25,y0*.75+y1*.25],[x0*.25+x1*.75,y0*.25+y1*.75]);}o.push(pts[pts.length-1]);pts=o;}return pts;}
// Offset a polyline by t towards the inside of the boat (aft and to the centre).
function offsetIn(pts,t){const c=[WX()-60,0];return pts.map((q,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
  let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;if(nx*(c[0]-q[0])+ny*(c[1]-q[1])<0){nx=-nx;ny=-ny;}return [q[0]+nx*t,q[1]+ny*t];});}
// A band of glass along a curve, with rounded ends.
function screenBand(pts,t){const o=chaikin(pts.map(p=>[p[0],p[1]])),i=offsetIn(o,t).reverse();
  const cap=(a,b)=>{const m=[(a[0]+b[0])/2-t*.45,(a[1]+b[1])/2];return ` Q${P(...m)} ${P(...b)}`;};
  return `M${P(...o[0])}`+o.slice(1).map(q=>' L'+P(...q)).join('')+cap(o[o.length-1],i[0])+i.slice(1).map(q=>' L'+P(...q)).join('')+cap(i[i.length-1],o[0])+'Z';}
const outerLine=q=>{const o=chaikin(q.map(p=>[p[0],p[1]]));return `M${P(...o[0])}`+o.slice(1).map(v=>' L'+P(...v)).join('');};
function screen(opt){const pts=screenPts(opt),t=opt.t||8,fr=pk(FRAME,'frame');let parts=[pts];
  if(opt.gap){const n=pts.length;parts=[pts.slice(0,n/2-3|0),pts.slice(n/2+3|0)];}
  return parts.map(q=>{const d=screenBand(q,t);return `<path d="${d}" fill="#04111b" opacity=".25" transform="translate(-2 4)" filter="url(#b2)"/>`+

  return g+`<path d="${d}" fill="url(#teakGloss)"/></g><path d="${d}" fill="none" stroke="#000" stroke-width="1.2" opacity=".12"/>`;}
platform=function(len,kind){const [,bump,ext]=PEDGE[O.pedge];if(!ext||!len)return _platform(len,kind);
  const hw=hb(0),bw=11,dk=pk(DECKC,'deck'),r=9,x0=-len;
  const hullD=`M${P(8,-hw)} L${P(x0+r,-hw)} Q${P(x0,-hw)} ${P(x0,-hw+r)} L${P(x0,hw-r)} Q${P(x0,hw)} ${P(x0+r,hw)} L${P(8,hw)}Z`;
  let g=`<path d="${hullD}" fill="#04111b" opacity=".38" transform="translate(-6 7)" filter="url(#b3)"/><path d="${hullD}" fill="${pk(SIDE,'side')}"/><path d="${hullD}" fill="url(#sideGloss)"/>`;
  // the platform floor: white moulding between the quarters, with a lip at the aft edge
  const fl=rr(x0+1.2,-hw+bw-1,len+8,2*(hw-bw+1),3);
  g+=`<path d="${fl}" fill="${dk}"/><path d="${fl}" fill="url(#crown)"/>`;
  const yi=hw-bw-3,xa=x0+4.5,xb=-2.5;
  if(kind==='two')g+=teakPanel(rr(xa,-yi,xb-xa,yi-2,2))+teakPanel(rr(xa,2,xb-xa,yi-2,2));
  else if(kind==='hatch'||kind==='teak')g+=teakPanel(rr(xa,-yi,xb-xa,2*yi,2))+(kind==='hatch'?`<path d="${rr(xa+3,-yi*.5,xb-xa-6,yi,2)}" fill="none" stroke="#f4efe6" stroke-width="1.2"/>`:'');
  // the quarters: hull-coloured edge, white top that darkens as it falls away aft
  [-1,1].forEach(s=>{const id=cid('q'),o=s*(hw-.9),i=s*(hw-bw);
    const q=`M${P(8,o)} L${P(x0+r,o)} Q${P(x0+1,o)} ${P(x0+1.5,o-s*r*.8)} Q${P(x0+2.5,i)} ${P(x0+r+2,i)} L${P(8,i)}Z`;
    g+=`<linearGradient id="${id}" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".45" stop-color="#000" stop-opacity=".04"/><stop offset=".85" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>`;
    g+=`<path d="${q}" fill="#04111b" opacity=".2" transform="translate(-1 ${s*-1.5+1.5})" filter="url(#b2)"/><path d="${q}" fill="${dk}"/><path d="${q}" fill="url(#crown)"/><path d="${q}" fill="url(#${id})"/>`;
    g+=`<path d="M${P(6,i+s*1.2)} L${P(x0+r+3,i+s*1.2)}" stroke="#fff" stroke-width="1" opacity=".8"/>`;});
  if(bump){const c=BUMPC[bump],b=`M${P(x0+1.2,-hw+bw)} L${P(x0+1.2,hw-bw)}`;
    g+=`<path d="${b}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>`;}
  return g;};
PEDGE[4][0]='Skroget med ned langs platformen';PEDGE[5][0]='Skroget med ned og bumper agter';
// The owner's own arrangement: canvas over the whole cockpit and a steel mast with radar.
function radarMast(){const W=WX(),x=W-150>20?40:20,[,a,b]=mt(),y=hb(x)-deckIn(x)-6;
  return steelLine(`M${P(x-6,-y)} Q${P(x+10,0)} ${P(x-6,y)}`,2.2)+steelLine(`M${P(x+2,0)} L${P(x+2,0)}`,1)+
   `<circle cx="${x+1}" cy="2" r="9" fill="#04111b" opacity=".28" filter="url(#b2)" transform="translate(-3 3)"/><circle cx="${x+3}" cy="0" r="8.5" fill="#f2f3f1"/><circle cx="${x+3}" cy="0" r="8.5" fill="url(#fendG)"/>`;}
ROOF.push(['Kaleche over hele cockpittet og stålbøjle med radar',()=>canvasTop(6,WX()+4,6,14,4)+radarMast()]);
O.pedge=4;

const C={pedge:L=>[-40,-70,90,140],bow:L=>[L*.72,-50,L*.28+34,100],form:null,plat:L=>[-56,-70,166,140],cock:L=>[-6,-70,200,140],screen:L=>[L*.56-90,-70,140,140],roof:L=>[0,-70,L*.56+30,140],fore:L=>[L*.56-10,-70,L*.44+16,140],
 cleatt:L=>[L*.63-20,-hb(L*.63)-3,40,32],cleato:L=>[L*.63-20,-hb(L*.63)-3,40,32],metal:null,rail:L=>[L*.4,-72,L*.6+10,144],ladder:L=>[-56,-66,80,132],lside:L=>[-62,-70,130,140],ftie:L=>[L*.12-30,-hb(L*.3)-20,90,60],
 fendh:L=>[L*.12-40,-hb(L*.3)-20,110,70],fendt:L=>[L*.12-40,-hb(L*.3)-20,110,70]};
const GROUPS=[
 ['cleatn','Klamper: antal',CLEATN,'boat'],['cleatpos','Klamper: placering',CLEATPOS,'boat'],['cleatt','Klamper: type',CLEATT,'boat'],['cleato','Klamper: retning',CLEATO,'boat'],
 ['bow','Stævn og anker',BOWS,'boat'],['metal','Beslag og gelænder: metal',METAL,'sw'],['rail','Gelænder',RAIL,'boat'],['ladder','Badestige',LADDER,'boat'],['lside','Badestige: side',LSIDE,'boat'],
 ['fendn','Fendere: antal',FENDN,'boat'],['fends','Fendere: side',FENDS,'boat'],['fendh','Fendere: hængemåde',FENDH,'boat'],['fendt','Fendere: type',FENDT,'boat'],['fendc','Fendere: farve',FENDC,'sw'],['ftie','Fendere: bundet',FTIE,'boat'],['fline','Fenderline: farve',FLINE,'sw'],
 ['form','Form',FORMS,'boat'],['screen','Rude',SCREEN,'boat'],['roof','Tag',ROOF,'boat'],['cock','Cockpit',COCK,'boat'],['fore','Fordæk',FORE,'boat'],['plat','Badeplatform',PLAT,'boat'],['pedge','Badeplatform: kant',PEDGE,'boat'],
 ['roofc','Tagfarve',ROOFC,'sw'],['canvas','Kaleche og stof',CANVAS,'sw'],['frame','Ruderamme',FRAME,'sw'],['glass','Glas',GLASS,'sw'],
 ['side','Skrogside',SIDE,'sw'],['stripe','Skrogstribe',STRIPE,'sw'],['deck','Dæk',DECKC,'sw'],['floor','Cockpitgulv',FLOORC,'sw'],['cush','Hynder',CUSHC,'sw'],
 ['style','Stil',[['Blød, uden streger','#f4f5f5'],['Med fine streger','#8b959b']],'sw']
];
const gEl=document.getElementById('groups');
function render(){
  document.getElementById('big').innerHTML=boatSvg();
  let h='';
  for(const [k,name,list,kind] of GROUPS){
    const cur=O[k];h+=`<section class="grp"><h2>${name}<span>${list[cur][0]}</span></h2><div class="opts${kind==='sw'?' small':''}">`;
    list.forEach((it,i)=>{
      if(kind==='sw')h+=`<button class="opt" data-k="${k}" data-i="${i}" aria-pressed="${i===cur}"><span class="sw"><i style="background:linear-gradient(135deg,${it[1]},${it[2]||it[1]})"></i><b>${it[0]}</b></span></button>`;
      else{O[k]=i;const s=boatSvg(C[k]);O[k]=cur;h+=`<button class="opt" data-k="${k}" data-i="${i}" aria-pressed="${i===cur}">${s}<b>${i+1}. ${it[0]}</b></button>`;}
    });
    h+=`</div></section>`;
  }
  gEl.innerHTML=h;
  document.getElementById('code').textContent=code();
}
function code(){return GROUPS.map(([k,n,l])=>`${n} ${O[k]+1}`).join(' · ');}
gEl.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;O[b.dataset.k]=+b.dataset.i;const y=scrollY;render();scrollTo(0,y);});
document.getElementById('copy').onclick=async()=>{const t=code();try{await navigator.clipboard.writeText(t);}catch(_){prompt('Kopiér:',t);}const b=document.getElementById('copy');b.textContent='Kopieret';setTimeout(()=>b.textContent='Kopiér valget',1400);};
document.getElementById('targa').onclick=()=>{Object.assign(O,TARGA);render();};
document.getElementById('rnd').onclick=()=>{for(const [k,,l] of GROUPS)O[k]=Math.floor(Math.random()*l.length);render();};
render();
</script></body></html>
