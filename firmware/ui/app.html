// ---------- Network ----------
// EngineLink answers on its own network (192.168.4.1) and, when it is on the
// boat router, at its router address too. If the phone moves to the router's
// Wi-Fi, the app looks for EngineLink there and carries on by itself.
let BASE='';
function rememberIp(ip){if(!ip)return;try{localStorage.setItem('el.ip',ip);}catch(e){}}
function hostCandidates(){
  const h=[''],add=x=>{if(x&&x!==location.origin&&!h.includes(x))h.push(x);};
  add('http://192.168.4.1');
  try{const ip=localStorage.getItem('el.ip');if(ip)add('http://'+ip);}catch(e){}
  let host='enginelink';try{host=localStorage.getItem('el.host')||host;}catch(e){}
  add('http://'+host+'.local');if(host!=='enginelink')add('http://enginelink.local');
  return h;
}
async function findHost(){
  for(const b of hostCandidates()){
    if(b===BASE)continue;
    const c=new AbortController(),id=setTimeout(()=>c.abort(),1500);
    try{const r=await fetch(b+'/api/live',{cache:'no-store',signal:c.signal});if(r.ok){BASE=b;return await r.json();}}catch(e){}
    finally{clearTimeout(id);}
  }
  return null;
}
async function get(u,t=3000){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),t);
  try{const r=await fetch(BASE+u,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(id);}
}
async function post(u,data={},t=10000){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),t);
  try{
    const r=await fetch(BASE+u,{method:'POST',body:new URLSearchParams(data),signal:c.signal,cache:'no-store'});
    let j={ok:r.ok,message:''};try{j=await r.json();}catch(e){}
    return j;
  }catch(e){return {ok:false,message:'No answer from EngineLink. Check the Wi-Fi connection.'};}
  finally{clearTimeout(id);}
}

function clickLink(href,name){const a=document.createElement('a');a.href=href;a.className='dl';a.setAttribute('download',name||'');document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);}

// Live data about twice a second. When EngineLink does not answer, the last
// values stay on screen (dimmed) and the app keeps trying, faster as soon as
// the phone is back, so a short Wi-Fi drop needs no reload.
let tickTimer=0,ticking=false;
function schedule(ms){clearTimeout(tickTimer);tickTimer=setTimeout(tick,ms);}
async function tick(){
  if(ticking)return;
  if(document.hidden){schedule(3000);return;}
  ticking=true;
  const t0=performance.now();
  try{
    const d=await get('/api/live',2500);
    // Average answer time: on a weak link EngineLink is asked less often, so
    // the requests that do go out are not queued behind each other.
    const rt=performance.now()-t0;S.rtt=S.rtt?S.rtt*0.8+rt*0.2:rt;
    S.live=d;S.liveAt=Date.now();S.fails=0;setConn(true);onLive();
  }catch(e){
    S.fails++;S.failTotal=(S.failTotal||0)+1;
    if(S.fails>=2)setConn(false);
    // Still nothing: the phone may have moved to another network.
    if(S.fails>=3&&S.fails%3===0){const d=await findHost();if(d){S.live=d;S.liveAt=Date.now();S.fails=0;setConn(true);onLive();}}
  }finally{ticking=false;}
  schedule(S.fails?Math.min(400*S.fails,2000):Math.round(Math.min(2000,Math.max(500,(S.rtt||0)*1.5))));
}
function tickNow(){S.fails=Math.min(S.fails,1);schedule(30);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickNow();wake();}});
addEventListener('online',tickNow);addEventListener('pageshow',tickNow);addEventListener('focus',tickNow);
function setConn(ok){
  if(ok===S.conn&&ok)return;
  S.conn=ok;
  const b=$('#banner');
  document.body.classList.toggle('stale',!ok);
  if(ok){b.classList.remove('show');if(S.wasDown){S.wasDown=false;reloadData();}return;}
  S.wasDown=true;
  b.innerHTML='<i></i>Reconnecting'+(S.liveAt?' · values from '+new Date(S.liveAt).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'}):'');
  b.classList.add('show');
}
let toastTimer=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);}
async function act(u,data,okMsg){const r=await post(u,data);toast(r.message||(r.ok?okMsg||'Done':'Something went wrong'));return r;}

// ---------- Engines ----------
// Engines in the order Port, Starboard (by the socket choice in Settings).
function engines(){
  const lv=S.live;if(!lv)return [];
  const pi=lv.port;
  const order=pi===1?[1,0]:[0,1];
  return order.map((c,i)=>Object.assign({ch:c,name:pi<0?(c===0?'J7':'J6'):(i===0?'Port':'Starboard'),color:pi<0?(i===0?'var(--blue)':'var(--teal)'):(i===0?'var(--port)':'var(--stbd)'),sock:c===0?'J7':'J6'},lv.e[c]));
}
const ev=(e,idx)=>e&&e.x&&fin(e.x[idx])?e.x[idx]:null;
const totalLph=()=>{const es=engines();let t=0,n=0;for(const e of es){if(fin(e.lph)){t+=e.lph;n++;}}return n?t:null;};
// Gear from the bits learned at the dock (Diagnostics > Learn the gear).
// Until then the raw value is not trusted: its meaning is not confirmed.
const gearName=v=>{
  if(!fin(v))return '—';
  const c=cfgv(),g=c&&c.gear;
  if(!g||!(g[0]||g[2]))return 'Not learned';
  if(g[0]&&(v&g[0])===g[1])return 'Forward';
  if(g[2]&&(v&g[2])===g[3])return 'Reverse';
  return 'Neutral';
};

// ---------- Live updates ----------
function onLive(){
  const lv=S.live;
  if(lv.net&&lv.net.ip)rememberIp(lv.net.ip);
  if(lv.net&&lv.net.host&&lv.net.host!==S.hostSeen){S.hostSeen=lv.net.host;try{localStorage.setItem('el.host',lv.net.host);}catch(e){}}
  // The phone's clock sets EngineLink's clock when nothing better is there.
  if((!lv.utc||Math.abs(lv.utc*1000-Date.now())>90000)&&Date.now()-S.timeSentAt>300000){S.timeSentAt=Date.now();post('/api/phone-time',{ms:String(Date.now())});}
  const t=totalLph();
  if(Date.now()-S.lastHist>=10000){S.lastHist=Date.now();S.hist.push(lv.trip.act&&fin(t)?t:null);if(S.hist.length>90)S.hist.shift();}
  warmStep();
  if(S.prevAct===true&&!lv.trip.act){load('trips');load('econ');}
  S.prevAct=lv.trip.act;
  if(S.prevFw!==lv.fw&&S.page==='fw')load('fw');
  S.prevFw=lv.fw;
  // A new event: tell the phone, refresh the list.
  const le=lv.ev&&lv.ev.last;
  if(le&&S.lastEvId!==undefined&&le.id!==S.lastEvId&&le.sev>=1){try{navigator.vibrate&&navigator.vibrate(le.sev>1?[300,120,300,120,300]:[200,100,200]);}catch(e){}toast(evTitle(le));}
  if(le&&le.id!==S.lastEvId&&(S.page==='events'||S.events))load('events');
  S.lastEvId=le?le.id:0;
  if(S.tab==='engines'&&!S.page&&(!S.recentAt||Date.now()-S.recentAt>10000))load('recent');
  if(S.page==='led'&&(!S.ledAt||Date.now()-S.ledAt>1000)){S.ledAt=Date.now();load('led');}
  if(!S.page&&(S.tab==='trip'||S.tab==='engines'||S.tab==='tank'))render();
}

// ---------- Warm-up guide ----------
// Shown after a cold start; closes after the chosen time on screen, or with ✕.
function warmStep(){
  const W=S.warm,es=engines().filter(e=>e.run);
  if(!P.warmOn){W.phase='idle';return;}
  if(!es.length){if(W.phase==='done'||W.phase==='warming')W.phase='idle';return;}
  const temps=es.map(e=>ev(e,259)).filter(fin);
  if(!temps.length)return;
  const min=Math.min(...temps);
  if(W.phase==='idle'){W.phase=min<P.warmTarget-2?'warming':'done';W.samples=[];}
  if(W.phase==='warming'){
    W.samples.push([Date.now(),min]);
    W.samples=W.samples.filter(s=>Date.now()-s[0]<180000);
    if(min>=P.warmTarget){W.phase='ready';W.seen=0;}
  }
  if(W.phase==='ready'&&S.tab==='trip'&&!S.page&&!document.hidden){
    W.seen+=0.5;
    if(P.warmClose>0&&W.seen>=P.warmClose)W.phase='done';
  }
}
function warmBox(){
  const W=S.warm;
  if(!P.warmOn||(W.phase!=='warming'&&W.phase!=='ready'))return '';
  const es=engines().filter(e=>e.run),ready=W.phase==='ready';
  const fg=ready?'var(--green)':'var(--orange)',bg=ready?'var(--gsoft)':'var(--osoft)';
  let big='',small='';
  if(ready){big='';small=P.warmClose>0?'Closes in '+Math.max(0,Math.ceil(P.warmClose-W.seen))+' s':'';}
  else{
    const s=W.samples;let eta=null;
    if(s.length>4){const a=s[0],b=s[s.length-1],rate=(b[1]-a[1])/((b[0]-a[0])/60000);if(rate>0.2)eta=(P.warmTarget-b[1])/rate;}
    big=eta!=null?Math.max(1,Math.ceil(eta))+' min':'…';small=eta!=null?'until ready':'working it out';
  }
  const rows=es.map(e=>{const c=ev(e,259),p=fin(c)?clamp((c-20)/(P.warmTarget-20)*100,4,100):4;
    return `<div><div class="cth s13"><span style="display:inline-flex;gap:6px;align-items:center;color:${e.color}"><span class="dot" style="width:7px;height:7px;background:${e.color}"></span>${e.name}</span><span><b style="font-size:15px;font-weight:600">${NF(U.temp(c),0)}</b> <span class="sub">/ ${NF(U.temp(P.warmTarget),0)} ${U.tu()}</span></span></div><div class="bar" style="height:6px;margin-top:7px"><i style="width:${p}%;background:${fg}"></i></div></div>`;}).join('');
  return `<div class="card glow" style="background:${bg};box-shadow:0 0 0 1px ${ready?'rgba(125,220,176,.55)':'rgba(240,192,110,.55)'},0 0 28px ${ready?'rgba(125,220,176,.3)':'rgba(240,192,110,.32)'};display:flex;flex-direction:column;gap:14px" ${ready&&P.warmClose>0?'data-a="warmClose"':''}>
    <div style="display:flex;gap:12px;align-items:center">
      <span style="width:42px;height:42px;border-radius:13px;background:${ready?'rgba(125,220,176,.16)':'rgba(240,192,110,.16)'};display:flex;align-items:center;justify-content:center;flex:none">${svg(ready?IC.check:IC.therm,22,fg,2)}</span>
      <div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:600">${ready?'Engines are warm':'Warming up'}</div><div class="s13 sub">${ready?'Full power is fine now':'Keep below 1.500 rpm'}</div></div>
      <div style="text-align:right"><div style="font-size:26px;font-weight:650;color:${fg};line-height:1">${big}</div><div class="s12 sub" style="margin-top:4px">${small}</div></div>
      ${ready&&!(P.warmClose>0)?`<button data-a="warmClose" aria-label="Close" style="width:36px;height:36px;border-radius:50%;background:rgba(125,220,176,.16);display:flex;align-items:center;justify-content:center">${svg(IC.x,16,'var(--text)',2.4)}</button>`:''}
    </div>
    <div class="grid2" style="gap:14px">${rows}</div></div>`;
}

// With SAE J1587 chosen, EngineLink only listens and never asks the KAD/EDC I

// ---------- Trip ----------
function vTrip(){

  const es=engines(),tr=lv.trip,price=lv.price;
  let h='<div class="stack live">'+warmBox();
  if(tr.act){
    const used=(tr.l[0]||0)+(tr.l[1]||0);
    h+=`<div class="card"><div class="cth"><span class="lbl" style="color:var(--teal)">${svg(IC.drop,16,'var(--teal)')}Fuel this trip</span><span class="s13 sub" style="display:inline-flex;gap:6px;align-items:center"><span class="dot" style="width:7px;height:7px;background:${S.conn?'var(--green)':'var(--off)'}"></span>${S.conn?'Live':'Paused'}</span></div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span class="big" style="font-size:76px;letter-spacing:-3px">${L(used,1)}</span><span style="font-size:20px;font-weight:600" class="sub">${imp()?'gallons':'litres'}</span></div>
      <div class="s13 sub" style="margin-top:4px">${tr.start?'Since '+hm(tr.start)+' · ':''}${dur(tr.run)} running</div>
      <div class="grid2" style="margin-top:16px">${es.map(e=>`<div><div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:${e.color}"><span class="dot" style="background:${e.color}"></span>${e.name}</div><div style="font-size:24px;font-weight:600;margin-top:2px">${L(tr.l[e.ch],1)} <span class="s13 sub">${U.vu()}</span></div><div class="s13 sub">${fin(e.lph)?L(e.lph,1)+' '+U.ru()+' now':e.run?'no fuel data':'stopped'}</div></div>`).join('')}</div></div>`;
    const avg=tr.run>60?used/(tr.run/3600):null,tot=totalLph(),lnm=fin(tot)&&fin(lv.sog)&&lv.sog>2?tot/lv.sog:null;
    h+=`<div class="grid3"><div class="tile"><div class="k">Average</div><div class="v">${L(avg,1)}</div><div class="s12 sub">${U.ru()}</div></div>
      <div class="tile"><div class="k">Per mile</div><div class="v">${lnm!=null?L(lnm,2):'—'}</div><div class="s12 sub">${lnm!=null?U.perNm():'needs GPS'}</div></div>
      <div class="tile"><div class="k">Cost</div><div class="v">${price>0?NF(used*price,0):'—'}</div><div class="s12 sub">${price>0?cur()+' · '+NF(imp()?price/0.264172:price,2)+'/'+U.vu():'set a price'}</div></div></div>`;
    h+=burnCard(avg);
  }else{
    h+=`<div class="card"><div class="lbl" style="color:var(--teal)">${svg(IC.drop,16,'var(--teal)')}No trip running</div><div class="s14 sub" style="margin-top:6px">A trip starts by itself when the first engine starts, and ends when both engines have been off for ${S.state?S.state.config.tripEnd:2} minutes.</div>${lastTripLine()}</div>`;
    if(es.some(e=>fin(e.rpm)))h+=burnCard(null);
  }

}
function lastTripLine(){
  const t=S.trips&&S.trips.trips&&S.trips.trips[0];
  if(!t)return '';
  const l=(t.l[0]||0)+(t.l[1]||0);
  return `<button class="row" data-a="tab" data-v="history" style="margin-top:8px;border-top:1px solid var(--line)"><span><span class="rt">Last trip · ${dayLabel(t.s)}</span><span class="rh">${hm(t.s)} – ${hm(t.e)} · ${dur(t.run)}</span></span><span class="rv">${L(l,1)} ${U.vu()} ›</span></button>`;
}
function burnCard(avg){
  const tot=totalLph();
  const pts=S.hist.filter(fin);
  let chart='';
  if(pts.length>2){
    const vals=S.hist.map(v=>fin(v)?v:null);
    const lo=Math.min(...pts,fin(avg)?avg:Infinity)-2,hi=Math.max(...pts,fin(avg)?avg:-Infinity)+2;
    const y=v=>(74-(v-lo)/(hi-lo||1)*68).toFixed(1);
    const n=vals.length,xy=vals.map((v,i)=>v==null?null:[(i/(n-1)*320).toFixed(1),y(v)]).filter(Boolean);
    const line=xy.map(p=>p.join(',')).join(' ');
    chart=`<svg viewBox="0 0 320 80" width="100%" height="80" style="display:block;margin-top:10px" role="img" aria-label="Fuel flow over the last 15 minutes"><polygon points="${line} ${xy[xy.length-1][0]},80 ${xy[0][0]},80" fill="var(--osoft)"/><polyline points="${line}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${fin(avg)?`<line x1="0" x2="320" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="5 4"/>`:''}</svg>
      <div class="cth s12 sub" style="margin-top:4px"><span>15 min ago</span>${fin(avg)?`<span>- - trip average ${L(avg,1)}</span>`:''}<span>now</span></div>`;
  }
  const diff=fin(tot)&&fin(avg)?tot-avg:null;
  return `<div class="card"><div class="cth"><span class="lbl" style="color:var(--orange)">${svg(IC.flame,16,'var(--orange)',2)}Burning now</span><span class="s13 sub">both engines</span></div>
    <div class="cth" style="margin-top:8px;align-items:center"><div><span class="big" style="font-size:42px">${L(tot,1)}</span> <span class="unit">${U.ru()}</span></div>${diff!=null?(Math.abs(diff)<0.05?`<span class="chip" style="background:var(--track);color:var(--sub)">On your average</span>`:`<span class="chip" style="background:${diff>0?'var(--osoft)':'var(--gsoft)'};color:${diff>0?'var(--orange)':'var(--gtext)'}">${diff>0?'▲':'▼'} ${L(Math.abs(diff),1)} ${diff>0?'above':'below'} average</span>`):''}</div>${chart}</div>`;
}
function rangeCard(){
  const lv=S.live,tk=lv.tank;
  if(!(tk.cap>0)||!fin(tk.aboard))return `<button class="card" data-a="${tk.cap>0?'tab':'tankEditGo'}" data-v="tank" style="text-align:left;width:100%"><span class="lbl" style="color:var(--blue)">${svg(IC.pin,16,'var(--blue)',2.2)}Range</span><div class="s14 sub" style="margin-top:6px">${tk.cap>0?'Log a full tank once, then EngineLink shows how far the fuel aboard goes.':'Set the fuel tank size in Settings to see the range.'}</div></button>`;
  const tot=totalLph(),usable=Math.max(0,tk.aboard-tk.cap*tk.reserve/100),hours=fin(tot)&&tot>1?usable/tot:null;

  return `<button class="card" data-a="tab" data-v="tank" style="text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center"><div><span class="lbl" style="color:var(--blue)">${svg(IC.pin,16,'var(--blue)',2.2)}Range</span>
    <div style="font-size:30px;font-weight:700;margin-top:6px">${nm!=null?NF(nm,0)+' <span class="unit">nm</span> <span style="font-size:18px;font-weight:600" class="sub">· '+dur(hours*3600)+'</span>':hours!=null?dur(hours*3600):L(usable,0)+' <span class="unit">'+U.vu()+' usable</span>'}</div>
    <div class="s13 sub" style="margin-top:2px">${hours!=null?(nm!=null?'at '+NF(lv.sog,1)+' kn, ':'at '+L(tot,1)+' '+U.ru()+', ')+(tk.reserve?'keeping '+tk.reserve+' % reserve':'until the tank is empty')+(fin(tk.pm)&&tk.pm>0?' · ± '+dur(tk.pm/tot*3600):''):'Shown in time once an engine runs'}${nm==null?`<div class="s12 sub" style="margin-top:4px">${lv.sog==null?'Nautical miles need the boat speed from GPS: Settings › Speed source.':'Nautical miles show while the boat moves.'}</div>`:''}</div></div><span class="sub">›</span></button>`;
}

// ---------- Economy ----------
const ZONES=[['Idle & manoeuvring','under 1.000 rpm','var(--sub)'],['Low speed','1.000 – 2.000 rpm','var(--blue)'],['Getting on the plane','2.000 – 2.500 rpm','var(--orange)'],['Cruise','2.500 – 3.000 rpm','var(--green)'],['Fast','over 3.000 rpm','var(--purple)']];

}
function vEconomy(){

        ${now10!=null?`<div><div class="cth s13"><span style="font-weight:600">Right now · ${NF(sog,1)} kn</span><span><b>${L(now10,1)} ${U.vu()}</b> <span class="sub">${price>0?'· '+money(now10*price):''} per 10 nm</span></span></div><div class="bar" style="margin-top:6px"><i style="width:${clamp(now10/(Math.max(now10,best.l10)*1.15)*100,5,100)}%;background:${over<=0.05?'var(--green)':over<=0.2?'var(--orange)':'var(--red)'}"></i></div></div>`:''}
      </div>
      ${over!=null?`<div style="margin-top:16px;border-radius:16px;padding:13px 14px;background:${over<=0.05?'var(--gsoft)':'var(--osoft)'};color:${over<=0.05?'var(--gtext)':'var(--orange)'};font-size:14px;font-weight:600">${over<=0.05?'You are at your most economical speed.':'Ease off to about '+NF(best.rpm,0)+' rpm: '+L(now10-best.l10,1)+' '+U.vu()+' less every 10 nm.'}</div>`:''}</div>`;
  }else{
    h+=`<div class="card"><span class="lbl" style="color:var(--green)">Your best cruising speed</span><div class="s14 sub" style="margin-top:6px">${S.live&&fin(S.live.sog)?'Learning. A few trips at different speeds are needed.':'Needs GPS speed. Connect EngineLink to NMEA 2000 (Settings › Speed source) and it works out fuel per mile at every rpm. Until then the table below shows fuel per hour.'}</div></div>`;
  }

    h+=`<div class="card" style="padding:16px 0 6px"><div class="cth" style="padding:0 20px 8px"><span class="ct">Speed table</span><span class="s12 sub">from your own trips</span></div>

      ${rows.map(r=>{const isB=best&&r.rpm===best.rpm;return `<div class="tbl" style="border-top:1px solid var(--line);${isB?'background:var(--gsoft)':''}"><span style="font-size:15px;font-weight:600;${isB?'color:var(--gtext)':''}">${NF(r.rpm,0)}</span><span class="s14" style="text-align:right">${r.kn!=null?NF(r.kn,1):'—'}</span><span class="s14" style="text-align:right">${L(r.lph,0)}</span><span class="s14" style="text-align:right;font-weight:600">${r.l10!=null?L(r.l10,1)+' '+U.vu()+(price>0?'<br><span class="s12 sub" style="font-weight:400">'+money(r.l10*price)+'</span>':''):'—'}</span></div>`;}).join('')}
      <div class="s12 sub" style="padding:10px 20px">Each row needs 2 minutes at that rpm. Values in the middle of a 250 rpm step.</div></div>`;

function planCard(rows,best,price){

const COND={

function condRows(){

const GEARSTEPS=[['N','Neutral','Both levers in neutral.'],['F','Forward','Both levers into forward, at idle.'],['N','Neutral','Back to neutral.'],['R','Reverse','Both levers into reverse, at idle.'],['N','Neutral','Back to neutral. Last step.']];

function units(){

  const groups=new Map();
  for(const r of t){const k=r.g||r.id;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r);}
  const out=[];
  for(const [k,parts] of groups){
    parts.sort((a,b)=>a.s-b.s||a.id-b.id);
    const s=parts[0].s,e=parts[parts.length-1].e,run=parts.reduce((a,p)=>a+p.run,0);
    const l=[0,1].map(c=>parts.reduce((a,p)=>a+(p.l[c]||0),0));
    const note=parts.find(p=>p.p||p.sea||p.w||p.x||p.n)||parts[0];
    out.push({key:k,ids:parts.map(p=>p.id),parts,s,e,run,l,fuel:l[0]+l[1],combined:parts.length>1,note,group:parts[0].g});
  }
  return out.sort((a,b)=>(b.s||0)-(a.s||0)||b.key-a.key);

function valText(key,v){
  if(!fin(v))return ['—',''];
  switch(key){
    case 'cool':case 'air':case 'ftemp':return [NF(U.temp(v),0),U.tu()];
    case 'boost':return [NF(U.press(v),imp()?1:2),U.pu()];
    case 'batt':return [NF(v,1),'V'];
    case 'gear':return [gearName(v),''];
    case 'hours':return [NF(v,1),'h'];
    case 'rate':return [L(v,1),U.ru()];
    case 'req':return [NF(v,0),'rpm'];
    case 'inlet':return [NF(imp()?v*0.145038:v,imp()?1:0),imp()?'psi':'kPa'];
    case 'rack':case 'load':return [NF(v,0),'%'];
    case 'inj':return [NF(v,1),'°'];
    case 'start':return ['0x'+(v>>>0).toString(16).toUpperCase().padStart(4,'0'),''];
    default:return [NF(v,0),''];
  }
}

const HEALTH={
  cool:['Coolant temperature','How well the cooling system gets rid of heat. A slow rise over weeks is the earliest sign of a worn impeller or a blocked heat exchanger.','Check the impeller and the raw-water intake. Keep the impeller on its yearly schedule.'],
  boost:['Boost pressure','Boost is how much air the turbo pushes into the engine. Less air means more fuel for the same power.','Check the air filter first. If boost stays low, have the turbo and the intercooler hoses checked.'],
  air:['Charge air temperature','The air temperature after the intercooler. If it climbs, the intercooler is dirty or lacks cooling water, and the engine loses power.','Have the intercooler cleaned and check the raw-water flow.'],
  fuel:['Fuel per rpm','At the same rpm an engine should use what it normally uses. A rise means it works harder (hull, propeller) or burns less cleanly.','Check the propeller and hull, then the air filter and injectors.'],
  ftemp:['Fuel temperature','Hot diesel is thinner and gives less power. It rises on long runs with a low tank.','Keep more fuel in the tank on long runs.'],
  batt:['Battery charging','Shows that the alternators charge. Under 13,5 V while running usually means a slipping belt or a failing alternator.','Check the alternator belt and connections.']

function healthCard(es){
  const e=S.econ;
  const rows=[];let look=0;
  const name=i=>es[i]?es[i].name:'';
  const devs=es.map(x=>e&&e.h?e.h.dev[x.ch]:null);
  const learning=devs.every(d=>!d||d.trips<3);
  const add=(id,status,now,text)=>{if(status==='look')look++;rows.push({id,status,now,text});};
  if(learning){
    const n=devs.reduce((m,d)=>Math.max(m,d?d.trips:0),0);
    add('cool','learn','Learning what is normal for each engine ('+n+' of 3 trips).','');
  }else{
    const msg=(i,m,th,fmt)=>{const d=devs[i];if(!d||d.trips<3||!fin(d.d[m]))return null;return Math.abs(d.d[m])>th?name(i)+' '+fmt(d.d[m]):null;};
    const pct=v=>(v>0?'+':'')+NF(v*100,0)+' % vs normal';
    const cool=[0,1].map(i=>msg(i,0,4,v=>(v>0?'+':'')+NF(v,1)+' °C vs normal')).filter(Boolean);
    add('cool',cool.length?'look':'ok',cool.length?cool.join(' · '):'Normal at cruise',cool.length?'Higher than this engine normally runs at the same rpm.':'');
    const boost=[0,1].map(i=>msg(i,1,0.06,pct)).filter(Boolean);
    add('boost',boost.length?'look':'ok',boost.length?boost.join(' · '):'Normal',boost.length?'Different from what this engine normally gives at the same rpm.':'');
    const air=[0,1].map(i=>msg(i,2,0.1,pct)).filter(Boolean);
    add('air',air.length?'look':'ok',air.length?air.join(' · '):'Normal','');
    const fuel=[0,1].map(i=>msg(i,3,0.06,pct)).filter(Boolean);
    add('fuel',fuel.length?'look':'ok',fuel.length?fuel.join(' · '):'Normal','');
  }
  const ft=es.map(x=>ev(x,260)).filter(fin);
  if(ft.length)add('ftemp',Math.max(...ft)>45?'look':'ok',es.map(x=>fin(ev(x,260))?x.name+' '+NF(U.temp(ev(x,260)),0)+' '+U.tu():'').filter(Boolean).join(' · '),Math.max(...ft)>45?'Over 45 °C.':'');
  const bv=es.filter(x=>x.run).map(x=>ev(x,293)).filter(fin);
  if(bv.length)add('batt',Math.min(...bv)<13.5?'look':'ok',es.filter(x=>x.run&&fin(ev(x,293))).map(x=>x.name+' '+NF(ev(x,293),1)+' V').join(' · '),Math.min(...bv)<13.5?'Low while running.':'');
  return `<div class="card" style="padding:6px 20px 8px"><div class="cth" style="padding:14px 0 2px"><span class="ct">Health check</span><span class="s13" style="font-weight:600;color:${look?'var(--orange)':'var(--green)'}">${learning?'Learning':look?look+' thing'+(look>1?'s':'')+' worth a look':'All normal'}</span></div>
    <div class="s12 sub" style="padding-bottom:6px">Each engine is compared with its own normal at the same rpm. Tap a line to read more.</div>
    ${rows.map(r=>{const open=S.healthOpen===r.id,[t,why,todo]=HEALTH[r.id],c=r.status==='look'?'var(--orange)':r.status==='learn'?'var(--sub)':'var(--green)';
      return `<button data-a="healthOpen" data-v="${r.id}" style="width:100%;text-align:left;display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)"><span class="dot" style="width:8px;height:8px;background:${c};margin-top:7px"></span><span style="flex:1;display:block"><span class="cth"><span style="font-size:14.5px">${r.status==='learn'?'Normal values':t}</span><span class="s13" style="color:${r.status==='look'?'var(--orange)':'var(--sub)'};white-space:nowrap">${r.status==='look'?'Worth a look':r.status==='learn'?'':'Normal'} ${r.status==='learn'?'':open?'⌃':'⌄'}</span></span><span class="s12 sub" style="display:block;margin-top:3px">${esc(r.now)}</span>${r.text?`<span class="s13" style="display:block;margin-top:6px">${r.text}</span>`:''}
        ${open&&r.status!=='learn'?`<span style="display:block;background:var(--track);border-radius:12px;padding:10px 12px;margin-top:8px"><span class="s12 sub" style="display:block;font-weight:600">What it tells you</span><span class="s13" style="display:block;margin-top:2px">${why}</span><span class="s12 sub" style="display:block;font-weight:600;margin-top:8px">${r.status==='look'?'What to do':'If it changes'}</span><span class="s13" style="display:block;margin-top:2px">${todo}</span></span>`:''}</span></button>`;}).join('')}</div>`;
}

// Line chart of one value for both engines. series: JSON from /api/*/series.
const CHARTM=[['rpm','Rpm'],['lph','Fuel'],['cool','Coolant'],['boost','Boost'],['air','Charge air'],['volt','Battery'],['req','Lever']];
function chartVal(m,v){if(v==null)return null;if(m==='cool'||m==='air')return U.temp(v);if(m==='boost')return U.press(v);if(m==='lph')return imp()?v*0.264172:v;return v;}

function chartSvg(sr,m,mark){
  if(!sr||!sr.t||!sr.t.length)return '<div class="empty">No recording yet.</div>';

// How fast EngineLink reads each engine, and the scan for more values.
function readingBlock(d,es){
  const rd=d.reading;if(!rd)return '';
  const rows=es.map(e=>{const r=rd[e.ch];if(!r)return '';const ds=r.disc||{};
    const found=(ds.found||[]).map(k=>`<span style="display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);margin:0 4px 4px 0">${k}${PNAMES[k]?' · '+esc(PNAMES[k]):''}</span>`).join('');
    return `<div class="rowx"><div class="cth"><span class="rt">${esc(e.name)}</span><span class="rv">${r.polling?NF(r.rate,1)+' requests/s':'Not reading'}</span></div>
      <div class="s12 sub" style="margin-top:3px">${r.polling?`A request every ${NF(r.interval,0)} ms${fin(r.answered)?' · '+NF(r.answered*100,0)+' % answered':''}`:'Turn on reading the engines to see the speed.'}${r.skip&&r.skip.length?' · skipped (no answer): '+r.skip.join(', '):''}</div>
      ${d.cov&&d.cov[e.ch]&&d.cov[e.ch].good+d.cov[e.ch].missing>0?`<div class="s12" style="margin-top:4px">Read since start: <b style="color:${covPct(d.cov[e.ch])<97?'var(--orange)':'var(--text)'}">${covText(d.cov[e.ch])}</b> of the running time${d.cov[e.ch].gaps?` · ${d.cov[e.ch].gaps} gap${d.cov[e.ch].gaps>1?'s':''}, longest ${dur2(d.cov[e.ch].longest)}`:' · no gaps'}</div>`:''}
      ${ds.active?`<div class="s12" style="margin-top:8px">Looking for more values · at ${256+ds.pos} of 256–319${(ds.found||[]).length?' · found so far:':''}</div><div class="s12" style="margin-top:6px">${found}</div>`
        :ds.done?`<div class="s12" style="margin-top:8px">${(ds.found||[]).length?'This engine answers:':'No values found.'}</div><div class="s12" style="margin-top:6px">${found}</div>`:''}
      ${r.polling&&!ds.active?`<button class="btn" style="width:100%;margin-top:10px" data-a="discover" data-v="${e.ch}">Discover more values</button>`:''}</div>`;}).join('');
  const ew=d.engineWait;
  return `<div class="hd">Reading speed</div><div class="sec">${rows}${d.engineTask?`<div class="rowx"><div class="cth"><span class="rt">Engine reading</span><span class="rv">Own task</span></div><div class="s12 sub" style="margin-top:3px">Runs on its own processor core. ${ew?`Longest wait for the rest of EngineLink: ${NF(ew.max,0)} ms${ew.slow?` · ${ew.slow} waits over 0.1 s`:''}.`:''}</div></div>`:''}<div class="rowx"><div class="s12 sub">EngineLink asks as fast as the engine answers and slows down when answers go missing. Values an engine never answers are skipped. "Discover more values" asks once for every value number from 256 to 319, with the same read request as always: nothing is changed in the engine.</div></div></div>`;
}
// Download speed: a test from memory (network only), and the last big
// download split into finding the trip, reading the SD card and sending.
// Why EngineLink restarted lately, in plain words, with advice for the
// restarts that point at a problem.
function restartsBlock(d){
  const rs=d.restarts||[];if(!rs.length&&!(S.appErrs||[]).length)return '';
  const bad=rs.filter(r=>[4,5,6,7,9,14,15].includes(r.r));
  const brown=rs.some(r=>r.r===9||r.r===14);
  const when=r=>r.utc?new Date(r.utc*1000).toLocaleString(LOC,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Time unknown';
  let h=`<div class="hd">Restarts</div><div class="sec">${rs.slice(0,8).map((r,i)=>`<div class="rowx" style="padding:10px 0"><div class="cth"><span class="rt" style="color:${[4,5,6,7,9,14,15].includes(r.r)?'var(--orange)':'var(--text)'}">${esc((w=>w[0].toUpperCase()+w.slice(1))(RESET[r.r]||'code '+r.r))}</span><span class="rv s13">${i?when(r):'This start'}</span></div><div class="s12 sub" style="margin-top:2px">${r.up?'Had been on for about '+dur(r.up)+' · ':''}version ${esc(r.v)}</div></div>`).join('')}
    ${bad.length?`<div class="rowx"><div class="s13" style="background:var(--osoft);color:var(--orange);border-radius:12px;padding:10px 12px">${brown?'The supply voltage dipped so low that EngineLink restarted. Check the 12 V wiring, the fuse and the connections; starting the engines can pull the battery voltage down.':'EngineLink restarted after a fault and saved what it could. If it happens again, send the technical file (Engine report and files).'}</div></div>`:''}
    ${d.sdRecoveries?`<div class="rowx s12 sub">The SD card stopped working ${d.sdRecoveries} time${d.sdRecoveries>1?'s':''} and was started again by itself.</div>`:''}
    ${(S.appErrs||[]).length?`<div class="rowx"><div class="rt">App errors this time</div>${S.appErrs.slice(-5).map(e=>`<div class="s12 sub" style="margin-top:4px">${esc(e.msg)}</div>`).join('')}</div>`:''}
    <div class="rowx s12 sub">"Power on" is normal: the power was switched off and on. Totals are saved every 30 seconds while an engine runs, so a power cut loses at most that.</div></div>`;
  return h;
}
function dlBlock(dl,spd){
  const sp=S.speed,secs=ms=>ms<1000?NF(ms,0)+' ms':ms<60000?NF(ms/1000,ms<10000?1:0)+' s':dur(Math.round(ms/1000));

function nextOf(list,v){const i=list.indexOf(v);return list[(i+1)%list.length];}
function goPage(p,back){S.backScroll=$('#main').scrollTop;S.back=back||null;S.page=p;S.d={};
  if(back)S.tab='more';
  if(p==='diag'){load('diag');load('fuel');load('state');}
  if(p==='events')load('events');
  if(p==='led')load('led');
  if(p==='fw')load('fw');
  if(p==='ap'||p==='router')load('state');
  history.pushState({page:1},'');
  render(true);$('#main').scrollTop=0;}
function goBack(){const b=S.back;S.page=null;S.back=null;if(b)S.tab=b;render(true);$('#main').scrollTop=S.backScroll||0;}
function goTab(t){
  if(S.tab===t&&!S.page){$('#main').scrollTop=0;return;}
  S.tab=t;S.page=null;S.back=null;S.selMode=null;S.sel=[];S.open=null;
  if(t==='economy'){load('econ');if(!S.trips)load('trips');}

  if(t==='engines')load('econ');
  if(t==='more'){load('state');load('sd');load('diag');}
  render(true);$('#main').scrollTop=0;
}

  tankDraft:v=>S.tankDraft=v,
  price:v=>{clearTimeout(I._p);I._p=setTimeout(()=>{const p=parseFloat(v.replace(',','.'));if(p>=0)post('/api/cfg',{price:p});},700);},
  ntpServer:v=>{clearTimeout(I._n);I._n=setTimeout(()=>{if(v.trim().length>=3)post('/api/cfg',{ntpServer:v.trim()});},900);},
  newPlace:v=>S.newPlace=v,newNm:v=>S.newNm=v,
  apName:v=>S.d.apName=v,hostName:v=>S.d.hostName=v,apPass:v=>S.d.apPass=v,wifiPass:v=>S.wifiPass=v,
  voltMeas:v=>{S.voltMeas=v;},
  planCustom:v=>{P.custom=v;savePrefs();},
  planSlide:v=>{P.planIdx=+v;savePrefs();render(true);},
  fLitres:v=>{S.d.fLitres=v;updTotal();},fPrice:v=>{S.d.fPrice=v;updTotal();},
  fWhenV:v=>{const t=new Date(v).getTime();if(t)S.d.fWhen=t;},
  nText:v=>{S.d.n.n=v;},
  wipe:v=>{S.d.wipe=v;const ok=v.trim().toUpperCase()==='WIPE',b=document.querySelector('[data-a="wipeDo"]');if(b){b.disabled=!ok;b.className='btn '+(ok?'red':'');}const i=document.querySelector('[data-i="wipe"]');if(i)i.style.borderColor=ok?'var(--red)':'transparent';}
};
function updTotal(){const d=S.d,l=parseFloat(String(d.fLitres).replace(',','.')),p=parseFloat(String(d.fPrice).replace(',','.'));const t=$('#fTotal');if(t)t.textContent=l>0&&p>0?money(l*p):'—';
  const can=l>0||d.fQ>0,b=document.querySelector('[data-a="fuelSave"]');if(b){b.disabled=!can;b.className='btn '+(can?'pri':'');}}
async function fwPoll(){for(let i=0;i<400;i++){await load('fw');const s=S.fw?S.fw.state:0;if(s===2||s===9||s===0||s===4)break;await new Promise(r=>setTimeout(r,1000));}}
async function diagPoll(){for(let i=0;i<40;i++){await load('diag');if(!S.diag||!S.diag.t.some(t=>t.running))break;await new Promise(r=>setTimeout(r,1000));}load('diag');}
function uploadFw(file){
  if(!file)return;
  if(/merged/i.test(file.name)){toast('That is the USB image. Use enginelink-update.bin');return;}
  const x=new XMLHttpRequest(),f=new FormData();f.append('update',file,file.name);
  x.upload.onprogress=e=>{if(e.lengthComputable){S.upload=Math.round(e.loaded/e.total*100);render(true);}};
  x.onload=()=>{S.upload=null;let m='Update finished';try{m=JSON.parse(x.responseText).message;}catch(e){}toast(m);render(true);};
  x.onerror=()=>{S.upload=null;toast('Upload interrupted');render(true);};
  x.open('POST',BASE+'/api/update');x.send(f);S.upload=0;render(true);
}

// ---------- Theme, night mode, screen ----------
// Sunset/sunrise for Danish waters (55.7 N, 12.6 E); good enough to switch to red.
function isNight(){
  const now=new Date(),day=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  const decl=23.44*Math.sin((2*Math.PI/365)*(day-81))*Math.PI/180,lat=55.7*Math.PI/180;
  const ha=Math.acos(clamp(-Math.tan(lat)*Math.tan(decl),-1,1))*180/Math.PI/15;
  const noonUtc=12-12.6/15,h=now.getUTCHours()+now.getUTCMinutes()/60;
  return h<noonUtc-ha-0.3||h>noonUtc+ha+0.3;
}
function applyTheme(){
  const night=P.night==='on'||(P.night==='sunset'&&isNight());
  document.documentElement.dataset.theme=night?'night':P.theme==='light'?'light':'dark';
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
setInterval(applyTheme,60000);
let lock=null;
async function wake(){
  if(!P.keepOn){if(lock){try{lock.release();}catch(e){}lock=null;}$('#nosleep').pause();return;}
  try{if('wakeLock' in navigator){lock=await navigator.wakeLock.request('screen');return;}}catch(e){}
  // Without a secure connection browsers refuse the wake lock; a silent,
  // invisible looping video keeps most phones awake instead.
  try{await $('#nosleep').play();}catch(e){}
}

// ---------- Report ----------
// The app opened as ?report=trips&ids=1,2 or ?report=engines shows a document
// instead: light, printable, to save as a PDF or send. It reads the same API.
const RQ=new URLSearchParams(location.search);
const kpi=(k,v,u)=>`<div><div class="k">${k}</div><div class="v">${v}${u?` <small>${u}</small>`:''}</div></div>`;
function rEvents(list){
  if(!list.length)return '<div class="r-sub">Nothing noticed.</div>';
  return list.map(e=>{const d=EVT[e.t];return `<div class="r-ev"><i style="background:${SEVC[e.sev]||SEVC[0]}"></i><div><b>${esc(evTitle(e))}</b><div class="r-sub">${evWhen(e)}${e.sev===2?' · alarm':e.sev===1?' · warning':''}</div>${d?`<div style="margin-top:3px">${esc(d[1](e))}</div>`:''}</div></div>`;}).join('');
}
// Joins the logs of a combined trip, with a break between the parts.
function rJoin(list){
  const ok=list.filter(Boolean);if(!ok.length)return null;
  const out={start:ok[0].start,t:[]},cols=['rpm','req','lph','cool','air','boost','volt'];cols.forEach(c=>out[c]=[[],[]]);
  ok.forEach((sr,i)=>{const off=sr.start&&ok[0].start?sr.start-ok[0].start:(out.t.length?out.t[out.t.length-1]+60:0);
    if(i){out.t.push(off-1);cols.forEach(c=>{out[c][0].push(null);out[c][1].push(null);});}
    sr.t.forEach((s,k)=>{out.t.push(off+s);cols.forEach(c=>{for(let e=0;e<2;e++)out[c][e].push(sr[c]&&sr[c][e]?sr[c][e][k]:null);});});});
  return out;
}
// Share of the running seconds with fresh engine data, from the board's count.
function covSum(list){
  const out=[0,1].map(()=>({good:0,missing:0,fuel:0,longest:0,gaps:0}));let any=false;
  for(const sr of list)if(sr&&sr.cov){any=true;sr.cov.forEach((c,i)=>{const o=out[i];o.good+=c.good;o.missing+=c.missing;o.fuel+=c.fuel;o.longest=Math.max(o.longest,c.longest);o.gaps+=c.gaps;});}
  return any?out:null;
}
const covPct=c=>c&&c.good+c.missing>0?c.good/(c.good+c.missing)*100:null;
function covText(c){const p=covPct(c);if(p==null)return '—';return NF(Math.floor(p*10)/10,p>=99.95?0:1)+' %';}
function covNote(cov,names){
  if(!cov)return '';
  return names.map(([n,i])=>{const c=cov[i];if(!c||c.good+c.missing===0)return '';const fp=c.good+c.missing?c.fuel/(c.good+c.missing)*100:0;
    return `${n}: ${covText(c)} of the running time read${c.gaps?`, ${c.gaps} gap${c.gaps>1?'s':''} over 3 s, the longest ${dur2(c.longest)}`:', no gaps'}${fp<98?`, fuel answers ${NF(fp,0)} %`:''}.`;}).filter(Boolean).join(' ');
}
const dur2=s=>s<90?NF(s,0)+' s':dur(s);
function rCharts(sr){
  if(!sr)return '<div class="r-sub">No second-by-second log for this trip. EngineLink records one on the SD card from version 0.7.0.</div>';
  return `<div class="r-charts">${[['rpm','Engine speed'],['lph','Fuel'],['cool','Coolant'],['boost','Boost']].map(([m,n])=>`<div class="r-chart"><div class="ct">${n}</div>${chartSvg(sr,m)}</div>`).join('')}</div>`;
}
function rAccuracy(){
  const c=S.fuel&&S.fuel.cal;
  if(!c||!c.n)return 'Fuel figures are not calibrated with fill-ups yet, so they can be off by 15 % or more.';
  return `Fuel figures within about ±${NF(Math.max(c.sig,0.005)*200,1)} %, calibrated from ${c.n} fill-up${c.n>1?'s':''}.`;
}
function rTools(){return `<div class="r-tools"><button class="rtool" data-a="rClose">Close</button><button class="rtool pri" data-a="rPrint">${svg(IC.doc,16,'currentColor',2)}Save as PDF or print</button></div>`;}
function rHead(title,sub){
  const now=new Date();
  return `<div class="r-brand">${svg(IC.engines,18,'var(--teal)',2)}EngineLink<span class="r-sub" style="margin-left:auto;font-weight:400">Made ${now.toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'})} ${hm(now.getTime()/1000)}</span></div><h1>${title}</h1><div class="r-sub">${sub}</div>`;
}
function rFoot(){
  const lv=S.live,es=engines();
  return `<div class="r-foot">${rAccuracy()}<br>EngineLink ${esc(lv?lv.v:'')}${es.length?' · engine hours '+es.map(e=>e.name+' '+(fin(e.hrs)?NF(e.hrs,1)+' h':'—')).join(', '):''}. EngineLink only reads the engines.</div>`;
}
async function reportTrips(ids){
  const us=units().filter(u=>u.ids.some(i=>ids.includes(i))).sort((a,b)=>(a.s||0)-(b.s||0));
  if(!us.length)return rHead('Trip report','These trips are no longer on EngineLink.');
  const evs=S.events?S.events.list:[],price=S.live?S.live.price:0,pi=S.live?S.live.port:0,port=pi===1?1:0,stbd=1-port;
  const pn=pi<0?'J7':'Port',sn=pi<0?'J6':'Starboard';
  const tot=us.reduce((a,u)=>a+u.fuel,0),run=us.reduce((a,u)=>a+u.run,0),max=Math.max(...us.flatMap(u=>u.parts.map(p=>p.max||0)));
  const first=us[0].s,last=us[us.length-1].s,dfmt=s=>new Date(s*1000).toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  document.title='EngineLink trip report '+new Date(first*1000).toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
  let h=rHead('Trip report',(dayKey(first)===dayKey(last)?dfmt(first):dfmt(first)+' – '+dfmt(last))+' · '+us.length+' trip'+(us.length>1?'s':''));
  if(us.length>1)h+=`<div class="r-kpis">${kpi('Running',dur(run))}${kpi('Fuel',L(tot,1),U.vu())}${kpi('Average',run>60?L(tot/(run/3600),1):'—',U.ru())}${kpi('Highest rpm',max?NF(max,0):'—')}${price>0?kpi('Cost',money(tot*price)):''}</div>`;
  const series=await Promise.all(us.map(u=>Promise.all(u.parts.map(p=>get('/api/trip/series?id='+p.id,15000).catch(()=>null)))));
  us.forEach((u,i)=>{
    const sr=rJoin(series[i]),mx=Math.max(...u.parts.map(p=>p.max||0)),nl=noteLine(u.note),cov=covSum(series[i]);
    const diff=u.l[port]>0.5?(u.l[stbd]/u.l[port]-1)*100:null;
    const mine=evs.filter(e=>e.utc&&e.utc>=u.s-30&&e.utc<=(u.e||u.s)+60).sort((a,b)=>a.utc-b.utc);
    h+=`<div class="r-sec"><h2>${new Date(u.s*1000).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'short'})} · ${hm(u.s)} – ${hm(u.e)}</h2><div class="r-sub">${dur(u.run)} running${u.combined?' · '+u.parts.length+' trips combined':''}${nl?' · '+esc(nl):''}</div>
      <div class="r-kpis">${kpi('Fuel',L(u.fuel,1),U.vu())}${kpi(pn,L(u.l[port],1),U.vu())}${kpi(sn,L(u.l[stbd],1),U.vu())}${kpi('Average',u.run>60?L(u.fuel/(u.run/3600),1):'—',U.ru())}${kpi('Highest rpm',mx?NF(mx,0):'—')}${price>0?kpi('Cost',money(u.fuel*price)):''}</div>
      ${cov?`<div class="r-kpis">${[[pn,port],[sn,stbd]].map(([n,c])=>{const pc=covPct(cov[c]);return kpi(n+' data read',`<span style="color:${pc!=null&&pc<97?'var(--orange)':'inherit'}">${covText(cov[c])}</span>`);}).join('')}</div><div class="r-sub" style="margin-top:6px">${covNote(cov,[[pn,port],[sn,stbd]])}</div>`:''}
      ${diff!=null&&Math.abs(diff)>=8?`<div class="r-sub" style="margin-top:8px;color:var(--orange)">${sn} used ${NF(Math.abs(diff),0)} % ${diff>0?'more':'less'} fuel than ${pn.toLowerCase()} on this trip.</div>`:''}
      <h3>Curves</h3>${rCharts(sr)}
      <h3>What EngineLink noticed</h3>${rEvents(mine)}</div>`;
  });
  return h;
}
function reportEngines(){
  const es=engines(),ev=S.events?S.events.list.slice().sort((a,b)=>(b.utc||0)-(a.utc||0)):[];
  document.title='EngineLink engine report '+new Date().toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
  let h=rHead('Engine report',es.map(e=>e.name).join(' and ')+' · what EngineLink has learned about the engines');
  h+=`<div class="r-kpis">${es.map(e=>kpi(e.name+' hours',fin(e.hrs)?NF(e.hrs,1):'—','h')).join('')}${kpi('Events',ev.length)}${kpi('Not seen yet',S.events?S.events.n:'—')}</div>`;
  h+=`<div class="r-sec"><h2>Events</h2><div class="r-sub">What EngineLink noticed, newest first, with what it usually means.</div><div style="margin-top:6px">${rEvents(ev.slice(0,40))}</div></div>`;
  const bal=balanceCard(es),life=lifeCard(es);
  if(bal)h+=`<div class="r-sec">${bal}</div>`;
  if(life)h+=`<div class="r-sec">${life}</div>`;
  if(S.diag&&S.diag.reading)h+=`<div class="r-sec">${readingBlock(S.diag,es)}</div>`;
  h+=`<div class="r-sec r-noprint"><h2>For help</h2><div class="r-sub">A technical file with the settings and recent data, if someone helps you with EngineLink.</div><button class="rtool" style="margin-top:10px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--track);font-weight:600" data-a="report">${svg(IC.down,16)}Download technical file (JSON)</button></div>`;
  return h;
}
async function renderReport(kind){
  const de=document.documentElement;de.classList.add('rpt');de.dataset.theme='light';
  const r=document.createElement('div');r.id='report';r.innerHTML='<div class="empty" style="padding-top:40px">Making the report…</div>';document.body.appendChild(r);
  await loadPrefs();de.dataset.theme='light';
  const g=(u,ms)=>get(u,ms).catch(()=>null);
  [S.live,S.trips,S.fuel,S.events]=await Promise.all([g('/api/live',5000),g('/api/trips',6000),g('/api/fuel',6000),g('/api/events',6000)]);
  if(kind==='engines')[S.life,S.diag,S.state]=await Promise.all([g('/api/life',6000),g('/api/diag',6000),g('/api/state',6000)]);
  if(!S.live){r.innerHTML=rTools()+rHead('Report','EngineLink could not be reached. Connect to its Wi-Fi and try again.');return;}
  const body=kind==='engines'?reportEngines():await reportTrips((RQ.get('ids')||'').split(',').map(Number).filter(Boolean));
  r.innerHTML=rTools()+body+rFoot();
}

// ---------- Start ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(P.keepOn&&$('#nosleep').paused)wake();
  if(!b||b.disabled)return;
  const f=A[b.dataset.a];
  if(f){e.preventDefault();f(b.dataset.v,b,e);}
});
document.addEventListener('input',e=>{const i=e.target.closest('[data-i]');if(i&&I[i.dataset.i])I[i.dataset.i](i.value,i);});
$('#sheetwrap').addEventListener('click',e=>{if(e.target.id==='sheetwrap')history.back();});
addEventListener('popstate',()=>{if(S.sheet){closeSheet();return;}if(S.page)goBack();});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._bip=e;});
async function loadPrefs(){
  try{const p=await get('/api/prefs',4000);if(p&&typeof p==='object'){for(const k of Object.keys(P))if(p[k]!==undefined)P[k]=typeof P[k]==='object'&&!Array.isArray(P[k])?Object.assign({},P[k],p[k]):p[k];}prefsLoaded=true;}catch(e){}
}
// App errors: kept for Diagnostics and the technical file; network hiccups
// are expected on a boat and only counted there, real errors get a toast.
function appError(msg){
  msg=String(msg||'Unknown error').slice(0,200);
  (S.appErrs=S.appErrs||[]).push({t:Date.now(),msg});if(S.appErrs.length>20)S.appErrs.shift();
  if(/abort|failed to fetch|load failed|network/i.test(msg))return;
  const now=Date.now();if(now-(S.lastErrToast||0)>15000){S.lastErrToast=now;toast('Something went wrong in the app. Pull down or reopen it if a screen looks wrong.');}
}
addEventListener('error',e=>appError(e.message||(e.error&&e.error.message)));
addEventListener('unhandledrejection',e=>appError(e.reason&&(e.reason.message||e.reason)));
(async function init(){
  if(RQ.get('report')){renderReport(RQ.get('report'));return;}
  renderNav();render(true);
  await loadPrefs();
  // 0.6: "Load" (KAD 288) is not confirmed; it read 80-90 % at idle. Off unless chosen again.
  if(prefsLoaded&&(P.pv||0)<6){P.vals.load=0;P.pv=6;savePrefs();}
  applyTheme();
  const first=P.start||'trip';S.tab='';
  goTab(first);
  load('state');load('trips');load('fuel');
  tick();
})();
</script>
