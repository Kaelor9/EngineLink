.tog.on{background:var(--teal)}.tog.on::after{left:23px}

.stale .live{opacity:.5}

.grab{width:40px;height:5px;border-radius:5px;background:var(--track);align-self:center}
.q{width:18px;height:18px;border-radius:50%;background:var(--track);color:var(--sub);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.q.on{background:var(--teal);color:var(--onteal)}
.help{background:var(--track);border-radius:14px;padding:4px 14px}
.help>div{padding:8px 0;border-bottom:1px solid var(--line)}
.help>p{margin:0;font-size:11.5px;color:var(--sub);padding:8px 0}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
.empty{color:var(--sub);font-size:14px;padding:14px 0;text-align:center}
.list>*+*{border-top:1px solid var(--line)}
.tbl{display:grid;grid-template-columns:60px 46px 46px 1fr;gap:6px;align-items:center;padding:8px 20px}
a.dl{display:none}
.exopt{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:20px;background:var(--teal);color:var(--onteal)}
.exopt b{display:block;font-size:17px}.exopt span span{display:block;font-size:13px;opacity:.85;margin-top:2px;line-height:1.3}
.exopt .exic{width:44px;height:44px;flex:none;border-radius:14px;background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center}

html.rpt #app,html.rpt #banner,html.rpt #toast,html.rpt #sheetwrap{display:none}
#report{max-width:820px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 48px max(18px,env(safe-area-inset-left));color:var(--text);font-size:14px;line-height:1.4}
#report button:not(.rtool){display:none}
.r-tools{position:sticky;top:0;z-index:5;display:flex;gap:8px;justify-content:flex-end;padding:10px 0;background:var(--bg)}
.r-tools .rtool{min-height:40px;padding:0 16px;border-radius:99px;background:var(--track);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.r-tools .rtool.pri{background:var(--teal);color:var(--onteal)}
.r-brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--teal);font-size:14px;margin-top:6px}
#report h1{font-size:30px;line-height:1.1;margin:10px 0 4px;letter-spacing:-.3px}
#report h2{font-size:19px;margin:0 0 2px}
#report h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin:18px 0 8px}
.r-sub{color:var(--sub);font-size:13.5px}
.r-sec{border-top:1px solid var(--line);padding:22px 0 6px;margin-top:22px}
.r-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:14px}
.r-kpis>div{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.r-kpis .k{font-size:12px;color:var(--sub)}.r-kpis .v{font-size:20px;font-weight:700;margin-top:2px}.r-kpis .v small{font-size:12px;font-weight:500;color:var(--sub)}
.r-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.r-chart{border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;break-inside:avoid}
.r-chart .ct{font-size:13px;font-weight:600;margin-bottom:4px}
.r-ev{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);break-inside:avoid}.r-ev:first-child{border-top:0}
.r-ev i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.r-foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--sub);font-size:12px}
html.rpt .card,html.rpt .sec{background:none;box-shadow:none;border:1px solid var(--line);border-radius:14px;break-inside:avoid}
html.rpt .card{padding:14px 16px;margin-top:12px}
@media print{
  .r-tools,.r-noprint{display:none!important}
  #report{max-width:none;padding:0;font-size:12px}
  @page{margin:14mm}
  html.rpt,html.rpt body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .r-sec{break-inside:auto}
}
#bar{display:none;flex:none;padding:10px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--sheet)}
</style>

// ---------- Network ----------
// EngineLink answers on its own network (192.168.4.1) and, when it is on the
// boat router, at its router address too. If the phone moves to the router's
// Wi-Fi, the app looks for EngineLink there and carries on by itself.
let BASE='';
function rememberIp(ip){if(!ip)return;try{localStorage.setItem('el.ip',ip);}catch(e){}}
function hostCandidates(){
  // Probe the currently loaded origin first: enginelink.local can resolve to
  // the NEW IP after the phone changes from standalone AP to boat router.
  // Then try the advertised .local name, last known router IP and the AP IP.
  const h=[''],add=x=>{if(x&&x!==location.origin&&!h.includes(x))h.push(x);};
  let host='enginelink';try{host=localStorage.getItem('el.host')||host;}catch(e){}
  add('http://'+host+'.local');if(host!=='enginelink')add('http://enginelink.local');
  try{const ip=localStorage.getItem('el.ip');if(ip)add('http://'+ip);}catch(e){}
  add('http://192.168.4.1');
  return h;
}
// Opened as http://enginelink.local, every request needs a multicast name
// lookup (mDNS). Through many routers and on Windows that takes seconds or
// fails ("DNS_PROBE_FINISHED_NO_INTERNET"), which made router mode look slow
// and unstable while the board itself was fine. As soon as EngineLink tells
// its router address, the app talks to that address directly instead.
let ipTried='',ipTriedAt=0;
async function preferIp(ip){
  if(!ip||!/\.local$/i.test(location.hostname))return;
  const want='http://'+ip;
  if(BASE===want||(ipTried===ip&&Date.now()-ipTriedAt<30000))return;
  ipTried=ip;ipTriedAt=Date.now();
  const c=new AbortController(),id=setTimeout(()=>c.abort(),2500);
  try{const r=await fetch(want+'/api/live',{cache:'no-store',signal:c.signal});if(r.ok){const d=await r.json();if(d&&d.net){BASE=want;liveSidecarWorked=false;liveSidecarRetryAt=0;}}}
  catch(e){}finally{clearTimeout(id);}
}
let discoveryPending=null;
async function findHost(){
  // Serial probes took 6+ seconds on a disconnected network (4 x 1500ms).
  // Race them in parallel; the first real EngineLink JSON wins. Keep the
  // whole recovery bounded by a single 1800ms round.
  if(discoveryPending)return discoveryPending;
  discoveryPending=new Promise(resolve=>{
    const hosts=hostCandidates(),controllers=[],timers=[];
    let remaining=hosts.length,done=false;
    const finish=(value,host)=>{
      if(done)return;done=true;
      if(host!==undefined)BASE=host;
      for(const ctrl of controllers)ctrl.abort();
      for(const id of timers)clearTimeout(id);
      resolve(value);
    };
    for(const host of hosts){
      const ctrl=new AbortController();controllers.push(ctrl);
      const id=setTimeout(()=>ctrl.abort(),1800);timers.push(id);
      (async()=>{
        try{
          const r=await fetch(host+'/api/live',{cache:'no-store',signal:ctrl.signal});
          if(!r.ok)return;
          const data=await r.json();
          if(data&&Array.isArray(data.e)&&data.net)finish(data,host);
        }catch(e){}finally{
          clearTimeout(id);
          if(--remaining===0)finish(null);
        }
      })();
    }
  });
  try{return await discoveryPending;}finally{discoveryPending=null;}
}
// Live samples use a separate read-only HTTP listener (port 81) so a long
// file download on port 80 cannot starve the dashboard. Fall back to port 80
// for older firmware, browser demo and transient sidecar failures.
let liveSidecarRetryAt=0,liveSidecarWorked=false;
async function get(u,t=3000){
  if(u==='/api/live'&&Date.now()>=liveSidecarRetryAt){
    try{
      const url=new URL(BASE||location.origin,location.href);
      if(url.protocol==='http:'){
        url.port='81';
        const c=new AbortController(),id=setTimeout(()=>c.abort(),Math.min(liveSidecarWorked?800:350,t));
        try{
          const r=await fetch(url.origin+u,{cache:'no-store',signal:c.signal});
          if(r.ok){liveSidecarWorked=true;return await r.json();}
        }finally{clearTimeout(id);}
      }
    }catch(e){}
    liveSidecarWorked=false;
    liveSidecarRetryAt=Date.now()+60000;
  }
  const c=new AbortController(),id=setTimeout(()=>c.abort(),t);
  try{const r=await fetch(BASE+u,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(id);}
}
async function post(u,data={},t=10000){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),t);
  try{
    const r=await fetch(BASE+u,{method:'POST',body:new URLSearchParams(data),signal:c.signal,cache:'no-store'});
    let j={ok:r.ok,message:''};try{j=await r.json();}catch(e){}
    return j;
  }catch(e){return {ok:false,message:'No answer from EngineLink. Check the Wi-Fi connection.'};}
  finally{clearTimeout(id);}
}

// Live data about twice a second. When EngineLink does not answer, the last
// values stay on screen (dimmed) and the app keeps trying, faster as soon as
// the phone is back, so a short Wi-Fi drop needs no reload.
let tickTimer=0,ticking=false;
function schedule(ms){clearTimeout(tickTimer);tickTimer=setTimeout(tick,ms);}
async function tick(){
  if(ticking)return;
  if(document.hidden){schedule(3000);return;}
  ticking=true;
  const t0=performance.now();
  try{
    const d=await get('/api/live',2500);
    // Average answer time: on a weak link EngineLink is asked less often, so
    // the requests that do go out are not queued behind each other.
    const rt=performance.now()-t0;S.rtt=S.rtt?S.rtt*0.8+rt*0.2:rt;
    S.live=d;S.liveAt=Date.now();S.fails=0;setConn(true);onLive();
  }catch(e){
    S.fails++;S.failTotal=(S.failTotal||0)+1;
    if(S.fails>=2)setConn(false);
    // Still nothing: the phone may have moved to another network.
    if(S.fails>=2&&S.fails%2===0){const d=await findHost();if(d){S.live=d;S.liveAt=Date.now();S.fails=0;setConn(true);onLive();}}
  }finally{ticking=false;}
  schedule(S.fails?Math.min(400*S.fails,2000):Math.round(Math.min(2000,Math.max(500,(S.rtt||0)*1.5))));
}
function tickNow(){S.fails=Math.min(S.fails,1);schedule(30);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickNow();wake();}});
addEventListener('online',tickNow);addEventListener('pageshow',tickNow);addEventListener('focus',tickNow);
function setConn(ok){
  if(ok===S.conn&&ok)return;

}

// ---------- Engines ----------
// Engines in the order Port, Starboard (by the socket choice in Settings).
function engines(){
  const lv=S.live;if(!lv)return [];
  const pi=lv.port;
  const order=pi===1?[1,0]:[0,1];
  return order.map((c,i)=>Object.assign({ch:c,name:pi<0?(c===0?'J7':'J6'):(i===0?'Port':'Starboard'),color:pi<0?(i===0?'var(--blue)':'var(--teal)'):(i===0?'var(--port)':'var(--stbd)'),sock:c===0?'J7':'J6'},lv.e[c]));
}
const ev=(e,idx)=>e&&e.x&&fin(e.x[idx])?e.x[idx]:null;
const totalLph=()=>{const es=engines();let t=0,n=0;for(const e of es){if(fin(e.lph)){t+=e.lph;n++;}}return n?t:null;};
// Gear from the bits learned at the dock (Diagnostics > Learn the gear).
// Until then the raw value is not trusted: its meaning is not confirmed.
const gearName=v=>{
  if(!fin(v))return '—';
  const c=cfgv(),g=c&&c.gear;
  if(!g||!(g[0]||g[2]))return 'Not learned';
  if(g[0]&&g[0]===g[2]&&g[1]===g[3])return (v&g[0])===g[1]?'In gear':'Neutral';
  if(g[0]&&(v&g[0])===g[1])return 'Forward';
  if(g[2]&&(v&g[2])===g[3])return 'Reverse';
  return 'Neutral';
};

// ---------- Live updates ----------
function onLive(){
  const lv=S.live;
  if(lv.net&&lv.net.ip){rememberIp(lv.net.ip);preferIp(lv.net.ip);}
  if(lv.net&&lv.net.host&&lv.net.host!==S.hostSeen){S.hostSeen=lv.net.host;try{localStorage.setItem('el.host',lv.net.host);}catch(e){}}
  // The phone's clock sets EngineLink's clock when nothing better is there.
  if((!lv.utc||Math.abs(lv.utc*1000-Date.now())>90000)&&Date.now()-S.timeSentAt>300000){S.timeSentAt=Date.now();post('/api/phone-time',{ms:String(Date.now())});}
  const t=totalLph();
  if(Date.now()-S.lastHist>=10000){S.lastHist=Date.now();S.hist.push(lv.trip.act&&fin(t)?t:null);if(S.hist.length>90)S.hist.shift();}
  warmStep();
  if(S.prevAct===true&&!lv.trip.act){load('trips');load('econ');}
  S.prevAct=lv.trip.act;
  if(S.prevFw!==lv.fw&&S.page==='fw')load('fw');
  S.prevFw=lv.fw;
  // A new event: tell the phone, refresh the list.
  const le=lv.ev&&lv.ev.last;
  if(le&&S.lastEvId!==undefined&&le.id!==S.lastEvId&&le.sev>=1){try{navigator.vibrate&&navigator.vibrate(le.sev>1?[300,120,300,120,300]:[200,100,200]);}catch(e){}toast(evTitle(le));}
  if(le&&le.id!==S.lastEvId&&(S.page==='events'||S.events))load('events');
  S.lastEvId=le?le.id:0;
  if(S.tab==='engines'&&!S.page&&(!S.recentAt||Date.now()-S.recentAt>10000))load('recent');
  if(S.tab==='engines'&&!S.page&&Date.now()-S.shiftsAt>8000)load('shifts');
  if(S.page==='led'&&(!S.ledAt||Date.now()-S.ledAt>1000)){S.ledAt=Date.now();load('led');}
  if(S.page==='n2k'&&(!S.nmeaAt||Date.now()-S.nmeaAt>2000)){S.nmeaAt=Date.now();load('nmea');}
  if(S.page==='dtest')dtPaint();
  if(!S.page&&(S.tab==='trip'||S.tab==='engines'||S.tab==='tank'))render();
}

// ---------- Warm-up guide ----------
// Shown after a cold start; closes after the chosen time on screen, or with ✕.
function warmStep(){
  const W=S.warm,es=engines().filter(e=>e.run);
  if(!P.warmOn){W.phase='idle';return;}
  if(!es.length){if(W.phase==='done'||W.phase==='warming')W.phase='idle';return;}
  const temps=es.map(e=>ev(e,259)).filter(fin);
  if(!temps.length)return;
  const min=Math.min(...temps);
  if(W.phase==='idle'){W.phase=min<P.warmTarget-2?'warming':'done';W.samples=[];}
  if(W.phase==='warming'){
    W.samples.push([Date.now(),min]);
    W.samples=W.samples.filter(s=>Date.now()-s[0]<180000);
    if(min>=P.warmTarget){W.phase='ready';W.seen=0;}
  }
  if(W.phase==='ready'&&S.tab==='trip'&&!S.page&&!document.hidden){
    W.seen+=0.5;
    if(P.warmClose>0&&W.seen>=P.warmClose)W.phase='done';
  }
}
function warmBox(){
  const W=S.warm;
  if(!P.warmOn||(W.phase!=='warming'&&W.phase!=='ready'))return '';
  const es=engines().filter(e=>e.run),ready=W.phase==='ready';
  const fg=ready?'var(--green)':'var(--orange)',bg=ready?'var(--gsoft)':'var(--osoft)';
  let big='',small='';

  return `<div class="card glow" style="background:${bg};box-shadow:0 0 0 1px ${ready?'rgba(125,220,176,.55)':'rgba(240,192,110,.55)'},0 0 28px ${ready?'rgba(125,220,176,.3)':'rgba(240,192,110,.32)'};display:flex;flex-direction:column;gap:14px" ${ready&&P.warmClose>0?'data-a="warmClose"':''}>

      <div class="tile"><div class="k">Cost</div><div class="v">${price>0?NF(used*price,0):'—'}</div><div class="s12 sub">${price>0?cur()+' · '+NF(imp()?price/0.264172:price,2)+'/'+U.vu():'set a price'}</div></div></div>`;

function lastTripLine(){

function burnCard(avg){

    const y=v=>(74-(v-lo)/(hi-lo||1)*68).toFixed(1);

    chart=`<svg viewBox="0 0 320 80" width="100%" height="80" style="display:block;margin-top:10px" role="img" aria-label="Fuel flow over the last 15 minutes"><polygon points="${line} ${xy[xy.length-1][0]},80 ${xy[0][0]},80" fill="var(--osoft)"/><polyline points="${line}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${fin(avg)?`<line x1="0" x2="320" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="5 4"/>`:''}</svg>

  return `<div class="card"><div class="cth"><span class="lbl" style="color:var(--orange)">${svg(IC.flame,16,'var(--orange)',2)}Burning now</span><span class="s13 sub">both engines</span></div>

}

// ---------- Economy ----------
const ZONES=[['Idle & manoeuvring','under 1.000 rpm','var(--sub)'],['Low speed','1.000 – 2.000 rpm','var(--blue)'],['Getting on the plane','2.000 – 2.500 rpm','var(--orange)'],['Cruise','2.500 – 3.000 rpm','var(--green)'],['Fast','over 3.000 rpm','var(--purple)']];

}
function vEconomy(){

        ${now10!=null?`<div><div class="cth s13"><span style="font-weight:600">Right now · ${NF(sog,1)} kn</span><span><b>${L(now10,1)} ${U.vu()}</b> <span class="sub">${price>0?'· '+money(now10*price):''} per 10 nm</span></span></div><div class="bar" style="margin-top:6px"><i style="width:${clamp(now10/(Math.max(now10,best.l10)*1.15)*100,5,100)}%;background:${over<=0.05?'var(--green)':over<=0.2?'var(--orange)':'var(--red)'}"></i></div></div>`:''}
      </div>
      ${over!=null?`<div style="margin-top:16px;border-radius:16px;padding:13px 14px;background:${over<=0.05?'var(--gsoft)':'var(--osoft)'};color:${over<=0.05?'var(--gtext)':'var(--orange)'};font-size:14px;font-weight:600">${over<=0.05?'You are at your most economical speed.':'Ease off to about '+NF(best.rpm,0)+' rpm: '+L(now10-best.l10,1)+' '+U.vu()+' less every 10 nm.'}</div>`:''}</div>`;
  }else{

  }

  // Speed table
  if(rows.length){
    h+=`<div class="card" style="padding:16px 0 6px"><div class="cth" style="padding:0 20px 8px"><span class="ct">Speed table</span><span class="s12 sub">from your own trips</span></div>
      <div class="tbl s12 sub" style="font-weight:550"><span>rpm</span><span style="text-align:right">kn</span><span style="text-align:right">${U.ru()}</span><span style="text-align:right">per 10 nm</span></div>
      ${rows.map(r=>{const isB=best&&r.rpm===best.rpm;return `<div class="tbl" style="border-top:1px solid var(--line);${isB?'background:var(--gsoft)':''}"><span style="font-size:15px;font-weight:600;${isB?'color:var(--gtext)':''}">${NF(r.rpm,0)}</span><span class="s14" style="text-align:right">${r.kn!=null?NF(r.kn,1):'—'}</span><span class="s14" style="text-align:right">${L(r.lph,0)}</span><span class="s14" style="text-align:right;font-weight:600">${r.l10!=null?L(r.l10,1)+' '+U.vu()+(price>0?'<br><span class="s12 sub" style="font-weight:400">'+money(r.l10*price)+'</span>':''):'—'}</span></div>`;}).join('')}
      <div class="s12 sub" style="padding:10px 20px">Each row needs 2 minutes at that rpm. Values in the middle of a 250 rpm step.</div></div>`;

function planCard(rows,best,price){

  const p=leg(withKn[pi]),b=leg(withKn[bi>=0?bi:0]);
  const tk=S.live&&S.live.tank,ab=tk&&fin(tk.aboard)?tk.aboard:null,resL=tk?tk.cap*tk.reserve/100:0,after=ab!=null?ab-p.l:null;
  const modes=[['Economical',bi],['Usual',withKn.indexOf(usual)],['Fast',withKn.indexOf(fast)]].filter(m=>m[1]>=0);
  h+=`<div><div class="cth s13" style="margin-bottom:8px"><span class="sub">Where to?</span><button data-a="page" data-v="dest" data-b="economy" style="color:var(--teal)">Edit places</button></div>

const VALS=[['load',288,'Relative load','Not confirmed for KAD300 yet: reads 80-90 % at idle'],['req',291,'Requested rpm','What the throttle asks for'],['cool',259,'Coolant','Engine temperature'],['boost',265,'Boost','Turbo pressure'],['air',261,'Charge air','Air temperature after the intercooler'],['ftemp',260,'Fuel temp.','Diesel temperature at the pump'],['batt',293,'Battery','System voltage at the engine'],['gear',264,'Gear','Neutral, forward or reverse, once learned in Diagnostics'],['hours',266,'Hours','Engine hours from the engine itself'],['rate',289,'Fuel rate','Also shown on Trip'],['inlet',258,'Inlet pressure','Absolute air pressure in the intake'],['rack',295,'Fuel rack','How far the injection pump is open. Not confirmed yet'],['inj',296,'Injection angle','Injection timing'],['start',263,'Start input','Key and start button from the panel'],['ms',267,'Control unit','Active Volvo MS unit']];
function valText(key,v){
  if(!fin(v))return ['—',''];
  switch(key){
    case 'cool':case 'air':case 'ftemp':return [NF(U.temp(v),0),U.tu()];
    case 'boost':return [NF(U.press(v),imp()?1:2),U.pu()];
    case 'batt':return [NF(v,1),'V'];
    case 'gear':return [gearName(v),''];
    case 'hours':return [NF(v,1),'h'];
    case 'rate':return [L(v,1),U.ru()];
    case 'req':return [NF(v,0),'rpm'];

  }
}

const HEALTH={

function healthCard(es){
  const e=S.econ;
  const rows=[];let look=0;
  const name=i=>es[i]?es[i].name:'';
  const devs=es.map(x=>e&&e.h?e.h.dev[x.ch]:null);
  const learning=devs.every(d=>!d||d.trips<3);
  const add=(id,status,now,text)=>{if(status==='look')look++;rows.push({id,status,now,text});};
  if(learning){
    const n=devs.reduce((m,d)=>Math.max(m,d?d.trips:0),0);
    add('cool','learn','Learning what is normal for each engine ('+n+' of 3 trips).','');
  }else{
    const msg=(i,m,th,fmt)=>{const d=devs[i];if(!d||d.trips<3||!fin(d.d[m]))return null;return Math.abs(d.d[m])>th?name(i)+' '+fmt(d.d[m]):null;};
    const pct=v=>(v>0?'+':'')+NF(v*100,0)+' % vs normal';
    const cool=[0,1].map(i=>msg(i,0,4,v=>(v>0?'+':'')+NF(v,1)+' °C vs normal')).filter(Boolean);
    add('cool',cool.length?'look':'ok',cool.length?cool.join(' · '):'Normal at cruise',cool.length?'Higher than this engine normally runs at the same rpm.':'');
    const boost=[0,1].map(i=>msg(i,1,0.06,pct)).filter(Boolean);
    add('boost',boost.length?'look':'ok',boost.length?boost.join(' · '):'Normal',boost.length?'Different from what this engine normally gives at the same rpm.':'');
    const air=[0,1].map(i=>msg(i,2,0.1,pct)).filter(Boolean);
    add('air',air.length?'look':'ok',air.length?air.join(' · '):'Normal','');
    const fuel=[0,1].map(i=>msg(i,3,0.06,pct)).filter(Boolean);
    add('fuel',fuel.length?'look':'ok',fuel.length?fuel.join(' · '):'Normal','');
  }
  const ft=es.map(x=>ev(x,260)).filter(fin);
  if(ft.length)add('ftemp',Math.max(...ft)>45?'look':'ok',es.map(x=>fin(ev(x,260))?x.name+' '+NF(U.temp(ev(x,260)),0)+' '+U.tu():'').filter(Boolean).join(' · '),Math.max(...ft)>45?'Over 45 °C.':'');
  const bv=es.filter(x=>x.run).map(x=>ev(x,293)).filter(fin);
  if(bv.length)add('batt',Math.min(...bv)<13.5?'look':'ok',es.filter(x=>x.run&&fin(ev(x,293))).map(x=>x.name+' '+NF(ev(x,293),1)+' V').join(' · '),Math.min(...bv)<13.5?'Low while running.':'');
  return `<div class="card" style="padding:6px 20px 8px"><div class="cth" style="padding:14px 0 2px"><span class="ct">Health check</span><span class="s13" style="font-weight:600;color:${look?'var(--orange)':'var(--green)'}">${learning?'Learning':look?look+' thing'+(look>1?'s':'')+' worth a look':'All normal'}</span></div>
    <div class="s12 sub" style="padding-bottom:6px">Each engine is compared with its own normal at the same rpm. Tap a line to read more.</div>
    ${rows.map(r=>{const open=S.healthOpen===r.id,[t,why,todo]=HEALTH[r.id],c=r.status==='look'?'var(--orange)':r.status==='learn'?'var(--sub)':'var(--green)';
      return `<button data-a="healthOpen" data-v="${r.id}" style="width:100%;text-align:left;display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)"><span class="dot" style="width:8px;height:8px;background:${c};margin-top:7px"></span><span style="flex:1;display:block"><span class="cth"><span style="font-size:14.5px">${r.status==='learn'?'Normal values':t}</span><span class="s13" style="color:${r.status==='look'?'var(--orange)':'var(--sub)'};white-space:nowrap">${r.status==='look'?'Worth a look':r.status==='learn'?'':'Normal'} ${r.status==='learn'?'':open?'⌃':'⌄'}</span></span><span class="s12 sub" style="display:block;margin-top:3px">${esc(r.now)}</span>${r.text?`<span class="s13" style="display:block;margin-top:6px">${r.text}</span>`:''}
        ${open&&r.status!=='learn'?`<span style="display:block;background:var(--track);border-radius:12px;padding:10px 12px;margin-top:8px"><span class="s12 sub" style="display:block;font-weight:600">What it tells you</span><span class="s13" style="display:block;margin-top:2px">${why}</span><span class="s12 sub" style="display:block;font-weight:600;margin-top:8px">${r.status==='look'?'What to do':'If it changes'}</span><span class="s13" style="display:block;margin-top:2px">${todo}</span></span>`:''}</span></button>`;}).join('')}</div>`;
}
const SERVICE=[['oil','Oil and oil filter','Every 100 h or yearly',100],['air','Air filter','Every 400 h',400],['imp','Impeller','Yearly',0],['ff','Fuel filters','Every 200 h',200],

}
// The two engines side by side: idle, compressor, warm-up and charging.
function twinCard(es){
  const sh=S.shifts;if(!sh||!sh.e||es.length<2)return '';
  const row=(label,f,hint)=>`<span class="sub">${label}</span>${es.map(e=>`<span>${f(sh.e[e.ch],e)}</span>`).join('')}`;
  const idle=es.map(e=>sh.e[e.ch].idleLph),idleDiff=fin(idle[0])&&fin(idle[1])&&Math.min(...idle)>0?(Math.max(...idle)/Math.min(...idle)-1):null;

    <span></span>${es.map(e=>`<span style="color:${e.color};font-weight:600">${e.name}</span>`).join('')}

    ${row('Idle rpm',x=>fin(x.idleRpm)?NF(x.idleRpm,0):'—')}
    ${row('Compressor came on',x=>x.accels?NF(x.compOn,0)+' of '+NF(x.accels,0):sh.cl?'No accelerations yet':'Not learned')}
    ${row('Boost on accelerating',x=>fin(x.boostPeak)?NF(U.press(x.boostPeak),imp()?1:2)+' '+U.pu():'—')}
    ${row('Warm-up to '+NF(U.temp(60),0)+' '+U.tu(),x=>fin(x.warmLast)?dur(x.warmLast)+(fin(x.warmAvg)&&x.warmN>2?' <span class="sub">(usually '+dur(x.warmAvg)+')</span>':''):'—')}
    ${row('Charge air now',(x,e)=>fin(ev(e,261))?TT(ev(e,261)):'—')}

function dtSamples(rec,ch,skipMs){

async function dtRecord(){
  const d=dtState();if(d.busy)return;

  for(const e of engines())if(!e.poll)await post('/api/diag/test',{ch:e.ch});

  let since=null;const data={ms0:null,t:[],rpm:[[],[]],lph:[[],[]],st:[[],[]],boost:[[],[]],req:[[],[]]};
  const until=Date.now()+st.s*1000;
  while(Date.now()<until&&S.dt===d&&d.phase==='run'){
    await new Promise(r=>setTimeout(r,1000));
    try{
      const f=await get('/api/fast?'+(since==null?'secs=5':'since='+since),3000);
      if(f&&f.t&&f.t.length){
        if(since==null){data.ms0=f.ms0;}
        f.t.forEach((t,i)=>{const ms=f.ms0+t;if(since==null&&f.now-ms>1500)return;data.t.push(ms-data.ms0);for(const c of [0,1]){data.rpm[c].push(f.rpm[c][i]);data.lph[c].push(f.lph[c][i]);data.st[c].push(f.st[c][i]);data.boost[c].push(f.boost[c][i]);data.req[c].push(f.req[c][i]);}});
        since=f.ms0+f.t[f.t.length-1];

    }catch(e){}

    const g=dtGuard(st,engines(),d.place,d);if(g&&!d.abortStep){d.abortStep=true;d.warnMsg=g;}

  if(d.abortStep){d.abortStep=false;d.busy=false;render(true);return;}
  d.rec.push({k:st.k,ch:st.ch,data});

    return [lo,hi].map(v=>`<text x="${P[0]-4}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--sub)">${NF(v,dec)}</text>`).join('')+
      `<line x1="${P[0]}" x2="${W-P[1]}" y1="${y0+h}" y2="${y0+h}" stroke="var(--line)"/>`+[0,1].map(c=>`<path d="${line(c)}" fill="none" stroke="${engCol(c)}" stroke-width="1.7" stroke-linejoin="round"/>`).join('');
  };

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="Rpm and fuel four times a second">

    <div class="s12 sub" style="margin-top:4px">Top: rpm. Middle: fuel (${U.ru()}). Bands: <span style="color:${engCol(0)}">${engName(0)}</span> and <span style="color:${engCol(1)}">${engName(1)}</span>, solid where the propeller pulls, a thin line where the gear bits say neutral.</div>`;

// ---------- Events and diagnosis ----------
const engName=ch=>{const pi=S.live?S.live.port:0;if(ch>1)return 'Both engines';if(pi<0)return ch===0?'J7':'J6';return (pi===1?ch===1:ch===0)?'Port':'Starboard';};
const engCol=ch=>{const pi=S.live?S.live.port:0;return (pi===1?ch===1:ch===0)?'var(--port)':'var(--stbd)';};
const TT=v=>NF(U.temp(v),0)+' '+U.tu();
const PCT=v=>NF(Math.abs(v)*100,0)+' %';
const HEX=v=>'0x'+(v>>>0).toString(16).toUpperCase().padStart(4,'0');
// What each event means: a title from the measured values, then what to check.
const EVT={
  'cool-high':[e=>`Coolant ${TT(e.v)}`,e=>`Above the warning limit of ${TT(e.ref)}. Check the raw-water intake and strainer, the impeller and the heat exchanger, and lower the rpm until it is back to normal.`],
  'cool-crit':[e=>`Coolant ${TT(e.v)}, too hot`,e=>`Above ${TT(e.ref)}. Go to idle and find the cause before going on: raw-water intake, impeller, heat exchanger and coolant level.`],
  'air-high':[e=>`Charge air ${TT(e.v)}`,e=>`Above ${TT(e.ref)} after the intercooler. A dirty intercooler or too little cooling water; the engine loses power.`],
  'volt-low':[e=>`Battery ${NF(e.v,1)} V while running`,e=>`Below ${NF(e.ref,1)} V for half a minute: the alternator is probably not charging. Check the belt, the alternator and its wiring.`],
  'volt-high':[e=>`Battery ${NF(e.v,1)} V`,e=>`Above ${NF(e.ref,1)} V: the alternator may be overcharging, which harms the batteries.`],
  'rpm-short':[e=>`${NF(e.v,0)} rpm, the lever asks ${NF(e.ref,0)}`,e=>`At part throttle the engine should reach the rpm the lever asks for. Typical causes: fuel filter, air filter, turbo or compressor, a damaged or fouled propeller.`],
  'rpm-hunt':[e=>`Rpm swings ±${NF(e.v,0)}`,e=>`The rpm goes up and down while the lever is still. Often air in the fuel, a clogged fuel filter or an injection problem.`],
  'dev-cool':[e=>`Coolant ${TT(e.v)}, normally ${TT(e.ref)}`,e=>`Warmer than this engine usually runs at this rpm, for some time. An early sign of a worn impeller or a blocked heat exchanger.`],
  'dev-boost':[e=>`Boost ${PCT(1-e.v/e.ref)} below normal`,e=>`Less boost than this engine usually has at this rpm. Check the air filter, the turbo, and the compressor and its clutch.`],
  'dev-air':[e=>`Charge air ${TT(e.v)}, normally ${TT(e.ref)}`,e=>`The intercooler cools less than usual: dirt on the air side or scale on the water side.`],
  'dev-fuel':[e=>`Fuel ${PCT(e.v/e.ref-1)} above normal`,e=>`More fuel than usual at this rpm: fouling on the hull or propeller, a heavy load, or the engine works harder.`],
  'imb-fuel':[e=>`${PCT(e.v)} more fuel than the other engine`,e=>`At the same rpm, for a while. Compare boost and temperatures of the two engines under "Port and starboard", and the propellers.`],
  'imb-boost':[e=>`${PCT(e.v)} less boost than the other engine`,e=>`At the same rpm. Check the air filter, turbo and compressor of this engine.`],
  'comm-lost':[e=>`Stopped answering while running`,e=>`No answer for ${NF(e.v,0)} seconds above idle. Check the J1708 connector and cable to this engine.`],
  'stopped':[e=>`Stopped from ${NF(e.ref,0)} rpm`,e=>`The engine went from ${NF(e.ref,0)} rpm to a stop within seconds. If nobody switched it off, check the fuel supply first.`],
  'overspeed':[e=>`Overspeed ${NF(e.v,0)} rpm`,e=>`Above ${NF(e.ref,0)} rpm. Usually the propeller left the water.`],
  'cold-load':[e=>`High rpm at ${TT(e.v)} coolant`,e=>`Full throttle before the engine is warm wears it faster. Wait until the warm-up guide on the Trip page says ready.`],
  'status':[e=>`Status bits changed`,e=>`From ${HEX(e.ref)} to ${HEX(e.v)}. A lamp, relay or switch changed. Note what you saw on the panel: it helps to decode these bits.`],
  'long-idle':[e=>`Idled for 20 minutes`,e=>`Long idling makes a diesel soot up. Run it under load now and then.`],
  'stays-cold':[e=>`Coolant only ${TT(e.v)} after 20 minutes`,e=>`The engine does not warm up under load. The thermostat may be stuck open.`],
  'mark':[e=>`You marked this moment`,e=>`The two minutes before and after are saved. The curves below show what both engines did.`],
  'pull-neutral':[e=>`Propeller still pulled ${NF(e.v,1)} s after neutral`,e=>`The gear bits said neutral, but the engine kept working as if in gear (more fuel at the same idle rpm) for more than ${NF(e.ref,1)} s. The clutch in the drive did not let go in time. Have the shift actuator, its cable and the drive's cone clutch checked before manoeuvring close to anything. Until then: stop the engine with the key if a drive does not go to neutral.`],
  'hard-shift':[e=>e.ref===2?`Shift at ${NF(e.v,0)} rpm`:`Fast shift between forward and reverse`,e=>e.ref===2?`A shift above idle loads the cone clutch hard. Bring the rpm down to idle first, then shift.`:`Forward to reverse (or back) with ${e.v>0?'only '+NF(e.v/1000,1)+' s':'no pause'} in neutral. This wears the cone clutch in the drive: pause a second or two in neutral.`]
};
const SEVC=['var(--blue)','var(--orange)','var(--red)'];
function evTitle(e){const d=EVT[e.t];return (e.eng<2?engName(e.eng)+': ':'')+(d?d[0](e):e.t);}
function evWhen(e){if(!e.utc)return 'Time unknown';const d=new Date(e.utc*1000);return d.toLocaleDateString(LOC,{day:'numeric',month:'short'})+' '+hm(e.utc);}
function alertCard(){
  const lv=S.live;if(!lv||!lv.ev||!lv.ev.last)return '';
  const e=lv.ev.last;
  if(!(lv.ev.alarm||(lv.ev.n>0&&!e.ack&&e.sev>=1)))return '';
  const a=lv.ev.alarm;
  return `<div class="card" style="margin-bottom:12px;border:1px solid ${a?'var(--red)':'var(--orange)'};background:${a?'rgba(255,107,107,.12)':'var(--osoft)'}"><div style="display:flex;gap:12px;align-items:flex-start">${svg(IC.alert,22,a?'var(--red)':'var(--orange)',2)}<div style="flex:1;min-width:0"><div style="font-weight:600;color:${a?'var(--red)':'var(--orange)'}">${esc(evTitle(e))}</div><div class="s12 sub" style="margin-top:2px">${evWhen(e)}${lv.ev.n>1?' · '+lv.ev.n+' new events':''}</div></div></div>
    <div class="grid2" style="gap:8px;margin-top:12px"><button class="btn sm" data-a="page" data-v="events">What it means</button><button class="btn sm" data-a="evAck" data-v="all">Seen</button></div></div>`;
}
// Line chart of one value for both engines. series: JSON from /api/*/series.
const CHARTM=[['rpm','Rpm'],['lph','Fuel'],['cool','Coolant'],['boost','Boost'],['air','Charge air'],['volt','Battery'],['req','Lever']];
function chartVal(m,v){if(v==null)return null;if(m==='cool'||m==='air')return U.temp(v);if(m==='boost')return U.press(v);if(m==='lph')return imp()?v*0.264172:v;return v;}
function chartUnit(m){return m==='rpm'||m==='req'?'rpm':m==='lph'?U.ru():m==='cool'||m==='air'?U.tu():m==='boost'?U.pu():'V';}
function chartSvg(sr,m,mark){
  if(!sr||!sr.t||!sr.t.length)return '<div class="empty">No recording yet.</div>';
  const W=320,H=150,P=[34,8,10,22],t=sr.t,t0=t[0],t1=t[t.length-1]||1;
  const vals=[0,1].map(c=>(sr[m]||[[],[]])[c].map(v=>chartVal(m,v)));
  const all=vals.flat().filter(v=>v!=null);
  if(!all.length)return '<div class="empty">This value was not read during the recording.</div>';
  let lo=Math.min(...all),hi=Math.max(...all);
  // A smallest span per value, so noise at a steady idle does not fill the chart.
  const span=chartVal(m,{rpm:300,req:300,lph:6,cool:10,air:10,boost:20,volt:1}[m]||1)-(m==='cool'||m==='air'?chartVal(m,0):0);
  if(hi-lo<span){const c=(hi+lo)/2;lo=c-span/2;hi=c+span/2;if(lo<0&&Math.min(...all)>=0){hi-=lo;lo=0;}}
  const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;if(lo<0&&Math.min(...all)>=0)lo=0;
  const X=s=>P[0]+(s-t0)/Math.max(1,t1-t0)*(W-P[0]-P[1]),Y=v=>P[2]+(hi-v)/(hi-lo)*(H-P[2]-P[3]);
  const line=c=>{let d='',on=false;vals[c].forEach((v,i)=>{if(v==null){on=false;return;}d+=(on?'L':'M')+X(t[i]).toFixed(1)+' '+Y(v).toFixed(1);on=true;});return d;};
  const dec=m==='volt'?1:m==='boost'&&!imp()?2:0;
  const tick=s=>{if(mark!=null){const d=s-mark;return (d<0?'−':'+')+Math.floor(Math.abs(d)/60)+':'+String(Math.round(Math.abs(d))%60).padStart(2,'0');}return sr.start?hm(sr.start+s):dur(s);};
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="${chartUnit(m)} over time">
    ${[0,0.5,1].map(f=>{const v=lo+(hi-lo)*f,y=Y(v);return `<line x1="${P[0]}" x2="${W-P[1]}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P[0]-4}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="var(--sub)">${NF(+v.toFixed(dec)||0,dec)}</text>`;}).join('')}
    ${mark!=null?`<line x1="${X(mark)}" x2="${X(mark)}" y1="${P[2]}" y2="${H-P[3]}" stroke="var(--orange)" stroke-dasharray="3 3"/>`:''}
    ${[0,1].map(c=>`<path d="${line(c)}" fill="none" stroke="${engCol(c)}" stroke-width="1.8" stroke-linejoin="round"/>`).join('')}
    <text x="${P[0]}" y="${H-6}" font-size="9.5" fill="var(--sub)">${tick(t0)}</text><text x="${W-P[1]}" y="${H-6}" font-size="9.5" fill="var(--sub)" text-anchor="end">${tick(t1)}</text></svg>
    <div class="cth s12 sub" style="margin-top:4px"><span><span style="color:${engCol(0)}">●</span> ${engName(0)} <span style="color:${engCol(1)};margin-left:8px">●</span> ${engName(1)}</span><span>${chartUnit(m)}</span></div>`;
}
function chartBlock(key,sr,mark){
  const m=S.chartM[key]||'rpm';
  return `<div class="seg" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px">${CHARTM.filter(x=>x[0]!=='req'||key!=='recent').map(([k,l])=>`<button class="${m===k?'on':''}" data-a="chartM" data-v="${key}:${k}">${l}</button>`).join('')}</div>${chartSvg(sr,m,mark)}`;
}
function recentCard(){
  return `<div class="card"><div class="cth" style="margin-bottom:10px"><span class="ct">Last 10 minutes</span><span class="s12 sub">every second</span></div>${S.recent?chartBlock('recent',S.recent):'<div class="empty">Loading…</div>'}</div>`;
}
// Port against starboard at the same rpm, from what each engine learned.
function balanceCard(es){
  const lf=S.life;if(!lf)return '';
  const pi=lf.port===1?1:0,sb=1-pi,a=lf.e[pi].base,b=lf.e[sb].base,rows=[];
  for(let i=0;i<a.length;i++)if(a[i]&&b[i])rows.push([1000+i*250+125,a[i],b[i]]);
  const diffPct=(x,y)=>y&&Math.abs(y)>0.5?((x-y)/Math.abs(y)*100):null;
  const cell=(v,unit,bad)=>v==null?'<span class="sub">—</span>':`<span style="color:${Math.abs(v)>=bad?'var(--orange)':'var(--text)'}">${v>=0?'+':''}${NF(v,unit==='%'?0:1)}${unit==='%'?' %':' '+U.tu()}</span>`;

// The rhythm in words: "green steady", "green, dark for a moment every 2 s", "red long, blue short".
function ledWords(p){
  const lit=p.steps.filter(s=>s[0]!=='off'),off=p.steps.filter(s=>s[0]==='off').reduce((a,s)=>a+s[1],0),tot=p.steps.reduce((a,s)=>a+s[1],0);
  if(!off)return lit[0][0]+' steady';
  if(lit.length===1&&off<400&&!p.breathe)return lit[0][0]+', dark for a moment every '+NF(tot/1000,0)+' s';
  return lit.map(s=>s[0]+' '+(s[1]>=600?'long':'short')).join(', ')+(p.breathe?', breathing':'');
}
function ledSwatch(p,col){
  const tot=p.steps.reduce((a,s)=>a+s[1],0)||1;let acc=0;
  const kf=p.steps.map(([c,ms])=>{const a=acc/tot*100;acc+=ms;const colr=c==='off'?'transparent':col[c];return `${NF(a,2).replace(',','.')}%{background:${colr};box-shadow:${c==='off'?'none':'0 0 10px '+colr}}`;}).join('');
  return `<style>@keyframes led-${p.id}{${kf}}</style><span style="width:22px;height:22px;border-radius:50%;flex:none;border:1px solid var(--line);animation:led-${p.id} ${tot}ms ${p.breathe?'ease-in-out':'step-end'} infinite"></span>`;
}
function ledView(){

  h+=`<button class="btn" style="width:100%;margin-top:12px" data-a="ledTest">${svg(IC.bulb,15)}${demo?'Showing on the board: '+esc(demo.name):'Show every pattern on the board ('+Math.round(l.stepMs*(l.patterns.length-1)/1000)+' s)'}</button>`;

// How fast EngineLink reads each engine, and the scan for more values.
function readingBlock(d,es){
  const rd=d.reading;if(!rd)return '';
  const rows=es.map(e=>{const r=rd[e.ch];if(!r)return '';const ds=r.disc||{};
    const found=(ds.found||[]).map(k=>`<span style="display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);margin:0 4px 4px 0">${k}${PNAMES[k]?' · '+esc(PNAMES[k]):''}</span>`).join('');
    return `<div class="rowx"><div class="cth"><span class="rt">${esc(e.name)}</span><span class="rv">${r.polling?NF(r.rate,1)+' requests/s':'Not reading'}</span></div>
      <div class="s12 sub" style="margin-top:3px">${r.polling?`A request every ${NF(r.interval,0)} ms${fin(r.answered)?' · '+NF(r.answered*100,0)+' % answered':''}`:'Turn on reading the engines to see the speed.'}${r.skip&&r.skip.length?' · skipped (no answer): '+r.skip.join(', '):''}</div>

      ${ds.active?`<div class="s12" style="margin-top:8px">${r.polling?'Looking for more values':'Looking for more values, paused: it carries on by itself when the engine answers again (ignition on)'} · at ${256+ds.pos} of 256–447${(ds.found||[]).length?' · found so far:':''}</div><div class="s12" style="margin-top:6px">${found}</div>`
        :ds.done?`<div class="s12" style="margin-top:8px">${(ds.found||[]).length?'This engine answers:':'No values found.'}</div><div class="s12" style="margin-top:6px">${found}</div>`:''}
      ${r.polling&&!ds.active?`<button class="btn" style="width:100%;margin-top:10px" data-a="discover" data-v="${e.ch}">Discover more values</button>`:''}</div>`;}).join('');
  const ew=d.engineWait;
  return `<div class="hd">Reading speed</div><div class="sec">${rows}${d.engineTask?`<div class="rowx"><div class="cth"><span class="rt">Engine reading</span><span class="rv">Own task</span></div><div class="s12 sub" style="margin-top:3px">Runs on its own processor core. ${ew?`Longest wait for the rest of EngineLink: ${NF(ew.max,0)} ms${ew.slow?` · ${ew.slow} waits over 0.1 s`:''}.`:''}</div></div>`:''}<div class="rowx"><div class="s12 sub">EngineLink asks as fast as the engine answers and slows down when answers go missing. Values an engine never answers are skipped. "Discover more values" asks once for every value number from 256 to 447 while the engine is read (about a minute and a half), with the same read request as always: nothing is changed in the engine.</div></div></div>`;
}
// Download speed: a test from memory (network only), and the last big
// download split into finding the trip, reading the SD card and sending.
// Why EngineLink restarted lately, in plain words, with advice for the
// restarts that point at a problem.
function restartsBlock(d){
  const rs=d.restarts||[];if(!rs.length&&!(S.appErrs||[]).length)return '';
  const bad=rs.filter(r=>[4,5,6,7,9,14,15].includes(r.r));
  const brown=rs.some(r=>r.r===9||r.r===14);
  const when=r=>r.utc?new Date(r.utc*1000).toLocaleString(LOC,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Time unknown';
  let h=`<div class="hd">Restarts</div><div class="sec">${rs.slice(0,8).map((r,i)=>`<div class="rowx" style="padding:10px 0"><div class="cth"><span class="rt" style="color:${[4,5,6,7,9,14,15].includes(r.r)?'var(--orange)':'var(--text)'}">${esc((w=>w[0].toUpperCase()+w.slice(1))(RESET[r.r]||'code '+r.r))}</span><span class="rv s13">${i?when(r):'This start'}</span></div><div class="s12 sub" style="margin-top:2px">${r.up?'Had been on for about '+dur(r.up)+' · ':''}version ${esc(r.v)}</div></div>`).join('')}
    ${bad.length?`<div class="rowx"><div class="s13" style="background:var(--osoft);color:var(--orange);border-radius:12px;padding:10px 12px">${brown?'The supply voltage dipped so low that EngineLink restarted. Check the 12 V wiring, the fuse and the connections; starting the engines can pull the battery voltage down.':'EngineLink restarted after a fault and saved what it could. If it happens again, send the technical file (Engine report and files).'}</div></div>`:''}
    ${d.sdRecoveries?`<div class="rowx s12 sub">The SD card stopped working ${d.sdRecoveries} time${d.sdRecoveries>1?'s':''} and was started again by itself.</div>`:''}
    ${(S.appErrs||[]).length?`<div class="rowx"><div class="rt">App errors this time</div>${S.appErrs.slice(-5).map(e=>`<div class="s12 sub" style="margin-top:4px">${esc(e.msg)}</div>`).join('')}</div>`:''}
    <div class="rowx s12 sub">"Power on" is normal: the power was switched off and on. Totals are saved every 30 seconds while an engine runs, so a power cut loses at most that.</div></div>`;
  return h;
}
// A strong signal but slow, jumpy answers from the router: the router's
// 2.4 GHz channel is busy. EngineLink cannot change the router's channel.
function busyHint(d,lv){
  const t=d.linkTune||{},sm=t.small||{},sc=t.scan||{},sp=S.speed;
  if(!(lv.net.rssi>-67))return '';
  if(sp&&!sp.busy&&!sp.err&&sp.kbs>=150)return '';  // the speed test is fast: nothing to fix
  if(t.scanCh&&t.channel&&t.scanCh!==t.channel)return '';  // measured on the router's old channel
  const slowTest=sp&&!sp.busy&&(sp.err||sp.kbs<40||sp.rtt>300);
  if(!slowTest)return '';  // only a slow speed test counts: the router may just answer pings late
  const ch=t.channel;
  return `<div class="s12" style="margin-top:6px;color:var(--orange)">Strong signal, but the router's Wi-Fi is slow${sc.sameChannel?`: ${sc.sameChannel} other network${sc.sameChannel>1?'s':''} share${sc.sameChannel>1?'':'s'} its channel ${ch||''}${sc.sameBest?' (strongest '+sc.sameBest+' dBm)':''}`:''}. EngineLink stays connected, but transfers are slower. A router on automatic channel usually moves to a quieter one by itself.</div>`;
}
function dlBlock(dl,spd){
  const sp=S.speed,secs=ms=>ms<1000?NF(ms,0)+' ms':ms<60000?NF(ms/1000,ms<10000?1:0)+' s':dur(Math.round(ms/1000));
  const via=x=>x.ap?'over the EngineLink Wi-Fi':'over the boat router'+(x.rssi?` (signal ${x.rssi} dBm, ${x.rssi>-60?'strong':x.rssi>-72?'good':'weak'})`:'');
  const verdict=sp&&!sp.busy&&!sp.err?(sp.kbs>=100?'Fast':sp.kbs>=30?'OK':'Slow'):'';
  let h=`<div class="rowx"><div class="cth"><span class="rt">Speed</span><span class="rv">${sp?sp.busy?(sp.msg||'Testing…'):sp.err?'Failed':NF(sp.kbs,0)+' kB/s':''}</span></div>
    <div class="s12 sub" style="margin-top:3px">${verdict||'How fast data gets from EngineLink to this phone.'}</div>
    <button class="btn" style="width:100%;margin-top:10px" data-a="speedTest" ${sp&&sp.busy?'disabled':''}>${sp&&sp.busy?'Testing…':'Test speed'}</button></div>`;
  if(!S.wifiAdv)return h;
  if(dl&&dl.ms>0){
    const other=Math.max(0,dl.ms-dl.findMs-dl.sdMs-dl.netMs),parts=[['Finding the trip',dl.findMs],['Reading the SD card',dl.sdMs],['Sending',dl.netMs],['Other',other]];
    const top=parts.slice().sort((a,b)=>b[1]-a[1])[0];
    h+=`<div class="rowx"><div class="cth"><span class="rt">Last download · ${esc(dl.what)}</span><span class="rv">${NF(dl.bytes/1024,0)} kB · ${secs(dl.ms)}</span></div>
      <div class="s12 sub" style="margin-top:3px">${parts.filter(x=>x[1]>0).map(([k,v])=>`${k} ${secs(v)}`).join(' · ')}, ${via(dl)}.${dl.z&&dl.raw>dl.bytes?` Compressed from ${NF(dl.raw/1024,0)} kB to ${NF(dl.bytes/1024,0)} kB.`:''}</div>

  }
  return h;
}

// Signal strength as four bars of rising height on one baseline (the old

}

async function startRouterConnection(ssid,pass){
  if(!ssid)return toast('Enter the router network name');
  if(!confirm('Switch EngineLink to '+ssid+'? Its own Wi-Fi will turn off. Connect your phone to the router afterwards.'))return;

  wifiScan:async()=>{
    // Keep the last successful list visible while the radio visits other
    // channels. Do not turn a temporary HTTP failure into an empty list.
    const previous=(S.scan&&S.scan.nets)||[];
    S.scan={busy:true,nets:previous,error:''};render(true);
    try{
      const started=await get('/api/wifi/scan?start=1',4000);
      if(started.error)throw Error(started.error);
    }catch(e){
      S.scan={busy:false,nets:previous,error:'Could not start Wi-Fi scan. Try again.'};
      render(true);return;
    }
    const poll=async n=>{
      try{
        const next=await get('/api/wifi/scan',4000);
        if(next.busy&&!next.nets.length)next.nets=(S.scan&&S.scan.nets)||[];
        // Never report an old list as a fresh result after a failed scan.
        S.scan=next;
      }catch(e){
        if(n>=45)S.scan={busy:false,nets:(S.scan&&S.scan.nets)||previous,error:'Network scan timed out. Try again.'};
      }
      render(true);
      if(S.scan&&S.scan.busy&&n<45)setTimeout(()=>poll(n+1),1000);
      else if(S.scan&&S.scan.busy){S.scan={busy:false,nets:(S.scan&&S.scan.nets)||previous,error:'Network scan timed out. Please scan again.'};render(true);}
    };
    setTimeout(()=>poll(0),800);
  },

  speedTest:async()=>{
    // Served by the separate speed-test listener on port 82, never by the main
    // web server: a slow link would hold up every other request.
    const url=new URL(BASE||location.origin,location.href);
    if(url.protocol!=='http:'){S.speed={err:true};render(true);return;}
    url.port='82';const KB=64;
    const once=async()=>{const t0=performance.now(),ac=new AbortController(),id=setTimeout(()=>ac.abort(),20000);
      try{const r=await fetch(url.origin+'/api/speedtest?kb='+KB,{cache:'no-store',signal:ac.signal});if(!r.ok)throw Error('HTTP '+r.status);
        const data=await r.arrayBuffer();if(data.byteLength!==KB*1024)throw Error('Incomplete transfer');
        const ms=performance.now()-t0;return {kb:KB,ms,kbs:KB/(ms/1000)};}
      catch(e){return null;}finally{clearTimeout(id);}};
    // Round trip of a small request (median of 5), for the report.
    const rttOf=async()=>{const v=[];for(let i=0;i<5;i++){const t0=performance.now();try{await fetch(url.origin+'/api/rtt?'+i,{cache:'no-store'});v.push(performance.now()-t0);}catch(e){}}v.sort((a,b)=>a-b);return v.length?Math.round(v[v.length>>1]):0;};
    S.speed={busy:true};render(true);
    const rtt=await rttOf(),m=await once();
    await post('/api/speedlog',{kbs:m?m.kbs.toFixed(1):0,rtt});
    S.speed=m?{...m,rtt}:{err:true};
    await load('state');await load('diag');render(true);
  },

async function fwPoll(){for(let i=0;i<400;i++){await load('fw');const s=S.fw?S.fw.state:0;if(s===2||s===9||s===0||s===4)break;await new Promise(r=>setTimeout(r,1000));}}

function uploadFw(file){
  if(!file)return;
  if(/merged/i.test(file.name)){toast('That is the USB image. Use enginelink-update.bin');return;}
  const x=new XMLHttpRequest(),f=new FormData();f.append('update',file,file.name);
  x.upload.onprogress=e=>{if(e.lengthComputable){S.upload=Math.round(e.loaded/e.total*100);render(true);}};
  x.onload=()=>{S.upload=null;let m='Update finished';try{m=JSON.parse(x.responseText).message;}catch(e){}toast(m);render(true);};
  x.onerror=()=>{S.upload=null;toast('Upload interrupted');render(true);};
  x.open('POST',BASE+'/api/update');x.send(f);S.upload=0;render(true);
}

// ---------- Theme, night mode, screen ----------
// Sunset/sunrise for Danish waters (55.7 N, 12.6 E); good enough to switch to red.
function isNight(){
  const now=new Date(),day=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  const decl=23.44*Math.sin((2*Math.PI/365)*(day-81))*Math.PI/180,lat=55.7*Math.PI/180;
  const ha=Math.acos(clamp(-Math.tan(lat)*Math.tan(decl),-1,1))*180/Math.PI/15;
  const noonUtc=12-12.6/15,h=now.getUTCHours()+now.getUTCMinutes()/60;
  return h<noonUtc-ha-0.3||h>noonUtc+ha+0.3;
}
function applyTheme(){
  const night=P.night==='on'||(P.night==='sunset'&&isNight());
  document.documentElement.dataset.theme=night?'night':P.theme==='light'?'light':'dark';
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
}
setInterval(applyTheme,60000);
let lock=null;
async function wake(){
  if(!P.keepOn){if(lock){try{lock.release();}catch(e){}lock=null;}$('#nosleep').pause();return;}
  try{if('wakeLock' in navigator){lock=await navigator.wakeLock.request('screen');return;}}catch(e){}
  // Without a secure connection browsers refuse the wake lock; a silent,
  // invisible looping video keeps most phones awake instead.
  try{await $('#nosleep').play();}catch(e){}
}

// ---------- Report ----------
// The app opened as ?report=trips&ids=1,2 or ?report=engines shows a document
// instead: light, printable, to save as a PDF or send. It reads the same API.
const RQ=new URLSearchParams(location.search);
const kpi=(k,v,u)=>`<div><div class="k">${k}</div><div class="v">${v}${u?` <small>${u}</small>`:''}</div></div>`;
function rEvents(list){
  if(!list.length)return '<div class="r-sub">Nothing noticed.</div>';
  return list.map(e=>{const d=EVT[e.t];return `<div class="r-ev"><i style="background:${SEVC[e.sev]||SEVC[0]}"></i><div><b>${esc(evTitle(e))}</b><div class="r-sub">${evWhen(e)}${e.sev===2?' · alarm':e.sev===1?' · warning':''}</div>${d?`<div style="margin-top:3px">${esc(d[1](e))}</div>`:''}</div></div>`;}).join('');
}
// Joins the logs of a combined trip, with a break between the parts.
function rJoin(list){
  const ok=list.filter(Boolean);if(!ok.length)return null;
  const out={start:ok[0].start,t:[]},cols=['rpm','req','lph','cool','air','boost','volt'];cols.forEach(c=>out[c]=[[],[]]);
  ok.forEach((sr,i)=>{const off=sr.start&&ok[0].start?sr.start-ok[0].start:(out.t.length?out.t[out.t.length-1]+60:0);
    if(i){out.t.push(off-1);cols.forEach(c=>{out[c][0].push(null);out[c][1].push(null);});}
    sr.t.forEach((s,k)=>{out.t.push(off+s);cols.forEach(c=>{for(let e=0;e<2;e++)out[c][e].push(sr[c]&&sr[c][e]?sr[c][e][k]:null);});});});
  return out;
}
// Share of the running seconds with fresh engine data, from the board's count.
function covSum(list){
  const out=[0,1].map(()=>({good:0,missing:0,fuel:0,longest:0,gaps:0}));let any=false;
  for(const sr of list)if(sr&&sr.cov){any=true;sr.cov.forEach((c,i)=>{const o=out[i];o.good+=c.good;o.missing+=c.missing;o.fuel+=c.fuel;o.longest=Math.max(o.longest,c.longest);o.gaps+=c.gaps;});}
  return any?out:null;
}
const covPct=c=>c&&c.good+c.missing>0?c.good/(c.good+c.missing)*100:null;
function covText(c){const p=covPct(c);if(p==null)return '—';return NF(Math.floor(p*10)/10,p>=99.95?0:1)+' %';}
function covNote(cov,names){
  if(!cov)return '';
  return names.map(([n,i])=>{const c=cov[i];if(!c||c.good+c.missing===0)return '';const fp=c.good+c.missing?c.fuel/(c.good+c.missing)*100:0;
    return `${n}: ${covText(c)} of the running time read${c.gaps?`, ${c.gaps} gap${c.gaps>1?'s':''} over 3 s, the longest ${dur2(c.longest)}`:', no gaps'}${fp<98?`, fuel answers ${NF(fp,0)} %`:''}.`;}).filter(Boolean).join(' ');
}
const dur2=s=>s<90?NF(s,0)+' s':dur(s);
function rCharts(sr){
  if(!sr)return '<div class="r-sub">No second-by-second log for this trip. EngineLink records one on the SD card from version 0.7.0.</div>';
  return `<div class="r-charts">${[['rpm','Engine speed'],['lph','Fuel'],['cool','Coolant'],['boost','Boost']].map(([m,n])=>`<div class="r-chart"><div class="ct">${n}</div>${chartSvg(sr,m)}</div>`).join('')}</div>`;
}
function rAccuracy(){
  const c=S.fuel&&S.fuel.cal;
  if(!c||!c.n)return 'Fuel figures are not calibrated with fill-ups yet, so they can be off by 15 % or more.';
  return `Fuel figures within about ±${NF(Math.max(c.sig,0.005)*200,1)} %, calibrated from ${c.n} fill-up${c.n>1?'s':''}.`;
}
function rTools(){return `<div class="r-tools"><button class="rtool" data-a="rClose">Close</button><button class="rtool pri" data-a="rPrint">${svg(IC.doc,16,'currentColor',2)}Save as PDF or print</button></div>`;}
function rHead(title,sub){
  const now=new Date();
  return `<div class="r-brand">${svg(IC.engines,18,'var(--teal)',2)}EngineLink<span class="r-sub" style="margin-left:auto;font-weight:400">Made ${now.toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'})} ${hm(now.getTime()/1000)}</span></div><h1>${title}</h1><div class="r-sub">${sub}</div>`;
}
function rFoot(){
  const lv=S.live,es=engines();
  return `<div class="r-foot">${rAccuracy()}<br>EngineLink ${esc(lv?lv.v:'')}${es.length?' · engine hours '+es.map(e=>e.name+' '+(fin(e.hrs)?NF(e.hrs,1)+' h':'—')).join(', '):''}. EngineLink only reads the engines.</div>`;
}
async function reportTrips(ids){
  const us=units().filter(u=>u.ids.some(i=>ids.includes(i))).sort((a,b)=>(a.s||0)-(b.s||0));
  if(!us.length)return rHead('Trip report','These trips are no longer on EngineLink.');
  const evs=S.events?S.events.list:[],price=S.live?S.live.price:0,pi=S.live?S.live.port:0,port=pi===1?1:0,stbd=1-port;
  const pn=pi<0?'J7':'Port',sn=pi<0?'J6':'Starboard';
  const tot=us.reduce((a,u)=>a+u.fuel,0),run=us.reduce((a,u)=>a+u.run,0),max=Math.max(...us.flatMap(u=>u.parts.map(p=>p.max||0)));
  const first=us[0].s,last=us[us.length-1].s,dfmt=s=>new Date(s*1000).toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  document.title='EngineLink trip report '+new Date(first*1000).toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
  let h=rHead('Trip report',(dayKey(first)===dayKey(last)?dfmt(first):dfmt(first)+' – '+dfmt(last))+' · '+us.length+' trip'+(us.length>1?'s':''));
  if(us.length>1)h+=`<div class="r-kpis">${kpi('Running',dur(run))}${kpi('Fuel',L(tot,1),U.vu())}${kpi('Average',run>60?L(tot/(run/3600),1):'—',U.ru())}${kpi('Highest rpm',max?NF(max,0):'—')}${price>0?kpi('Cost',money(tot*price)):''}</div>`;
  const series=await Promise.all(us.map(u=>Promise.all(u.parts.map(p=>get('/api/trip/series?id='+p.id,15000).catch(()=>null)))));
  us.forEach((u,i)=>{
    const sr=rJoin(series[i]),mx=Math.max(...u.parts.map(p=>p.max||0)),nl=noteLine(u.note),cov=covSum(series[i]);
    const diff=u.l[port]>0.5?(u.l[stbd]/u.l[port]-1)*100:null;
    const mine=evs.filter(e=>e.utc&&e.utc>=u.s-30&&e.utc<=(u.e||u.s)+60).sort((a,b)=>a.utc-b.utc);
    h+=`<div class="r-sec"><h2>${new Date(u.s*1000).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'short'})} · ${hm(u.s)} – ${hm(u.e)}</h2><div class="r-sub">${dur(u.run)} running${u.combined?' · '+u.parts.length+' trips combined':''}${nl?' · '+esc(nl):''}</div>
      <div class="r-kpis">${kpi('Fuel',L(u.fuel,1),U.vu())}${kpi(pn,L(u.l[port],1),U.vu())}${kpi(sn,L(u.l[stbd],1),U.vu())}${kpi('Average',u.run>60?L(u.fuel/(u.run/3600),1):'—',U.ru())}${kpi('Highest rpm',mx?NF(mx,0):'—')}${price>0?kpi('Cost',money(u.fuel*price)):''}</div>
      ${cov?`<div class="r-kpis">${[[pn,port],[sn,stbd]].map(([n,c])=>{const pc=covPct(cov[c]);return kpi(n+' data read',`<span style="color:${pc!=null&&pc<97?'var(--orange)':'inherit'}">${covText(cov[c])}</span>`);}).join('')}</div><div class="r-sub" style="margin-top:6px">${covNote(cov,[[pn,port],[sn,stbd]])}</div>`:''}
      ${diff!=null&&Math.abs(diff)>=8?`<div class="r-sub" style="margin-top:8px;color:var(--orange)">${sn} used ${NF(Math.abs(diff),0)} % ${diff>0?'more':'less'} fuel than ${pn.toLowerCase()} on this trip.</div>`:''}
      <h3>Curves</h3>${rCharts(sr)}
      <h3>What EngineLink noticed</h3>${rEvents(mine)}</div>`;
  });
  return h;
}
function reportEngines(){
  const es=engines(),ev=S.events?S.events.list.slice().sort((a,b)=>(b.utc||0)-(a.utc||0)):[];
  document.title='EngineLink engine report '+new Date().toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'});
  let h=rHead('Engine report',es.map(e=>e.name).join(' and ')+' · what EngineLink has learned about the engines');
  h+=`<div class="r-kpis">${es.map(e=>kpi(e.name+' hours',fin(e.hrs)?NF(e.hrs,1):'—','h')).join('')}${kpi('Events',ev.length)}${kpi('Not seen yet',S.events?S.events.n:'—')}</div>`;
  h+=`<div class="r-sec"><h2>Events</h2><div class="r-sub">What EngineLink noticed, newest first, with what it usually means.</div><div style="margin-top:6px">${rEvents(ev.slice(0,40))}</div></div>`;
  const bal=balanceCard(es),life=lifeCard(es);
  h+=`<div class="r-sec">${gearCard(es)}</div>`;
  const tw=twinCard(es);if(tw)h+=`<div class="r-sec">${tw}</div>`;
  h+=`<div class="r-sec">${rBoat()}</div>`;
  if(bal)h+=`<div class="r-sec">${bal}</div>`;
  if(life)h+=`<div class="r-sec">${life}</div>`;
  if(S.diag&&S.diag.reading)h+=`<div class="r-sec">${readingBlock(S.diag,es)}</div>`;
  h+=`<div class="r-sec r-noprint"><h2>For help</h2><div class="r-sub">A technical file with the settings and recent data, if someone helps you with EngineLink.</div><button class="rtool" style="margin-top:10px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--track);font-weight:600" data-a="report">${svg(IC.down,16)}Download technical file (JSON)</button></div>`;
  return h;
}
// The boat and the last drive test, for the mechanic.
function rBoat(){
  const b=P.boat||{},t=P.dtest;
  return `<h2>The boat</h2><div style="display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:8px;font-size:13px">${BOAT_SPEC.concat(BOAT_FIELDS.filter(([k])=>b[k]).map(([k,l])=>[l,b[k]])).map(([k,v])=>`<span class="sub">${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>
    <div class="r-sub" style="margin-top:8px">${t&&t.t?'Drive test '+new Date(t.t*1000).toLocaleDateString(LOC)+' ('+(t.place==='sea'?'open water':'at the dock')+'): '+engines().map(e=>{const x=t.e&&t.e[e.ch];return x?e.name+' clutch in '+msTxt(x.engMs)+', out '+msTxt(x.disMs):'';}).filter(Boolean).join(' · '):'No drive test done yet.'}</div>`;
}
// One event for the mechanic: what happened, the curves, the gear story.
function reportEvent(id){
  const e=S.events&&S.events.list.find(x=>x.id===id),es=engines();
  if(!e)return rHead('Event','This event is no longer on EngineLink.');
  const d=EVT[e.t];
  document.title='EngineLink event '+evWhen(e);
  let h=rHead(evTitle(e),evWhen(e)+(e.sev===2?' · alarm':e.sev===1?' · warning':''));
  h+=`<div class="r-sec"><h2>What it means</h2><div style="margin-top:6px">${d?d[1](e):''}</div></div>`;
  const sr=S.evSeries[id],fs=S.evFast[id];
  if(fs&&fs.t&&fs.t.length)h+=`<div class="r-sec"><h2>Four times a second</h2><div class="r-sub">A minute before and after; the dashed line is the moment.</div><div class="r-chart" style="margin-top:8px">${fastChart(fs,e.up*1000-fs.ms0)}</div></div>`;
  if(sr&&sr.t&&sr.t.length)h+=`<div class="r-sec"><h2>Every second</h2><div class="r-charts" style="margin-top:8px">${[['rpm','Rpm'],['req','Lever'],['lph','Fuel'],['cool','Coolant'],['boost','Boost'],['volt','Battery']].map(([m,t])=>`<div class="r-chart"><div class="ct">${t}</div>${chartSvg(sr,m,e.up-sr.up0)}</div>`).join('')}</div></div>`;
  h+=`<div class="r-sec">${gearCard(es)}</div><div class="r-sec">${rBoat()}</div>`;
  return h;
}
async function renderReport(kind){
  const de=document.documentElement;de.classList.add('rpt');de.dataset.theme='light';
  const r=document.createElement('div');r.id='report';r.innerHTML='<div class="empty" style="padding-top:40px">Making the report…</div>';document.body.appendChild(r);
  await loadPrefs();de.dataset.theme='light';
  const g=(u,ms)=>get(u,ms).catch(()=>null);
  [S.live,S.trips,S.fuel,S.events]=await Promise.all([g('/api/live',5000),g('/api/trips',6000),g('/api/fuel',6000),g('/api/events',6000)]);
  if(kind==='engines'||kind==='event')[S.life,S.diag,S.state,S.shifts]=await Promise.all([g('/api/life',6000),g('/api/diag',6000),g('/api/state',6000),g('/api/shifts?n=120',6000)]);
  const evId=+(RQ.get('id')||0);
  if(kind==='event'&&evId)[S.evSeries[evId],S.evFast[evId]]=await Promise.all([g('/api/event/series?id='+evId,10000),g('/api/event/fast?id='+evId,10000)]);
  if(!S.live){r.innerHTML=rTools()+rHead('Report','EngineLink could not be reached. Connect to its Wi-Fi and try again.');return;}
  const body=kind==='engines'?reportEngines():kind==='event'?reportEvent(evId):await reportTrips((RQ.get('ids')||'').split(',').map(Number).filter(Boolean));
  r.innerHTML=rTools()+body+rFoot();
}

{let sw=null;
 document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-swipe]');if(!c||e.target.closest('button'))return;sw={c,x:e.clientX,y:e.clientY,dx:0};c.style.transition='none';});

// App errors: kept for Diagnostics and the technical file; network hiccups
// are expected on a boat and only counted there, real errors get a toast.
function appError(msg){
  msg=String(msg||'Unknown error').slice(0,200);
  (S.appErrs=S.appErrs||[]).push({t:Date.now(),msg});if(S.appErrs.length>20)S.appErrs.shift();
  if(/abort|failed to fetch|load failed|network/i.test(msg))return;
  const now=Date.now();if(now-(S.lastErrToast||0)>15000){S.lastErrToast=now;toast('Something went wrong in the app. Pull down or reopen it if a screen looks wrong.');}
}

addEventListener('unhandledrejection',e=>appError(e.reason&&(e.reason.message||e.reason)));
